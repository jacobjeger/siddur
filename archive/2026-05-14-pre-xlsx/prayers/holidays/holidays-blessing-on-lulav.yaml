  - id: festivals-sukkot-blessing-on-lulav
    title: Blessing on Lulav
    titleHe: נטילת לולב
    text: "בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוׂתָיו, וְצִוָּנוּ עַל נְטִילַת לוּלָב:"
  - id: festivals-sukkot-blessing-on-lulav-1
    title: Blessing on Lulav
    titleHe: נטילת לולב
    instruction: "בפעם הראשון שמברך על הלולב מברך גם שהחיינו:"
    text: "בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם, שֶׁהֶחֱיָנוּ וְקִיְּמָנוּ וְהִגִּיעָנוּ לַזְמַן הַזֶּה:"
