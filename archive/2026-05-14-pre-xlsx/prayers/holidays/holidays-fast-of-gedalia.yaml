      וְהַגּוּף שֶׁלָּךְ
      יְיָ עֲשֵׂה לְמַעַן שְׁמֶךָ:
      אָתָאנוּ עַל שִׁמְךָ־יְיָ
      עֲשֵׂה לְמַעַן שְׁמֶךָ.
      בַּעֲבוּר כְּבוֹד שִׁמְךָ
      כִּי אֵל חַנּוּן וְרַחוּם שְׁמֶךָ:
      לְמַעַן שִׁמְךָ יְיָ
      וְסָלַחְתָּ לַעֲווֹנֵנוּ כִּי רַב־הוּא:
      סְלַח לָנוּ אָבִינוּ
      כִּי בְּרוֹב אִוַּלְתֵּנוּ שָׁגִינוּ.
      מְחַל לָנוּ מַלְכֵּנוּ
      כִּי רַבּוּ עֲווֹנֵינוּ:
      אז טרם נמתחו נבלי שכבים.
      בארץ עד לא דובקו רגבים.
      גַּבָּךְ שבעה דברים היו מגובבים.
      דת וכס ורטיית בנים שובבים.
      הוד גן עדן ועלק הבהבים.
      ומקום כפרה על ידי מקריבים.
      זוהר שם ינון מחולל מחובים.
      חובָּרו אַלְפַּיִם קודם בריאת ישובים.
      טכוסים על רקיע בוטים כשביבים.
      יעורים ומושרשים פני יושב הכרובים.
      כסא היה מונח ברקיע ביצובים.
      למושב מלך ונורא על סביבים.
      מימינו אש דת חקוקה בכתובים.
      נתונה על ברכו בשעשוע אהבים.
      סָדור על הדרום גן רטובים.
      ערוך על הצפון תופת שלהֵבים.
      פני המזרח ירושלים הבנויה במחֲצָבים.
      צפון בתוכה מקדש אל בישובים.
      קבוע באמצע מִזְבֵּחַ כיפור חייבים.
      רבוצה עליו אבן שתיית חֲטובים.
      שם ינון עליה חקוק במכתבים.
      תואר שם המפורש בתווי גילובים.
      שָׁמה בתווך לפני מאזין מאשנבים.
      ליווי תשובה אֶרך לְנִדְוִים וכואבים.
      מעותדת לכיבוס צואים ולהלביש מוטבים.
      הרֵק שמן הטוב על ראש שָׁבִים.
      בכן אתאנו לך עלמים ושָׂבים.
      רַחֵץ מצחן והשלך טימוס סאבים.
      בתפילה יקדמוך בנים שובבים.
      יום יום לדרשך בפיץ ניבים.
      יחשב אמרינו כהקטר דמים וחלבים.
      צפצופינו יקבל כפיסוגי פרים וכשבים.
      חטאינו הצלל בקרקע נטפי מֶרְזָבִים.
  - id: festivals-selichot-fast-of-gedalia-2
    title: Fast of Gedalia
    titleHe: צום גדליה
    instruction: "קרבֵנו אליך ברחיפת רחמיך הרבים:"
    text: |-
      כי־על־רחמיך הרבים אנו בטוחים
      ועל־צדקותיך אנו נשענים
      ולסליחותיך אנו מקוים
  - id: festivals-selichot-fast-of-gedalia-3
    title: Fast of Gedalia
    titleHe: צום גדליה
    instruction: "ולישועתך אנו מצפים:"
    text: |-
      אתה הוא יְיָ מלך
      אוהב צדקות מקדם
      מעביר עוונות עמו
      ומסיר חטאות יראיו
      כורת ברית לראשונים
      וּמְקַיֵּם שבועה לאחרונים:
      אתה־הוא שירדת בענן כבודך על־הר־סיני
      והראית דרכי טובך למשה עבדך
      וארחות חסדיך גלית לו והודעתו
      כי אתה אל רחום וחנון
      ארך אפים ורב־חסד ומרבה להטיב
