id: shacharis-concluding-prayers
name: Concluding Prayers
nameHe: סיום תפילה
category: shacharis
timeContext: shacharis
sections:
  - id: shacharis-ashrei
    title: Ashrei
    titleHe: אשרי
    text: "אַשְׁרֵי יוֹשְׁ֒בֵי בֵיתֶֽךָ עוֹד יְהַלְלֽוּךָ סֶּֽלָה: אַשְׁרֵי הָעָם שֶׁכָּֽכָה לּוֹ אַשְׁרֵי הָעָם שֶׁיְהֹוָה אֱלֺהָיו: תְּהִלָּה לְדָוִד אֲרוֹמִמְךָ אֱלוֹהַי הַמֶּֽלֶךְ וַאֲבָרְ֒כָה שִׁמְךָ לְעוֹלָם וָעֶד: בְּכָל־יוֹם אֲבָרְ֒כֶֽךָ וַאֲהַלְלָה שִׁמְךָ לְעוֹלָם וָעֶד: גָּדוֹל יְהֹוָה וּמְהֻלָּל מְאֹד וְלִגְ֒דֻלָּתוֹ אֵין חֵֽקֶר: דּוֹר לְדוֹר יְשַׁבַּח מַעֲשֶׂיךָ וּגְבוּרֹתֶֽיךָ יַגִּֽידוּ: הֲדַר כְּבוֹד הוֹדֶֽךָ וְדִבְרֵי נִפְלְ֒אֹתֶֽיךָ אָשִֽׂיחָה: וֶעֱזוּז נוֹרְ֒אוֹתֶֽיךָ יֹאמֵֽרוּ וּגְדֻלָּתְ֒ךָ אֲסַפְּ֒רֶֽנָּה: זֵֽכֶר רַב־טוּבְ֒ךָ יַבִּֽיעוּ וְצִדְ֒קָתְ֒ךָ יְרַנֵּֽנוּ: חַנּוּן וְרַחוּם יְהֹוָה אֶֽרֶךְ אַפַּֽיִם וּגְדָל־חָֽסֶד: טוֹב־יְהֹוָה לַכֹּל וְרַחֲמָיו עַל־כָּל־מַעֲשָׂיו: יוֹדֽוּךָ יְהֹוָה כָּל־מַעֲשֶֽׂיךָ וַחֲסִידֶֽיךָ יְבָרְ֒כֽוּכָה: כְּבוֹד מַלְכוּתְ֒ךָ יֹאמֵֽרוּ וּגְבוּרָתְ֒ךָ יְדַבֵּֽרוּ: לְהוֹדִֽיעַ לִבְנֵי הָאָדָם גְּבוּרֹתָיו וּכְבוֹד הֲדַר מַלְכוּתוֹ: מַלְכוּתְ֒ךָ מַלְכוּת כָּל־עֹלָמִים וּמֶמְשַׁלְתְּ֒ךָ בְּכָל־דּוֹר וָדֹר: סוֹמֵךְ יְהֹוָה לְכָל־הַנֹּפְ֒לִים וְזוֹקֵף לְכָל־הַכְּ֒פוּפִים: עֵינֵי־כֹל אֵלֶֽיךָ יְשַׂבֵּֽרוּ וְאַתָּה נוֹתֵן־לָהֶם אֶת־אָכְלָם בְּעִתּוֹ: פּוֹתֵֽחַ אֶת־יָדֶֽךָ וּמַשְׂבִּֽיעַ לְכָל־חַי רָצוֹן: צַדִּיק יְהֹוָה בְּכָל־דְּרָכָיו וְחָסִיד בְּכָל־מַעֲשָׂיו: קָרוֹב יְהֹוָה לְכָל־קֹרְ֒אָיו לְכֹל אֲשֶׁר יִקְרָאֻֽהוּ בֶאֱמֶת: רְצוֹן־יְרֵאָיו יַעֲשֶׂה וְאֶת־שַׁוְעָתָם יִשְׁמַע וְיוֹשִׁיעֵם: שׁוֹמֵר יְהֹוָה אֶת־כָּל־אֹהֲבָיו וְאֵת כָּל־הָרְ֒שָׁעִים יַשְׁמִיד: תְּהִלַּת יְהֹוָה יְדַבֶּר פִּי וִיבָרֵךְ כָּל־בָּשָׂר שֵׁם קָדְשׁוֹ לְעוֹלָם וָעֶד: וַאֲנַֽחְנוּ נְבָרֵךְ יָהּ מֵעַתָּה וְעַד־עוֹלָם הַלְ֒לוּיָהּ:"
  - id: shacharis-lamenatzeach
    title: Lamenatze'ach
    titleHe: למנצח
    instruction: מה שתקנו לאומרו בסוף התפלה מפני שאומר במדרש תלים אמר ר' שמעון בר אבא אתה מוצא י"ח מזמורים מראש הספר ועד פסוק זה ואשרי האיש ולמה רגשו גוים חד הוא כנגד י"ח ברכות שאדם מתפלל בכל יום. אדם אומר לחבירו תתעני צלותך כך דוד המלך לאחר ששר י"ח שירות ותושבחות אמר יענך ה' ביום צרה והכי איתא בירושלמי. ובשבתות ובימים טובים אין אומרים אותו מפני שהוא מזמור של תחנה וגם הוא מתחיל יענך ה' ביום צרה ושבתות וימים טובים אינם ימי צרה אלא ימי שמחה. (אבודרהם)
    text: "לַמְנַצֵּֽחַ מִזְמוֹר לְדָוִד: יַעַנְךָ יְהֹוָה בְּיוֹם צָרָה יְשַׂגֶּבְ֒ךָ שֵׁם אֱלֺהֵי יַעֲקֹב: יִשְׁלַח עֶזְרְךָ מִקֹּֽדֶשׁ וּמִצִּיּוֹן יִסְעָדֶֽךָּ: יִזְכֹּר כָּל מִנְחֹתֶֽיךָ וְעוֹלָתְ֒ךָ יְדַשְּׁ֒נֶה סֶּֽלָה: יִתֶּן לְךָ כִלְ֒בָבֶֽךָ וְכָל עֲצָתְ֒ךָ יְמַלֵּא: נְרַנְּ֒נָה בִּישׁוּעָתֶֽךָ וּבְשֵׁם אֱלֺהֵֽינוּ נִדְגֹּל יְמַלֵּא יְהֹוָה כָּל מִשְׁאֲלוֹתֶֽיךָ: עַתָּה יָדַֽעְתִּי כִּי הוֹשִֽׁיעַ יְהֹוָה מְשִׁיחוֹ יַעֲנֵֽהוּ מִשְּׁ֒מֵי קָדְשׁוֹ בִּגְ֒בוּרוֹת יֵֽשַׁע יְמִינוֹ: אֵֽלֶּה בָרֶֽכֶב וְאֵֽלֶּה בַסּוּסִים וַאֲנַֽחְנוּ בְּשֵׁם יְהֹוָה אֱלֺהֵֽינוּ נַזְכִּיר: הֵֽמָּה כָּרְ֒עוּ וְנָפָֽלוּ וַאֲנַֽחְנוּ קַֽמְנוּ וַנִּתְעוֹדָד: יְהֹוָה הוֹשִׁיעָה הַמֶּֽלֶךְ יַעֲנֵֽנוּ בְיוֹם קָרְאֵֽנוּ:"
  - id: shacharis-uva-letzion
    title: Uva Letzion
    titleHe: ובא לציון
    instruction: מה שתקנו סדר קדושה בסוף התפלה בעבור עמי הארץ המאחרים לבא לתפלה שלא יפסידו שמיעת הקדושה. דאמרינן בשלהי סוטה אמאי קאי עלמא אסדרא דקדושה ואיהא שמיה רבה דאגדתא. ולכך תקנו לתרגם סדר קדושה זה כדי שיבינו עמי הארץ שאין מכירים לדבר בלשון הקדש אלא בלשון תרגום שהיו רגילין לדבר בו באותו זמן. (אבודרהם)
    text: |-
      וּבָא לְצִיּוֹן גּוֹאֵל וּלְשָׁבֵי פֶֽשַׁע בְּיַעֲקֹב נְאֻם יְהֹוָה: וַאֲנִי זֹאת בְּרִיתִי אֹתָם אָמַר יְהֹוָה רוּחִי אֲשֶׁר עָלֶֽיךָ וּדְבָרַי אֲשֶׁר שַֽׂמְתִּי בְּפִֽיךָ לֺא יָמֽוּשׁוּ מִפִּֽיךָ וּמִפִּי זַרְעֲךָ וּמִפִּי זֶֽרַע זַרְעֲךָ אָמַר יְהֹוָה מֵעַתָּה וְעַד עוֹלָם:
      וְאַתָּה קָדוֹשׁ יוֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל: וְקָרָא זֶה אֶל זֶה וְאָמַר: קָדוֹשׁ קָדוֹשׁ קָדוֹשׁ יְהֹוָה צְבָאוֹת מְלֺא כָל הָאָֽרֶץ כְּבוֹדוֹ:
      וּמְ֒קַבְּ֒לִין דֵּין מִן דֵּין וְאָמְ֒רִין קַדִּישׁ בִּשְׁ֒מֵי מְרוֹמָא עִלָּאָה בֵּית שְׁכִינְתֵּהּ קַדִּישׁ עַל אַרְעָא עוֹבַד גְּבוּרְתֵּהּ קַדִּישׁ לְעָלַם וּלְעָלְ֒מֵי עָלְ֒מַיָּא יְהֹוָה צְבָאוֹת, מַלְיָא כָל אַרְעָא זִיו יְקָרֵהּ:
      וַתִּשָּׂאֵֽנִי רֽוּחַ וָאֶשְׁמַע אַחֲרַי קוֹל רַֽעַשׁ גָּדוֹל: בָּרוּךְ כְּבוֹד יְהֹוָה מִמְּ֒קוֹמוֹ:
      וּנְ֒טָלַתְנִי רוּחָא וּשְׁמָעִית בַּתְרַי קָל זִֽיעַ סַגִּיא דִּמְ֒שַׁבְּ֒חִין וְאָמְ֒רִין בְּרִיךְ יְקָרָא דַיהוָֹה מֵאֲתַר בֵּית שְׁכִינְתֵּהּ:
      יְהֹוָה יִמְלֺךְ לְעוֹלָם וָעֶד:
      יְהֹוָה מַלְכוּתֵהּ קָאֵים לְעָלַם וּלְעָלְ֒מֵי עָלְ֒מַיָּא:
      יְהֹוָה אֱלֺהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבוֹתֵֽינוּ שָׁמְ֒רָה זֹאת לְעֹלָם לְיֵֽצֶר מַחְשְׁ֒בוֹת לְבַב עַמֶּֽךָ וְהָכֵן לְבָבָם אֵלֶֽיךָ: וְהוּא רַחוּם יְכַפֵּר עָוֹן וְלֺא יַשְׁחִית וְהִרְבָּה לְהָשִׁיב אַפּוֹ וְלֺא יָעִיר כָּל חֲמָתוֹ: כִּי אַתָּה אֲדֹנָי טוֹב וְסַלָּח וְרַב חֶֽסֶד לְכָל קֹרְ֒אֶֽיךָ: צִדְ֒קָתְ֒ךָ צֶֽדֶק לְעוֹלָם וְתוֹרָתְ֒ךָ אֱמֶת: תִּתֵּן אֱמֶת לְיַעֲקֹב חֶֽסֶד לְאַבְרָהָם אֲשֶׁר נִשְׁבַּֽעְתָּ לַאֲבוֹתֵֽינוּ מִֽימֵי קֶֽדֶם: בָּרוּךְ אֲדֹנָי יוֹם יוֹם יַעֲמָס לָֽנוּ הָאֵל יְשׁוּעָתֵֽנוּ סֶֽלָה: יְהֹוָה צְבָאוֹת עִמָּֽנוּ מִשְׂגָּב לָֽנוּ אֱלֺהֵי יַעֲקֹב סֶֽלָה: יְהֹוָה צְבָאוֹת אַשְׁרֵי אָדָם בֹּטֵֽחַ בָּךְ: יְהֹוָה הוֹשִֽׁיעָה הַמֶּֽלֶךְ יַעֲנֵֽנוּ בְיוֹם קָרְאֵֽנוּ:
      בָּרוּךְ הוּא אֱלֺהֵֽינוּ שֶׁבְּ֒רָאָֽנוּ לִכְ֒בוֹדוֹ וְהִבְדִּילָֽנוּ מִן הַתּוֹעִים וְנָֽתַן לָֽנוּ תּוֹרַת אֱמֶת וְחַיֵּי עוֹלָם נָטַע בְּתוֹכֵֽנוּ הוּא יִפְתַּח לִבֵּֽנוּ בְּתוֹרָתוֹ וְיָשֵׂם בְּלִבֵּֽנוּ אַהֲבָתוֹ וְיִרְאָתוֹ וְלַעֲשׂוֹת רְצוֹנוֹ וּלְעָבְ֒דוֹ בְּלֵבָב שָׁלֵם לְמַֽעַן לֺא נִיגַע לָרִיק וְלֺא נֵלֵד לַבֶּהָלָה:
      יְהִי רָצוֹן מִלְּ֒פָנֶֽיךָ יְהֹוָה אֱלֺהֵֽינוּ וֵאלֺהֵי אֲבוֹתֵֽינוּ שֶׁנִּשְׁמֹר חֻקֶּֽיךָ בָּעוֹלָם הַזֶּה וְנִזְכֶּה וְנִחְיֶה וְנִרְאֶה וְנִירַשׁ טוֹבָה וּבְרָכָה לִשְׁ֒נֵי יְמוֹת הַמָּשִֽׁיחַ וּלְחַיֵּי הָעוֹלָם הַבָּא: לְמַֽעַן יְזַמֶּרְ֒ךָ כָבוֹד וְלֺא יִדֹּם יְהֹוָה אֱלֺהַי לְעוֹלָם אוֹדֶֽךָּ: בָּרוּךְ הַגֶּֽבֶר אֲשֶׁר יִבְטַח בַּיהוָֹה וְהָיָה יְהֹוָה מִבְטַחוֹ: בִּטְ֒חוּ בַיהוָֹה עֲדֵי עַד כִּי בְּיָהּ יְהֹוָה צוּר עוֹלָמִים: וְיִבְטְחוּ בְךָ יוֹדְ֒עֵי שְׁמֶֽךָ כִּי לֺא עָזַֽבְתָּ דֹרְ֒שֶֽׁיךָ יְהֹוָה: יְהֹוָה חָפֵץ לְמַֽעַן צִדְקוֹ יַגְדִּיל תּוֹרָה וְיַאְדִּיר:
  - id: shacharis-kaddish-shalem
    title: Kaddish Shalem
    titleHe: קדיש שלם
    text: |-
      יִתְגַּדַּל וְיִתְקַדַּשׁ שְׁמֵהּ רַבָּא (אָמֵן)
      בְּעָלְ֒מָֽא דִּי־בְרָא כִרְעוּתֵהּ וְיַמְלִיךְ מַלְכוּתֵהּ בְּחַיֵּיכוֹן וּבְיוֹמֵיכוֹן וּבְחַיֵּי דְכָל־בֵּית יִשְׂרָאֵל בַּעֲגָלָא וּבִזְמַן קָרִיב וְאִמְרוּ אָמֵן:
      יְהֵא שְׁמֵהּ רַבָּא מְבָרַךְ לְעָלַם וּלְעָלְ֒מֵי עָלְ֒מַיָּא
      יִתְבָּרַךְ וְיִשְׁתַּבַּח וְיִתְפָּאַר וְיִתְרוֹמַם וְיִתְנַשֵּׂא וְיִתְהַדָּר וְיִתְעַלֶּה וְיִתְהַלָּל שְׁמֵהּ דְקוּדְשָׁא בְּרִיךְ הוּא
      לְעֵֽלָּא מִן־כָּל־ (בעשי"ת לְעֵֽלָּא לְעֵֽלָּא מִכָּל) בִּרְכָתָֽא וְשִׁירָתָֽא תֻּשְׁבְּ֒חָתָֽא וְנֶחָמָתָֽא דַּאֲמִירָן בְּעָלְ֒מָֽא וְאִמְרוּ אָמֵן:
      תִּתְקַבֵּל צְלוֹתְ֒הוֹן וּבָעוּתְ֒הוֹן דְּכָל בֵּית יִשְׂרָאֵל קֳדָם אֲבוּהוֹן דִּי בִשְׁ֒מַיָּא וְאִמְרוּ אָמֵן:
      יְהֵא שְׁלָמָֽא רַבָּֽא מִן־שְׁמַיָּֽא וְחַיִּים עָלֵֽינוּ וְעַל־כָּל־יִשְׂרָאֵל וְאִמְרוּ אָמֵן:
      עוֹשֶׂה שָׁלוֹם (בעשי"ת הַשָּׁלוֹם) בִּמְרוֹמָיו הוּא יַעֲשֶׂה שָׁלוֹם עָלֵֽינוּ וְעַל כָּל יִשְׂרָאֵל וְאִמְרוּ אָמֵן:
  - id: shacharis-alenu
    title: Alenu
    titleHe: עלינו
    text: |-
      עָלֵֽינוּ לְשַׁבֵּֽחַ לַאֲדוֹן הַכֹּל לָתֵת גְּדֻלָּה לְיוֹצֵר בְּרֵאשִׁית שֶׁלֺּא עָשָֽׂנוּ כְּגוֹיֵי הָאֲרָצוֹת וְלֺא שָׂמָֽנוּ כְּמִשְׁפְּחוֹת הָאֲדָמָה שֶׁלֺּא שָׂם חֶלְקֵֽנוּ כָּהֶם וְגוֹרָלֵֽנוּ כְּכָל הֲמוֹנָם: שֶׁהֵם מִשְׁתַּחֲוִים לָהֶֽבֶל וָרִיק וּמִתְפַּלְּ֒לִים אֶל אֵל לֹא יוֹשִֽׁיעַ, וַאֲנַֽחְנוּ כּוֹרְ֒עִים וּמִשְׁתַּחֲוִים וּמוֹדִים לִפְנֵי מֶֽלֶךְ מַלְכֵי הַמְּ֒לָכִים הַקָּדוֹשׁ בָּרוּךְ הוּא, שֶׁהוּא נוֹטֶה שָׁמַֽיִם וְיוֹסֵד אָֽרֶץ, וּמוֹשַׁב יְקָרוֹ בַּשָּׁמַֽיִם מִמַּֽעַל, וּשְׁ֒כִינַת עֻזּוֹ בְּגָבְ֒הֵי מְרוֹמִים, הוּא אֱלֺהֵֽינוּ אֵין עוֹד, אֱמֶת מַלְכֵּֽנוּ אֶֽפֶס זוּלָתוֹ כַּכָּתוּב בְּתוֹרָתוֹ וְיָדַעְתָּ הַיּוֹם וַהֲשֵׁבֹתָ אֶל לְבָבֶֽךָ כִּי יְהֹוָה הוּא הָאֱלֺהִים בַּשָּׁמַֽיִם מִמַּֽעַל וְעַל הָאָֽרֶץ מִתָּֽחַת אֵין עוֹד:
      עַל כֵּן נְקַוֶּה לְךָ יְהֹוָה אֱלֺהֵֽינוּ לִרְאוֹת מְהֵרָה בְּתִפְאֶֽרֶת עֻזֶּֽךָ לְהַעֲבִיר גִּלּוּלִים מִן הָאָֽרֶץ וְהָאֱלִילִים כָּרוֹת יִכָּרֵתוּן לְתַקֵּן עוֹלָם בְּמַלְכוּת שַׁדַּי וְכָל בְּנֵי בָשָׂר יִקְרְאוּ בִשְׁ֒מֶֽךָ, לְהַפְנוֹת אֵלֶֽיךָ כָּל רִשְׁ֒עֵי אָֽרֶץ, יַכִּֽירוּ וְיֵדְ֒עוּ כָּל יוֹשְׁ֒בֵי תֵבֵל כִּי לְךָ תִכְרַע כָּל בֶּֽרֶךְ תִּשָּׁבַע כָּל לָשׁוֹן: לְפָנֶֽיךָ יְהֹוָה אֱלֺהֵֽינוּ יִכְרְעוּ וְיִפֹּֽלוּ, וְלִכְ֒בוֹד שִׁמְךָ יְקָר יִתֵּֽנוּ, וִיקַבְּ֒לוּ כֻלָּם אֶת עֹל מַלְכוּתֶֽךָ, וְתִמְלֺךְ עֲלֵיהֶם מְהֵרָה לְעוֹלָם וָעֶד, כִּי הַמַּלְכוּת שֶׁלְּ֒ךָ הִיא וּלְעֽוֹלְ֒מֵי עַד תִּמְלוֹךְ בְּכָבוֹד, כַּכָּתוּב בְּתוֹרָתֶֽךָ יְהֹוָה יִמְלֺךְ לְעֹלָם וָעֶד: וְנֶאֱמַר וְהָיָה יְהֹוָה לְמֶֽלֶךְ עַל כָּל הָאָֽרֶץ בַּיּוֹם הַהוּא יִהְיֶה יְהֹוָה אֶחָד וּשְׁמוֹ אֶחָד:
  - id: shacharis-mourners-kaddish
    title: Mourner's Kaddish
    titleHe: קדיש יתום
    text: |-
      יִתְגַּדַּל וְיִתְקַדַּשׁ שְׁמֵהּ רַבָּא (אָמֵן)
      בְּעָלְ֒מָֽא דִּי־בְרָא כִרְעוּתֵהּ וְיַמְלִיךְ מַלְכוּתֵהּ בְּחַיֵּיכוֹן וּבְיוֹמֵיכוֹן וּבְחַיֵּי דְכָל־בֵּית יִשְׂרָאֵל בַּעֲגָלָא וּבִזְמַן קָרִיב וְאִמְרוּ אָמֵן:
      יְהֵא שְׁמֵהּ רַבָּא מְבָרַךְ לְעָלַם וּלְעָלְ֒מֵי עָלְ֒מַיָּא
      יִתְבָּרַךְ וְיִשְׁתַּבַּח וְיִתְפָּאַר וְיִתְרוֹמַם וְיִתְנַשֵּׂא וְיִתְהַדָּר וְיִתְעַלֶּה וְיִתְהַלָּל שְׁמֵהּ דְקוּדְשָׁא בְּרִיךְ הוּא
      לְעֵֽלָּא מִן־כָּל־ (בעשי"ת לְעֵֽלָּא לְעֵֽלָּא מִכָּל) בִּרְכָתָֽא וְשִׁירָתָֽא תֻּשְׁבְּ֒חָתָֽא וְנֶחָמָתָֽא דַּאֲמִירָן בְּעָלְ֒מָֽא וְאִמְרוּ אָמֵן:
      יְהֵא שְׁלָמָֽא רַבָּֽא מִן־שְׁמַיָּֽא וְחַיִּים עָלֵֽינוּ וְעַל־כָּל־יִשְׂרָאֵל וְאִמְרוּ אָמֵן:
      עוֹשֶׂה שָׁלוֹם (בעשי"ת הַשָּׁלוֹם) בִּמְרוֹמָיו הוּא יַעֲשֶׂה שָׁלוֹם עָלֵֽינוּ וְעַל כָּל יִשְׂרָאֵל וְאִמְרוּ אָמֵן:
  - id: shacharis-song-of-the-day
    title: Song of the Day
    titleHe: שיר של יום
    instruction: |-
      נהגו לומר בכל ימי השבוע השיר שהיו הלוים אומרים במקדש. ומקורו במס' סופרים (מס' סופרים י"ח, א) לפיכך נהגו העם לומר מזמורים בעונתן. דתנינן תמן (תמיד פ"ז מ"ד) השיר שהיו הלוים אומרים בביהמ"ק וכו'. שכל המזכיר פסוק בעונתו מעלה עליו כאילו בונה מזבח חדש ומקריב עליו קרבן. ע"כ. (עץ יוסף)
      בראשון בשבת:
    text: |-
      הַיּוֹם יוֹם רִאשׁוֹן בַּשַּׁבָּת שֶׁבּוֹ הָיוּ הַלְוִיִּם אוֹמְ֒רִים בְּבֵית הַמִּקְדָּשׁ:
      לְדָוִד מִזְמוֹר לַיהוָֹה הָאָֽרֶץ וּמְלוֹאָהּ תֵּבֵל וְיֽשְׁ֒בֵי בָהּ: כִּי הוּא עַל יַמִּים יְסָדָהּ וְעַל נְהָרוֹת יְכוֹנְ֒נֶֽהָ: מִי יַעֲלֶה בְהַר יְהֹוָה וּמִי יָקוּם בִּמְ֒קוֹם קָדְשׁוֹ: נְקִי כַפַּֽיִם וּבַר לֵבָב אֲשֶׁר לֺא נָשָׂא לַשָּׁוְא נַפְשִׁי וְלֺא נִשְׁבַּע לְמִרְמָה: יִשָּׂא בְרָכָה מֵאֵת יְהֹוָה וּצְדָקָה מֵאֱלֺהֵי יִשְׁעוֹ: זֶה דּוֹר דּוֹרְ֒שָׁיו מְבַקְשֵׁי פָנֶֽיךָ יַעֲקֹב סֶֽלָה: שְׂאוּ שְׁעָרִים רָאשֵׁיכֶם וְהִנָּשְׂ֒אוּ פִּתְ֒חֵי עוֹלָם וְיָבוֹא מֶֽלֶךְ הַכָּבוֹד: מִי זֶה מֶֽלֶךְ הַכָּבוֹד יְהֹוָה עִזּוּז וְגִבּוֹר יְהֹוָה גִּבּוֹר מִלְחָמָה: שְׂאוּ שְׁעָרִים רָאשֵׁיכֶם וּשְׂ֒אוּ פִּתְ֒חֵי עוֹלָם וְיָבוֹא מֶֽלֶךְ הַכָּבוֹד: מִי הוּא זֶה מֶֽלֶךְ הַכָּבוֹד יְהֹוָה צְבָאוֹת הוּא מֶֽלֶךְ הַכָּבוֹד סֶֽלָה:
      בשני בשבת:
      הַיּוֹם יוֹם שֵׁנִי בַּשַּׁבָּת שֶׁבּוֹ הָיוּ הַלְוִיִּם אוֹמְ֒רִים בְּבֵית הַמִּקְדָּשׁ:
      שִׁיר מִזְמוֹר לִבְנֵי קֹֽרַח: גָּדוֹל יְהֹוָה וּמְהֻלָּל מְאֹד בְּעִיר אֱלֺהֵֽינוּ הַר קָדְשׁוֹ: יְפֵה נוֹף מְשׂוֹשׂ כָּל הָאָֽרֶץ הַר צִיּוֹן יַרְכְּתֵי צָפוֹן קִרְיַת מֶֽלֶךְ רָב: אֱלֺהִים בְּאַרְמְנוֹתֶֽיהָ נוֹדַע לְמִשְׂגָּב: כִּי הִנֵּה הַמְּ֒לָכִים נוֹעֲדוּ עָבְ֒רוּ יַחְדָּו: הֵֽמָּה רָאוּ כֵּן תָּמָֽהוּ נִבְהֲלוּ נֶחְפָּֽזוּ: רְעָדָה אֲחָזָֽתַם שָׁם חִיל כַּיּוֹלֵדָה: בְּרֽוּחַ קָדִים תְּשַׁבֵּר אֳנִיּוֹת תַּרְשִׁישׁ: כַּאֲשֶׁר שָׁמַֽעְנוּ כֵּן רָאִֽינוּ בְּעִיר יְהֹוָה צְבָאוֹת בְּעִיר אֱלֺהֵֽינוּ אֱלֺהִים יְכוֹנְ֒נֶֽהָ עַד עוֹלָם סֶֽלָה: דִּמִּֽינוּ אֱלֺהִים חַסְדֶּֽךָ בְּקֶֽרֶב הֵיכָלֶֽךָ: כְּשִׁמְךָ אֱלֺהִים כֵּן תְּהִלָּתְ֒ךָ עַל קַצְוֵי אֶֽרֶץ צֶֽדֶק מָלְ֒אָה יְמִינֶֽךָ: יִשְׂמַח הַר צִיּוֹן תָּגֵֽלְנָה בְּנוֹת יְהוּדָה לְמַֽעַן מִשְׁפָּטֶֽיךָ: סֹֽבּוּ צִיּוֹן וְהַקִּיפֽוּהָ סִפְ֒רוּ מִגְדָּלֶֽיהָ: שִֽׁיתוּ לִבְּ֒כֶם לְחֵילָה פַּסְּ֒גוּ אַרְמְ֒נוֹתֶֽיהָ לְמַֽעַן תְּסַפְּ֒רוּ לְדוֹר אַחֲרוֹן: כִּי זֶה אֱלֺהִים אֱלֺהֵֽינוּ עוֹלָם וָעֶד הוּא יְנַהֲגֵֽנוּ עַל מוּת:
      בשלישי בשבת:
      הַיּוֹם יוֹם שְׁלִישִׁי בַּשַּׁבָּת שֶׁבּוֹ הָיוּ הַלְוִיִּם אוֹמְ֒רִים בְּבֵית הַמִּקְדָּשׁ:
      מִזְמוֹר לְאָסָף אֱלֺהִים נִצָּב בַּעֲדַת אֵל בְּקֶֽרֶב אֱלֺהִים יִשְׁפֹּט: עַד מָתַי תִּשְׁפְּטוּ עָֽוֶל וּפְנֵי רְשָׁעִים תִּשְׂ֒אוּ סֶֽלָה: שִׁפְ֒טוּ דָל וְיָתוֹם עָנִי וָרָשׁ הַצְדִּֽיקוּ: פַּלְּ֒טוּ דַל וְאֶבְיוֹן מִיַּד רְשָׁעִים הַצִּֽילוּ: לֺא יָדְ֒עוּ וְלֺא יָבִֽינוּ בַּחֲשֵׁכָה יִתְהַלָּֽכוּ יִמּֽוֹטוּ כָּל מֽוֹסְ֒דֵי אָֽרֶץ: אֲנִי אָמַֽרְתִּי אֱלֺהִים אַתֶּם וּבְנֵי עֶלְיוֹן כֻּלְּ֒כֶם: אָכֵן כְּאָדָם תְּמוּתוּן וּכְאַחַד הַשָּׂרִים תִּפֹּֽלוּ: קוּמָה אֱלֺהִים שָׁפְ֒טָה הָאָרֶץ כִּי אַתָּה תִנְחַל בְּכָל הַגּוֹיִם:
      ברביעי בשבת:
      הַיּוֹם יוֹם רְבִיעִי בַּשַּׁבָּת שֶׁבּוֹ הָיוּ הַלְוִיִּם אוֹמְ֒רִים בְּבֵית הַמִּקְדָּשׁ:
      אֵל נְקָמוֹת יְהֹוָה אֵל נְקָמוֹת הוֹפִֽיעַ: הִנָּשֵׂא שֹׁפֵט הָאָֽרֶץ הָשֵׁב גְּמוּל עַל גֵּאִים: עַד מָתַי רְשָׁעִים יְהֹוָה עַד מָתַי רְשָׁעִים יַעֲלֺֽזוּ: יַבִּֽיעוּ יְדַבְּ֒רוּ עָתָק יִתְאַמְּ֒רוּ כָּל פֹּֽעֲלֵי אָֽוֶן: עַמְּ֒ךָ יְהֹוָה יְדַכְּ֒אוּ וְנַחֲלָתְ֒ךָ יְעַנּוּ: אַלְמָנָה וְגֵר יַהֲרֹֽגוּ וִיתוֹמִים יְרַצֵּֽחוּ: וַיֹּאמְ֒רוּ לֺא יִרְאֶה יָהּ וְלֺא יָבִין אֱלֺהֵי יַעֲקֹב: בִּֽינוּ בֹּעֲרִים בָּעָם וּכְסִילִים מָתַי תַּשְׂכִּֽילוּ: הֲנֹֽטַע אֹֽזֶן הֲלֺא יִשְׁמָע אִם יוֹצֵר עַֽיִן הֲלֺא יַבִּיט: הֲיֹסֵר גּוֹיִם הֲלֺא יוֹכִֽיחַ הַמְלַמֵּד אָדָם דָּֽעַת: יְהֹוָה יֹדֵֽעַ מַחְשְׁ֒בוֹת אָדָם כִּי הֵֽמָּה הָֽבֶל: אַשְׁרֵי הַגֶּֽבֶר אֲשֶׁר תְּיַסְּ֒רֶֽנּוּ יָהּ וּמִתּוֹרָתְ֒ךָ תְלַמְּ֒דֶֽנּוּ: לְהַשְׁקִיט לוֹ מִֽימֵי רָע עַד יִכָּרֶה לָרָשָׁע שָֽׁחַת: כִּי לֺא יִטּשׁ יְהֹוָה עַמּוֹ וְנַחֲלָתוֹ לֺא יַעֲזֹב: כִּי עַד צֶֽדֶק יָשׁוּב מִשְׁפָּט וְאַחֲרָיו כָּל יִשְׁ֒רֵי לֵב: מִי יָקוּם לִי עִם מְרֵעִים מִי יִתְיַצֵּב לִי עִם פֹּֽעֲלֵי אָֽוֶן: לוּלֵי יְהֹוָה עֶזְרָֽתָה לִּי כִּמְ֒עַט שָׁכְ֒נָה דוּמָה נַפְשִׁי: אִם אָמַֽרְתִּי מָֽטָה רַגְלִי חַסְדְּ֒ךָ יְהֹוָה יִסְעָדֵֽנִי: בְּרֹב שַׂרְעַפַּי בְּקִרְבִּי תַּנְחוּמֶֽיךָ יְשַׁעַשְׁ֒עוּ נַפְשִׁי: הַיְחָבְרְךָ כִּסֵּא הַוָּוֹת יֹצֵר עָמָל עֲלֵי חֹק: יָגֽוֹדּוּ עַל נֶֽפֶשׁ צַדִּיק וְדָם נָקִי יַרְשִֽׁיעוּ: וַיְהִי יְהֹוָה לִי לְמִשְׂגָּב וֵאלֺהַי לְצוּר מַחְסִי: וַיָּֽשֶׁב עֲלֵיהֶם אֶת אוֹנָם וּבְרָעָתָם יַצְמִיתֵם יַצְמִיתֵם יְהֹוָה אֱלֺהֵֽינוּ: לְכוּ נְרַנְּ֒נָה לַיהוָֹה נָרִֽיעָה לְצוּר יִשְׁעֵֽנוּ: נְקַדְּ֒מָה פָנָיו בְּתוֹדָה בִּזְמִרוֹת נָרִֽיעַ לוֹ: כִּי אֵל גָּדוֹל יְהֹוָה וּמֶֽלֶךְ גָּדוֹל עַל כָּל אֱלֺהִים:
      בחמישי בשבת:
      הַיּוֹם יוֹם חֲמִישִׁי בַּשַּׁבָּת שֶׁבּוֹ הָיוּ הַלְוִיִּם אוֹמְ֒רִים בְּבֵית הַמִּקְדָּשׁ:
      לַמְנַצֵּֽחַ עַל הַגִּתִּית לְאָסָף: הַרְנִֽינוּ לֵאלֺהִים עֻזֵּנוּ הָרִֽיעוּ לֵאלֺהֵי יַעֲקֹב: שְׂאוּ זִמְרָה וּתְנוּ תֹף כִּנּוֹר נָעִים עִם נָֽבֶל: תִּקְ֒עוּ בַחֹֽדֶשׁ שׁוֹפָר בַּכֶּֽסֶה לְיוֹם חַגֵּֽנוּ: כִּי חֹק לְיִשְׂרָאֵל הוּא מִשְׁפָּט לֵאלֺהֵי יַעֲקֹב: עֵדוּת בִּיהוֹסֵף שָׂמוֹ בְּצֵאתוֹ עַל אֶֽרֶץ מִצְרָֽיִם שְׂפַת לֺא יָדַֽעְתִּי אֶשְׁמָע: הֲסִירֽוֹתִי מִסֵּֽבֶל שִׁכְמוֹ כַּפָּיו מִדּוּד תַּעֲבֹֽרְ֒נָה: בַּצָּרָה קָרָֽאתָ וָאֲחַלְּ֒צֶֽךָּ אֶעֶנְךָ בְּסֵֽתֶר רַֽעַם אֶבְחָנְ֒ךָ עַל מֵי מְרִיבָה סֶֽלָה: שְׁמַע עַמִּי וְאָעִֽידָה בָּךְ יִשְׂרָאֵל אִם תִּשְׁמַע לִי: לֺא יִהְיֶה בְךָ אֵל זָר וְלֺא תִשְׁתַּחֲוֶה לְאֵל נֵכָר: אָנֹכִי יְהֹוָה אֱלֺהֶֽיךָ הַמַּעַלְךָ מֵאֶֽרֶץ מִצְרָֽיִם הַרְחֶב פִּֽיךָ וַאֲמַלְאֵֽהוּ: וְלֺא שָׁמַע עַמִּי לְקוֹלִי וְיִשְׂרָאֵל לֺא אָֽבָה לִי: וָאֲשַׁלְּ֒חֵֽהוּ בִּשְׁרִירוּת לִבָּם יֵלְ֒כוּ בְּמוֹעֲצוֹתֵיהֶם: לוּ עַמִּי שֹׁמֵֽעַ לִי יִשְׂרָאֵל בִּדְ֒רָכַי יְהַלֵּֽכוּ: כִּמְ֒עַט אוֹיְ֒בֵיהֶם אַכְנִֽיעַ וְעַל צָרֵיהֶם אָשִׁיב יָדִי: מְשַׂנְאֵי יְהֹוָה יְכַחֲשׁוּ לוֹ וִיהִי עִתָּם לְעוֹלָם: וַיַּאֲכִילֵֽהוּ מֵחֵֽלֶב חִטָּה וּמִצּוּר דְּבַשׁ אַשְׂבִּיעֶֽךָּ:
      בשישי בשבת:
      הַיּוֹם יוֹם שִׁשִּׁי בַּשַּׁבָּת שֶׁבּוֹ הָיוּ הַלְוִיִּם אוֹמְ֒רִים בְּבֵית הַמִּקְדָּשׁ:
      יְהֹוָה מָלָךְ גֵּאוּת לָבֵשׁ לָבֵשׁ יְהֹוָה עֹז הִתְאַזָּר אַף תִּכּוֹן תֵּבֵל בַּל תִּמּוֹט: נָכוֹן כִּסְאֲךָ מֵאָז מֵעוֹלָם אָֽתָּה: נָשְׂ֒אוּ נְהָרוֹת יְהֹוָה נָשְׂ֒אוּ נְהָרוֹת קוֹלָם יִשְׂ֒אוּ נְהָרוֹת דָּכְיָם: מִקֹּלוֹת מַֽיִם רַבִּים אַדִּירִים מִשְׁבְּ֒רֵי יָם אַדִּיר בַּמָּרוֹם יְהֹוָה: עֵדֹתֶֽיךָ נֶאֶמְ֒נוּ מְאֹד לְבֵיתְ֒ךָ נָאֲוָה קֹֽדֶשׁ יְהֹוָה לְאֹֽרֶךְ יָמִים:
  - id: shacharis-barchi-nafshi
    title: Barchi Nafshi
    titleHe: ברכי נפשי
    instruction: נוהגין בספרד לומר מזמור ברכי נפשי בראש חדש לפי שיש בו עשה ירח למועדים (טור אורח חיים תכג)
    text: |-
      בָּרְ֒כִי נַפְשִׁי אֶת־יְהֹוָה יְהֹוָה אֱלֺהַי גָּדַֽלְתָּ מְאֹד, הוֹד וְהָדָר לָבָֽשְׁתָּ: עֹֽטֶה אוֹר כַּשַּׂלְמָה, נוֹטֶה שָׁמַֽיִם כַּיְרִיעָה: הַמְקָרֶה בַמַּֽיִם עֲלִיּוֹתָיו הַשָּׂם־עָבִים רְכוּבוֹ, הַמְהַלֵּךְ עַל־כַּנְפֵי־רֽוּחַ: עֹשֶׂה מַלְאָכָיו רוּחוֹת, מְשָׁרְ֒תָיו אֵשׁ לֺהֵט: יָסַד אֶֽרֶץ עַל־מְכוֹנֶֽיהָ, בַּל־תִּמּוֹט עוֹלָם וָעֶד:
      תְּהוֹם כַּלְּ֒בוּשׁ כִּסִּיתוֹ, עַל־הָרִים יַֽעַמְדוּ מָֽיִם: מִן־גַּעֲרָתְ֒ךָ יְנוּסוּן, מִן־קוֹל רַעַמְךָ יֵחָפֵזוּן: יַעֲלוּ הָרִים יֵרְ֒דוּ בְקָעוֹת, אֶל־מְקוֹם זֶה יָסַֽדְתָּ לָהֶם: גְּבוּל־שַֽׂמְתָּ בַּל־יַעֲבֹרוּן, בַּל־יְשֻׁבוּן לְכַסּוֹת הָאָֽרֶץ:
      הַמְשַׁלֵּֽחַ מַעְיָנִים בַּנְּ֒חָלִים, בֵּין הָרִים יְהַלֵּכוּן: יַשְׁקוּ כָּל־חַיְתוֹ שָׂדָי, יִשְׁבְּרוּ פְרָאִים צְמָאָם: עֲלֵיהֶם עוֹף־הַשָּׁמַֽיִם יִשְׁכּוֹן, מִבֵּין עֳפָאִים יִתְּ֒נוּ־קוֹל: מַשְׁקֶה הָרִים מֵעֲלִיּוֹתָיו, מִפְּ֒רִי מַעֲשֶֽׂיךָ תִּשְׂבַּע הָאָֽרֶץ:
      מַצְמִֽיחַ חָצִיר לַבְּ֒הֵמָה וְעֵֽשֶׂב לַעֲבֹדַת הָאָדָם, לְהוֹצִיא לֶֽחֶם מִן־הָאָֽרֶץ: וְיַֽיִן יְשַׂמַּח לְבַב־אֱנוֹשׁ לְהַצְהִיל פָּנִים מִשָּֽׁמֶן, וְלֶֽחֶם לְבַב־אֱנוֹשׁ יִסְעָד: יִשְׂבְּ֒עוּ עֲצֵי יְהֹוָה אַרְזֵי לְבָנוֹן אֲשֶׁר נָטָע: אֲשֶׁר־שָׁם צִפֳּרִים יְקַנֵּֽנוּ, חֲסִידָה בְּרוֹשִׁים בֵּיתָהּ: הָרִים הַגְּ֒בֹהִים לַיְּ֒עֵלִים, סְלָעִים מַחְסֶה לַשְּׁ֒פַנִּים:
      עָשָׂה יָרֵֽחַ לְמוֹעֲדִים שֶֽׁמֶשׁ יָדַע מְבוֹאוֹ: תָּֽשֶׁת חֽשֶׁךְ וִיהִי לָֽיְלָה, בּוֹ־תִרְמֹשׂ כָּל־חַֽיְ֒תוֹ־יָֽעַר: הַכְּ֒פִירִים שֹׁאֲגִים לַטָּֽרֶף, וּלְבַקֵּשׁ מֵאֵל אָכְלָם: תִּזְרַח הַשֶּֽׁמֶשׁ יֵאָסֵפוּן, וְאֶל־מְעוֹנֹתָם יִרְבָּצוּן: יֵצֵא אָדָם לְפָעֳלוֹ, וְלַעֲבֹדָתוֹ עֲדֵי־עָֽרֶב:
      מָה־רַבּוּ מַעֲשֶֽׂיךָ יְהֹוָה כֻּלָּם בְּחָכְמָה עָשִֽׂיתָ, מָלְ֒אָה הָאָֽרֶץ קִנְיָנֶֽךָ: זֶה הַיָּם גָּדוֹל וּרְחַב יָדָֽיִם שָׁם־רֶֽמֶשׂ וְאֵין מִסְפָּר, חַיּוֹת קְטַנּוֹת עִם־גְּדֹלוֹת: שָׁם אֳנִיּוֹת יְהַלֵּכוּן, לִוְיָתָן זֶה יָצַֽרְתָּ לְשַֽׂחֶק־בּוֹ: כֻּלָּם אֵלֶֽיךָ יְשַׂבֵּרוּן, לָתֵת אָכְלָם בְּעִתּוֹ: תִּתֵּן לָהֶם יִלְקֹטוּן, תִּפְתַּח יָדְ֒ךָ יִשְׂבְּעוּן טוֹב: תַּסְתִּיר פָּנֶֽיךָ יִבָּהֵלוּן תֹּסֵף רוּחָם יִגְוָעוּן, וְאֶל־עֲפָרָם יְשׁוּבוּן: תְּשַׁלַּח רוּחֲךָ יִבָּרֵאוּן, וּתְחַדֵּשׁ פְּנֵי אֲדָמָה:
      יְהִי כְבוֹד יְהֹוָה לְעוֹלָם, יִשְׂמַח יְהֹוָה בְּמַעֲשָׂיו: הַמַּבִּיט לָאָֽרֶץ וַתִּרְעָד, יִגַּע בֶּהָרִים וְיֶעֱשָֽׁנוּ: אָשִֽׁירָה לַּיהוָֹה בְּחַיָּי, אֲזַמְּ֒רָה לֵאלֺהַי בְּעוֹדִי: יֶעֱרַב עָלָיו שִׂיחִי, אָנֹכִי אֶשְׂמַח בַּיהוָֹה: יִתַּֽמּוּ חַטָּאִים מִן־הָאָֽרֶץ וּרְשָׁעִים עוֹד אֵינָם בָּרְ֒כִי נַפְשִׁי אֶת־יְהֹוָה הַלְ֒לוּיָהּ:
  - id: shacharis-ledavid
    title: LeDavid
    titleHe: לדוד
    instruction: מנהג טוב לומר אחר כל תפלה מזמור לדוד ה׳‬ אורי וישעי. ובפרט מר״ח אלול עד הושענא רבא (מורה באצבע סי' לז).
    text: |-
      לְדָוִד יְהֹוָה אוֹרִי וְיִשְׁעִי מִמִּי אִירָא יְהֹוָה מָעוֹז חַיַּי מִמִּי אֶפְחָד: בִּקְ֒רֹב עָלַי מְרֵעִים לֶאֱכֹל אֶת בְּשָׂרִי צָרַי וְאֹיְ֒בַי לִי הֵֽמָּה כָשְׁ֒לוּ וְנָפָֽלוּ: אִם תַּחֲנֶה עָלַי מַחֲנֶה לֺא יִירָא לִבִּי אִם תָּקוּם עָלַי מִלְחָמָה בְּזֹאת אֲנִי בוֹטֵֽחַ: אַחַת שָׁאַֽלְתִּי מֵאֵת יְהֹוָה אוֹתָהּ אֲבַקֵּשׁ שִׁבְתִּי בְּבֵית יְהֹוָה כָּל יְמֵי חַיַּי לַחֲזוֹת בְּנֹֽעַם יְהֹוָה וּלְבַקֵּר בְּהֵיכָלוֹ: כִּי יִצְפְּ֒נֵֽנִי בְּסֻכֹּה בְּיוֹם רָעָה יַסְתִּרֵֽנִי בְּסֵֽתֶר אָהֳלוֹ בְּצוּר יְרוֹמְ֒מֵֽנִי: וְעַתָּה יָרוּם רֹאשִׁי עַל אֹיְ֒בַי סְבִיבוֹתָי וְאֶזְבְּחָה בְאָהֳלוֹ זִבְחֵי תְרוּעָה אָשִֽׁירָה וַאֲזַמְּ֒רָה לַיהוָֹה: שְׁמַע יְהֹוָה קוֹלִי אֶקְרָא וְחָנֵּֽנִי וַעֲנֵֽנִי: לְךָ אָמַר לִבִּי בַּקְּ֒שׁוּ פָנָי אֶת פָּנֶֽיךָ יְהֹוָה אֲבַקֵּשׁ: אַל תַּסְתֵּר פָּנֶֽיךָ מִמֶּֽנִּי אַל תַּט בְּאַף עַבְדֶּֽךָ עֶזְרָתִי הָיִֽיתָ אַל תִּטְּ֒שֵֽׁנִי וְאַל תַּעַזְבֵֽנִי אֱלֺהֵי יִשְׁעִי: כִּי אָבִי וְאִמִּי עֲזָבֽוּנִי וַיהוָֹה יַאַסְפֵֽנִי: הוֹרֵֽנִי יְהֹוָה דַּרְכֶּֽךָ וּנְחֵֽנִי בְּאֹֽרַח מִישׁוֹר לְמַֽעַן שׁוֹרְ֒רָי: אַל תִּתְּ֒נֵֽנִי בְּנֶֽפֶשׁ צָרָי כִּי קָֽמוּ בִי עֵֽדֵי שֶֽׁקֶר וִיפֵֽחַ חָמָס: לוּלֵא הֶאֱמַֽנְתִּי לִרְאוֹת בְּטוּב יְהֹוָה בְּאֶֽרֶץ חַיִּים: קַוֵּה אֶל יְהֹוָה חֲזַק וְיַאֲמֵץ לִבֶּךָ וְקַוֵּה אֶל יְהֹוָה:
      יִתְגַּדַּל וְיִתְקַדַּשׁ שְׁמֵהּ רַבָּא (אָמֵן)
      בְּעָלְ֒מָֽא דִּי־בְרָא כִרְעוּתֵהּ וְיַמְלִיךְ מַלְכוּתֵהּ בְּחַיֵּיכוֹן וּבְיוֹמֵיכוֹן וּבְחַיֵּי דְכָל־בֵּית יִשְׂרָאֵל בַּעֲגָלָא וּבִזְמַן קָרִיב וְאִמְרוּ אָמֵן:
      יְהֵא שְׁמֵהּ רַבָּא מְבָרַךְ לְעָלַם וּלְעָלְ֒מֵי עָלְ֒מַיָּא
      יִתְבָּרַךְ וְיִשְׁתַּבַּח וְיִתְפָּאַר וְיִתְרוֹמַם וְיִתְנַשֵּׂא וְיִתְהַדָּר וְיִתְעַלֶּה וְיִתְהַלָּל שְׁמֵהּ דְקוּדְשָׁא בְּרִיךְ הוּא
      לְעֵֽלָּא מִן־כָּל־ (בעשי"ת לְעֵֽלָּא לְעֵֽלָּא מִכָּל) בִּרְכָתָֽא וְשִׁירָתָֽא תֻּשְׁבְּ֒חָתָֽא וְנֶחָמָתָֽא דַּאֲמִירָן בְּעָלְ֒מָֽא וְאִמְרוּ אָמֵן:
      יְהֵא שְׁלָמָֽא רַבָּֽא מִן־שְׁמַיָּֽא וְחַיִּים עָלֵֽינוּ וְעַל־כָּל־יִשְׂרָאֵל וְאִמְרוּ אָמֵן:
      עוֹשֶׂה שָׁלוֹם (בעשי"ת הַשָּׁלוֹם) בִּמְרוֹמָיו הוּא יַעֲשֶׂה שָׁלוֹם עָלֵֽינוּ וְעַל כָּל יִשְׂרָאֵל וְאִמְרוּ אָמֵן:
  - id: shacharis-ein-kelohenu
    title: Ein Kelohenu
    titleHe: אין כאלוהינו
    text: |-
      קַוֵּה אֶל יְהֹוָה חֲזַק וְיַאֲמֵץ לִבֶּךָ וְקַוֵּה אֶל יְהֹוָה: אֵין קָדוֹשׁ כַּיהֹוָה כִּי אֵין בִּלְתֶּךָ וְאֵין צוּר כֵּאלֹהֵינוּ: כִּי מִי אֱלוֹהַּ מִבַּלְעֲדֵי יְהֹוָה וּמִי צוּר זוּלָתִי אֱלֹהֵינוּ:
      אֵין כֵּאלֹהֵינוּ. אֵין כַּאדוֹנֵנוּ. אֵין כְּמַלְכֵּנוּ. אֵין כְּמוֹשִׁיעֵנוּ: מִי כֵאלֹהֵינוּ. מִי כַאדוֹנֵנוּ. מִי כְמַלְכֵּנוּ. מִי כְמוֹשִׁיעֵנוּ: נוֹדֶה לֵאלֹהֵינוּ. נוֹדֶה לַאדוֹנֵנוּ. נוֹדֶה לְמַלְכֵּנוּ. נוֹדֶה לְמוֹשִׁיעֵנוּ: בָּרוּךְ אֱלֹהֵינוּ. בָּרוּךְ אֲדוֹנֵנוּ. בָּרוּךְ מַלְכֵּנוּ. בָּרוּךְ מוֹשִׁיעֵנוּ: אַתָּה הוּא אֱלֹהֵינוּ. אַתָּה הוּא אֲדוֹנֵנוּ. אַתָּה הוּא מַלְכֵּנוּ. אַתָּה הוּא מוֹשִׁיעֵנוּ.
      אַתָּה הוּא (בחלק מהמהדורות: יְהֹוָה אֱלֹהֵינוּ) שֶׁהִקְטִרוּ אֲבוֹתֵינוּ לְפָנֶיךָ אֶת קְטֹרֶת הַסַּמִּים:
  - id: shacharis-pitum-haketoret
    title: Pitum HaKetoret
    titleHe: פטום קטורת
    text: |-
      פִּטּוּם הַקְּ֒טֹֽרֶת הַצֳּרִי וְהַצִּפֹּֽרֶן הַחֶלְבְּ֒נָה וְהַלְּ֒בוֹנָה מִשְׁקַל שִׁבְעִים שִׁבְעִים מָנֶה, מוֹר וּקְצִיעָה שִׁבֹּֽלֶת נֵרְדְּ וְכַרְכֹּם מִשְׁקַל שִׁשָּׁה עָשָׂר שִׁשָּׁה עָשָׂר מָנֶה, הַקּשְׁטְ שְׁנֵים עָשָׂר וְקִלּוּפָה שְׁלשָׁה וְקִנָּמוֹן תִּשְׁעָה, בֹּרִית כַּרְשִׁינָה תִּשְׁעָה קַבִּין, יֵין קַפְרִיסִין סְאִין תְּלָתָא וְקַבִּין תְּלָתָא, וְאִם אֵין לוֹ יֵין קַפְרִיסִין מֵבִיא חֲמַר חִוַּרְיָן עַתִּיק, מֶֽלַח סְדוֹמִית רֹֽבַע הַקָּב, מַעֲלֶה עָשָׁן כָּל שֶׁהוּא, רַבִּי נָתָן הַבַּבְלִי אוֹמֵר אַף כִּפַּת הַיַּרְדֵּן כָּל שֶׁהוּא, וְאִם נָֽתַן בָּהּ דְּבַשׁ פְּסָלָהּ וְאִם חִסַּר אַחַת מִכָּל־סַמָּנֶֽיהָ חַיָּב מִיתָה:
      רַבָּן שִׁמְעוֹן בֶּן גַּמְלִיאֵל אוֹמֵר הַצֳּרִי אֵינוֹ אֶלָּא שְׂרָף הַנּוֹטֵף מֵעֲצֵי הַקְּ֒טָף, בֹּרִית כַּרְשִׁינָה לָמָּה הִיא בָֽאָה כְּדֵי לְיַפּוֹת בָּהּ אֶת הַצִּפֹּרֶן כְּדֵי שֶׁתְּ֒הֵא נָאָה. יֵין קַפְרִיסִין לָמָּה הוּא בָא כְּדֵי לִשְׁרוֹת בּוֹ אֶת הַצִפֹּרֶן כְּדֵי שֶׁתְּ֒הֵא עַזָּה. וַהֲלֹא מֵי רַגְלַֽיִם יָפִין לָהּ אֶלָּא שֶׁאֵין מַכְנִיסִין מֵי רַגְלַֽיִם בַּמִּקְדָּשׁ מִפְּ֒נֵי הַכָּבוֹד:
      תָּנָא דְבֵי אֵלִיָּֽהוּ כָּל הַשּׁוֹנֶה הֲלָכוֹת בְּכָל יוֹם מֻבְטָח לוֹ שֶׁהוּא בֶּן עוֹלָם הַבָּא שֶׁנֶּאֱמַר הֲלִיכוֹת עוֹלָם לוֹ אַל תִּקְרֵי הֲלִיכוֹת אֶלָּא הֲלָכוֹת:
      אָמַר רַבִּי אֶלְעָזָר אָמַר רַבִּי חֲנִינָא. תַּלְמִידֵי חֲכָמִים מַרְבִּים שָׁלוֹם בָּעוֹלָם. שֶׁנֶּאֱמַר וְכָל בָּנַֽיִךְ לִמּוּדֵי יְהֹוָה וְרַב שְׁלוֹם בָּנָֽיךְ: אַל תִּקְרֵי בָּנָֽיךְ אֶלָּא בּוֹנָֽיךְ: שָׁלוֹם רָב לְאֹהֲבֵי תוֹרָתֶֽךָ וְאֵין לָֽמוֹ מִכְשׁוֹל: יְהִי שָׁלוֹם בְּחֵילֵךְ שַׁלְוָה בְּאַרְמְּנוֹתָֽיךְ לְמַֽעַן אַחַי וְרֵעָי אֲדַבְּרָה נָא שָׁלוֹם בָּךְ: לְמַֽעַן בֵּית יְהֹוָה אֱלֹהֵֽינוּ אֲבַקְ֒שָׁה טוֹב לָךְ: יְהֹוָה עוֹז לְעַמּוֹ יִתֵּן יְהֹוָה יְבָרֵךְ אֶת־עַמּוֹ בַּשָּׁלוֹם:
  - id: shacharis-mourners-kaddish
    title: Mourner's Kaddish
    titleHe: קדיש יתום (**)
    text: |-
      יִתְגַּדַּל וְיִתְקַדַּשׁ שְׁמֵהּ רַבָּא (אָמֵן)
      בְּעָלְ֒מָֽא דִּי־בְרָא כִרְעוּתֵהּ וְיַמְלִיךְ מַלְכוּתֵהּ בְּחַיֵּיכוֹן וּבְיוֹמֵיכוֹן וּבְחַיֵּי דְכָל־בֵּית יִשְׂרָאֵל בַּעֲגָלָא וּבִזְמַן קָרִיב וְאִמְרוּ אָמֵן:
      יְהֵא שְׁמֵהּ רַבָּא מְבָרַךְ לְעָלַם וּלְעָלְ֒מֵי עָלְ֒מַיָּא
      יִתְבָּרַךְ וְיִשְׁתַּבַּח וְיִתְפָּאַר וְיִתְרוֹמַם וְיִתְנַשֵּׂא וְיִתְהַדָּר וְיִתְעַלֶּה וְיִתְהַלָּל שְׁמֵהּ דְקוּדְשָׁא בְּרִיךְ הוּא
      לְעֵֽלָּא מִן־כָּל־ (בעשי"ת לְעֵֽלָּא לְעֵֽלָּא מִכָּל) בִּרְכָתָֽא וְשִׁירָתָֽא תֻּשְׁבְּ֒חָתָֽא וְנֶחָמָתָֽא דַּאֲמִירָן בְּעָלְ֒מָֽא וְאִמְרוּ אָמֵן:
      עַל יִשְׂרָאֵל וְעַל רַבָּנָן וְעַל תַלְמִידֵיהוֹן וְעַל כָּל תַּלְמִידֵי תַלְמִידֵיהוֹן. וְעַל כָּל מָאן דְּעָסְ֒קִין בְּאוֹרַיְתָא. דִּי בְאַתְרָא הָדֵין וְדִי בְכָל אֲתַר וַאֲתַר. יְהֵא לְהוֹן וּלְכוֹן שְׁלָמָא רַבָּא חִנָּא וְחִסְדָּא וְרַחֲמִין וְחַיִּין אֲרִיכִין וּמְזוֹנָא רְוִיחֵי וּפוּרְקָנָא מִן קֳדָם אֲבוּהוֹן דְבִשְׁמַיָּא (וְאַרְעָא) וְאִמְרוּ אָמֵן:
      יְהֵא שְׁלָמָֽא רַבָּֽא מִן־שְׁמַיָּֽא וְחַיִּים עָלֵֽינוּ וְעַל־כָּל־יִשְׂרָאֵל וְאִמְרוּ אָמֵן:
      עוֹשֶׂה שָׁלוֹם (בעשי"ת הַשָּׁלוֹם) בִּמְרוֹמָיו הוּא יַעֲשֶׂה שָׁלוֹם עָלֵֽינוּ וְעַל כָּל יִשְׂרָאֵל וְאִמְרוּ אָמֵן:
  - id: shacharis-barchu
    title: Barchu
    titleHe: ברכו
    instruction: "ואומר שליח צבור:"
    text: "בָּרְ֒כוּ אֶת יְהֹוָה הַמְּ֒בֹרָךְ:"
  - id: shacharis-barchu-1
    title: Barchu
    titleHe: ברכו
    instruction: "ועונין הקהל:"
    text: "בָּרוּךְ יְהֹוָה הַמְּ֒בֹרָךְ לְעוֹלָם וָעֶד:"
