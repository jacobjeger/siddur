id: shacharis-preparatory-prayers
name: Preparatory Prayers
nameHe: הכנה לתפילה
category: shacharis
timeContext: shacharis
sections:
  - id: shacharis-modeh-ani
    title: Modeh Ani
    titleHe: מודה אני
    text: |-
      מוֹדֶה אֲנִי לְפָנֶֽיךָ מֶֽלֶךְ חַי וְקַיָּם שֶׁהֶחֱזַֽרְתָּ בִּי נִשְׁמָתִי בְּחֶמְלָה, רַבָּה אֱמוּנָתֶֽךָ:
      רֵאשִׁית חָכְמָה יִרְאַת יְהֹוָה, שֵֽׂכֶל טוֹב לְכָל־עֹשֵׂיהֶם, תְּהִלָּתוֹ עוֹמֶֽדֶת לָעַד: בָּרוּךְ שֵׁם כְּבוֹד מַלְכוּתוֹ לְעוֹלָם וָעֶד:
  - id: shacharis-netilat-yadayim
    title: Netilat Yadayim
    titleHe: נטילת ידים
    text: "בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם אֲשֶׁר קִדְּ֒שָֽׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ עַל נְטִילַת יָדָֽיִם:"
  - id: shacharis-asher-yatzar
    title: Asher Yatzar
    titleHe: אשר יצר
    text: "בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם אֲשֶׁר יָצַר אֶת־הָאָדָם בְּחָכְמָה וּבָֽרָא בוֹ נְקָבִים נְקָבִים חֲלוּלִים חֲלוּלִים גָּלוּי וְיָדֽוּעַ לִפְנֵי כִסֵּא כְבוֹדֶֽךָ שֶׁאִם יִפָּתֵֽחַ אֶחָד מֵהֶם אוֹ יִסָּתֵם אֶחָד מֵהֶם אִי אֶפְשַׁר לְהִתְקַיֵּם וְלַעֲמֹד לְפָנֶֽיךָ אֲפִילוּ שָׁעָה אֶחָת. בָּרוּךְ אַתָּה יְהֹוָה רוֹפֵא כָל־בָּשָׂר וּמַפְלִיא לַעֲשׂוֹת:"
  - id: shacharis-elokai-neshama
    title: Elokai Neshama
    titleHe: אלהי נשמה
    text: "אֱלֹהַי נְשָׁמָה שֶׁנָּתַֽתָּ בִּי טְהוֹרָה הִיא אַתָּה בְרָאתָהּ אַתָּה יְצַרְתָּהּ אַתָּה נְפַחְתָּהּ בִּי וְאַתָּה מְשַׁמְּ֒רָהּ בְּקִרְבִּי וְאַתָּה עָתִיד לִטְּ֒לָהּ מִמֶּֽנִּי וּלְהַחֲזִירָהּ בִּי לֶעָתִיד לָבֹא, כָּל זְמַן שֶׁהַנְּ֒שָׁמָה בְקִרְבִּי מוֹדֶה אֲנִי לְפָנֶֽיךָ יְהֹוָה אֱלֹהַי וֵאלֹהֵי אֲבוֹתַי רִבּוֹן כָּל הַמַּעֲשִׂים אֲדוֹן כָּל הַנְּ֒שָׁמוֹת: בָּרוּךְ אַתָּה יְהֹוָה הַמַּחֲזִיר נְשָׁמוֹת לִפְגָרִים מֵתִים:"
  - id: shacharis-tzitzit
    title: Tzitzit
    titleHe: ציצית
    text: |-
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם אֲשֶׁר קִדְּשָֽׁנוּ בְּמִצְוֹתָיו וְצִוָּֽנוּ עַל־מִצְוַת צִיצִת:
      יְהִי רָצוֹן מִלְּ֒פָנֶיךָ יְהֹוָה אֱלֹהַי וֵאלֹהֵי אֲבוֹתַי שֶׁתְּ֒הֵא חֲשׁוּבָה מִצְוַת צִיצִית לְפָנֶֽיךָ כְּאִלּוּ קִיַּמְתִּֽיהָ בְּכָל פְּרָטֶֽיהָ וְדִקְדּוּקֶֽיהָ וְכַוָּנוֹתֶֽיהָ וְתַרְיַ"ג מִצְווֹת הַתְּ֒לוּיוֹת בָּהּ, אָמֵן סֶלָה:
  - id: shacharis-torah-blessings
    title: Torah Blessings
    titleHe: ברכות התורה
    text: |-
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם אֲשֶׁר קִדְּ֒שָֽׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ לַעֲסֹק בְּדִבְרֵי תוֹרָה:
      וְהַעֲרֶב נָא יְהֹוָה אֱלֹהֵֽינוּ אֶת־דִּבְרֵי תוֹרָתְךָ בְּפִֽינוּ וּבְפִי עַמְּךָ בֵּית יִשְׂרָאֵל. וְנִהְיֶה אֲנַֽחְנוּ וְצֶאֱצָאֵֽינוּ וְצֶאֱצָאֵי עַמְּךָ בֵּית יִשְׂרָאֵל כֻּלָּֽנוּ יוֹדְעֵי שְׁמֶֽךָ וְלוֹמְדֵי תוֹרָתֶֽךָ. (י"א תוֹרָתְךָ) לִשְׁמָהּ. בָּרוּךְ אַתָּה יְהֹוָה הַמְלַמֵּד תּוֹרָה לְעַמּוֹ יִשְׂרָאֵל.
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם אֲשֶׁר בָּֽחַר בָּֽנוּ מִכָּל הָעַמִּים וְנָֽתַן לָֽנוּ אֶת־תּוֹרָתוֹ: בָּרוּךְ אַתָּה יְהֹוָה נוֹתֵן הַתּוֹרָה:
  - id: shacharis-torah-study
    title: Torah Study
    titleHe: לימוד תורה
    text: |-
      יְבָרֶכְ֒ךָ יְהֹוָה וְיִשְׁמְרֶֽךָ: יָאֵר יְהֹוָה פָּנָיו אֵלֶֽיךָ וִיחֻנֶּֽךָּ: יִשָּׂא יְהֹוָה פָּנָיו אֵלֶֽיךָ וְיָשֵׂם לְךָ שָׁלוֹם:
      אֵֽלּוּ דְבָרִים שֶׁאֵין לָהֶם שִׁעוּר הַפֵּאָה וְהַבִּכּוּרִים וְהָרְ֒אָיוֹן וּגְמִילוּת חֲסָדִים וְתַלְמוּד תּוֹרָה: אֵֽלּוּ דְבָרִים שֶׁאָדָם אוֹכֵל פֵּרוֹתֵיהֶם בָּעוֹלָם הַזֶּה וְהַקֶּֽרֶן קַיֶּֽמֶת לָעוֹלָם הַבָּא, וְאֵֽלּוּ הֵן כִּבּוּד אָב וָאֵם וּגְמִילוּת חֲסָדִים וְהַשְׁכָּמַת בֵּית הַמִּדְרָשׁ שַׁחֲרִית וְעַרְבִית וְהַכְנָסַת אוֹרְ֒חִים וּבִקּוּר חוֹלִים וְהַכְנָסַת כַּלָּה וּלְוָיַת הַמֵּת וְעִיּוּן תְּפִלָּה וַהֲבָאַת שָׁלוֹם בֵּין אָדָם לַחֲבֵרוֹ ובֵין אִישׁ לְאִשְׁתּוֹ וְתַלְמוּד תּוֹרָה כְּנֶֽגֶד כֻּלָּם:
  - id: shacharis-tallit
    title: Tallit
    titleHe: טלית
    text: |-
      בָּרְ֒כִי נַפְשִׁי אֶת־יְהֹוָה, יְהֹוָה אֱלֹהַי גָּדַֽלְתָּ מְאֹד, הוֹד וְהָדָר לָבָֽשְׁתָּ: עֹֽטֶה־אוֹר כַּשַּׂלְמָה, נוֹטֶה שָׁמַֽיִם כַּיְרִיעָה:
      לְשֵׁם יִחוּד קוּדְשָׁא בְּרִיךְ הוּא וּשְׁכִינְתֵּהּ בִּדְחִילוּ וּרְחִימוּ לְיַחֵד שֵׁם י"ה בו"ה בְּיִחוּדָא שְׁלִים בְּשֵׁם כָּל־יִשְׂרָאֵל הֲרֵינִי מִתְעַטֵּף גּוּפִי בַּצִּיצִית כֵּן תִּתְעַטֵּף נִשְׁמָתִי וּרְמַ"ח אֵיבָרַי וּשְׁסָ"ה גִידַי בְּאוֹר הַצִּיצִית הָעוֹלֶה תַּרְיַ"ג. וּכְשֵׁם שֶׁאֲנִי מִתְכַּסֶּה בַּטַּלִּית בָּעוֹלָם הַזֶּה כַּךְ אֶזְכֶּה לַחֲלוּקָא דְרַבָּנָן וּלְטַלִּית נָאָה לָעוֹלָם הַבָּא בְּגַן עֵֽדֶן. וְעַל יְדֵי מִצְוַת צִיצִית תִּנָּצֵל נַפְשִׁי רוּחִי וְנִשְׁמָתִי וּתְפִלָּתִי מִן הַחִיצוֹנִים וְהַטַּלִּית יִפְרֹשׂ כְּנָפָיו עֲלֵיהֶם וְיַצִּילֵם כְּנֶֽשֶׁר יָעִיר קִנּוֹ עַל גּוֹזָלָיו יְרַחֵף. וּתְהֵא חֲשׁוּבָה מִצְוַת צִיצִית לִפְנֵי הַקָּדוֹשׁ בָּרוּךְ הוּא כְּאִלּוּ קִיַּמְתִּֽיהָ בְּכָל פְּרָטֶֽיהָ וְדִקְדּוּקֶֽיהָ וְכַוָּנוֹתֶֽיהָ וְתַרְיַ"ג מִצְווֹת הַתְּ֒לוּיִם בָּהּ אָמֵן סֶֽלָה:
  - id: shacharis-tallit-1
    title: Tallit
    titleHe: טלית
    instruction: "בשעה שמניח אותו על ראשו להתעטף בו, יאמר:"
    text: |-
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם אֲשֶׁר קִדְּ֒שָֽׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ לְהִתְעַטֵּף בַּצִּיצִית:
      מַה־יָּקָר חַסְדְּ֒ךָ אֱלֹהִים וּבְנֵי אָדָם בְּצֵל כְּנָפֶֽיךָ יֶחֱסָֽיוּן: יִרְוְיֻן מִדֶּֽשֶׁן בֵּיתֶֽךָ וְנַֽחַל עֲדָנֶֽיךָ תַשְׁקֵם: כִּי־עִמְּ֒ךָ מְקוֹר חַיִּים, בְּאוֹרְ֒ךָ נִרְאֶה־אוֹר: מְשֹׁךְ חַסְדְּ֒ךָ לְיֹדְ֒עֶֽיךָ וְצִדְקָתְ֒ךָ לְיִשְׁרֵי־לֵב:
  - id: shacharis-tefillin
    title: Tefillin
    titleHe: תפילין
    text: 'לְשֵׁם יִחוּד קוּדְשָׁא בְּרִיךְ הוּא וּשְׁכִינְתֵּהּ בִּדְחִילוּ וּרְחִימוּ, לְיַחֵד שֵׁם י"ה בו"ה בְּיִחוּדָא שְׁלִים בְּשֵׁם כָּל יִשְׂרָאֵל, הִנְנִי מְכַוֵּן בַּהֲנָחַת תְּפִלִּין לְקַיֵּם מִצְוַת בּוֹרְאִי שֶׁצִּוָּֽנוּ לְהָנִֽיחַ תְּפִלִּין כַּכָּתוּב בְּתוֹרָתוֹ וּקְשַׁרְתָּם לְאוֹת עַל־יָדֶֽךָ וְהָיוּ לְטֹטָפוֹת בֵּין עֵינֶֽיךָ וְהֵם אַרְבַּע פָּרָשִׁיּוֹת אֵֽלּוּ: שְׁמַע. וְהָיָה אִם־שָׁמֹֽעַ. קַדֶּשׁ־לִי. וְהָיָה כִּי־יְבִאֲךָ. שֶׁיֵּשׁ בָּהֶן יִחוּדוֹ וְאַחְדּוּתוֹ יִתְבָּרַךְ שְׁמוֹ בָּעוֹלָם וְשֶׁנִּזְכֹּר נִסִּים וְנִפְלָאוֹת שֶׁעָשָׂה עִמָּֽנוּ בְּהוֹצִיאָֽנוּ מִמִּצְרָֽיִם וַאֲשֶׁר־לוֹ הַכֹּֽחַ וְהַמֶּמְשָׁלָה בָּעֶלְיוֹנִים וּבַתַּחְתּוֹנִים לַעֲשׂוֹת בָּהֶם כִּרְצוֹנוֹ. וְצִוָּֽנוּ לְהָנִֽיחַ עַל־הַיָּד לְזִכְרוֹן זְרֽוֹעַ הַנְּ֒טוּיָה וְשֶׁהִיא נֶֽגֶד הַלֵּב לְשַׁעְבֵּד בָּזֶה תַּאֲווֹת וּמַחְשְׁבוֹת לִבֵּֽנוּ לַעֲבוֹדָתוֹ יִתְבָּרַךְ שְׁמוֹ. וְעַל־הָרֹאשׁ נֶֽגֶד הַמֹּֽחַ שֶׁהַנְּ֒שָׁמָה שֶׁבְּ֒מֹחִי עִם שְׁאָר חוּשַׁי וְכֹחוֹתַי כֻּלָּם יִהְיוּ מְשֻׁעְבָּדִים לַעֲבוֹדָתוֹ יִתְבָּרַךְ שְׁמוֹ. וּמִשֶּֽׁפַע מִצְוַת תְּפִלִּין יִתְמַשֵּׁךְ עָלַי לִהְיוֹת לִי חַיִּים אֲרֻכִּים וְשֶֽׁפַע קֹֽדֶשׁ וּמַחֲשָׁבוֹת קְדוֹשׁוֹת בְּלִי הִרְהוּר חֵטְא וְעָוֹן כְּלָל וְשֶׁלֹּא יְפַתֵּֽנוּ וְלֹא יִתְגָּרֶה־בָֽנוּ יֵֽצֶר הָרָע וְיַנִּיחֵֽנוּ לַעֲבֹד אֶת־יְיָ כַּאֲשֶׁר עִם־לְבָבֵֽנוּ. וִיהִי רָצוֹן לְפָנֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ שֶׁתְּהֵא חֲשׁוּבָה מִצְוַת הֲנָחַת תְּפִלִּין לִפְנֵי הַקָּדוֹשׁ בָּרוּךְ הוּא כְּאִלּוּ קִיַּמְתִּֽיהָ בְּכָל־פְּרָטֶֽיהָ וְדִקְדּוּקֶֽיהָ וְכַוָּנוֹתֶֽיהָ וְתַרְיַ"ג מִצְוֹת הַתְּ֒לוּיוֹת בָּהּ אָמֵן סֶֽלָה:'
  - id: shacharis-tefillin-1
    title: Tefillin
    titleHe: תפילין
    instruction: "יניח התפילין של יד על קיבורת ידו, וקודם שיהדק יברך:"
    text: "בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם אֲשֶׁר קִדְּ֒שָֽׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ לְהָנִיחַ תְּפִלִּין:"
  - id: shacharis-tefillin-2
    title: Tefillin
    titleHe: תפילין
    instruction: "ויכרוך שבע כריכות סביב זרועו, ואחר כך יניח של ראש בגובה ראשו כנגד בין עיניו, וקודם שמהדקן יברך:"
    text: "בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם אֲשֶׁר קִדְּ֒שָֽׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ עַל מִצְוַת תְּפִלִּין:"
  - id: shacharis-tefillin-3
    title: Tefillin
    titleHe: תפילין
    instruction: "ואחר שיהדק הרצועה על ראשו יאמר:"
    text: |-
      בָּרוּךְ שֵׁם כְּבוֹד מַלְכוּתוֹ לְעוֹלָם וָעֶד:
      וּמֵחָכְמָתְ֒ךָ אֵל עֶלְיוֹן תַּאֲצִיל עָלַי וּמִבִּינָתְ֒ךָ תְּבִינֵֽנִי וּבְחַסְדְּ֒ךָ תַּגְדִּיל עָלַי וּבִגְבוּרָתְ֒ךָ תַּצְמִית אוֹיְ֒בַי וְקָמַי וְשֶׁמֶן הַטּוֹב תָּרִיק עַל שִׁבְעָה קְנֵי הַמְּ֒נוֹרָה לְהַשְׁפִּֽיעַ טוּבְ֒ךָ לִבְרִיּוֹתֶֽיךָ: פּוֹתֵחַ אֶת־יָדֶֽךָ וּמַשְׂבִּֽיעַ לְכָל־חַי רָצוֹן:
  - id: shacharis-tefillin-4
    title: Tefillin
    titleHe: תפילין
    instruction: "ואח״כ כורך הרצועה של יד על אצבעו, ואומר:"
    text: "וְאֵרַשְׂתִּיךְ לִי לְעוֹלָם, וְאֵרַשְׂתִּיךְ לִי בְּצֶֽדֶק וּבְמִשְׁפָּט וּבְחֶֽסֶד וּבְרַחֲמִים: וְאֵרַשְׂתִּיךְ לִי בֶּאֱמוּנָה, וְיָדַֽעַתְּ אֶת־יְהֹוָה:"
  - id: shacharis-tefillin-5
    title: Tefillin
    titleHe: תפילין
    instruction: "אחר שיניח תפילין יאמר פרשיות 'קדש' 'והיה כי יביאך' כדי להשלים ד' פרשיות בכל יום:"
    text: |-
      וַיְדַבֵּר יְהֹוָה אֶל־משֶׁה לֵּאמֹר: קַדֶּשׁ־לִי כָל־בְּכוֹר פֶּֽטֶר כָּל־רֶֽחֶם בִּבְנֵי יִשְׂרָאֵל בָּאָדָם וּבַבְּ֒הֵמָה לִי הוּא: וַיֹּֽאמֶר משֶׁה אֶל־הָעָם זָכוֹר אֶת־הַיּוֹם הַזֶּה אֲשֶׁר יְצָאתֶם מִמִּצְרַֽיִם מִבֵּית עֲבָדִים כִּי בְּחֹֽזֶק יָד הוֹצִיא יְהֹוָה אֶתְכֶם מִזֶּה וְלֹא יֵאָכֵל חָמֵץ: הַיּוֹם אַתֶּם יֹצְ֒אִים בְּחֹֽדֶשׁ הָאָבִיב: וְהָיָה כִי־יְבִיאֲךָ יְהֹוָה אֶל־אֶֽרֶץ הַכְּ֒נַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶֽיךָ לָֽתֶת לָךְ אֶֽרֶץ זָבַת חָלָב וּדְבָשׁ וְעָבַדְתָּ אֶת־הָעֲבֹדָה הַזֹּאת בַּחֹֽדֶשׁ הַזֶּה: שִׁבְעַת יָמִים תֹּאכַל מַצֹּת וּבַיּוֹם הַשְּׁ֒בִיעִי חַג לַיהוָֹה: מַצּוֹת יֵאָכֵל אֵת שִׁבְעַת הַיָּמִים וְלֹא־יֵרָאֶה לְךָ חָמֵץ וְלֹא־יֵרָאֶה לְךָ שְׂאֹר בְּכָל־גְּבֻלֶֽךָ: וְהִגַּדְתָּ לְבִנְךָ בַּיּוֹם הַהוּא לֵאמֹר בַּֽעֲבוּר זֶה עָשָׂה יְהֹוָה לִי בְּצֵאתִי מִמִּצְרָֽיִם: וְהָיָה לְךָ לְאוֹת עַל־יָדְ֒ךָ וּלְזִכָּרוֹן בֵּין עֵינֶֽיךָ לְמַֽעַן תִּֽהְיֶה תּוֹרַת יְהֹוָה בְּפִֽיךָ כִּי בְּיָד חֲזָקָה הוֹצִאֲךָ יְהֹוָה מִמִּצְרָֽיִם: וְשָׁמַרְתָּ אֶת־הַחֻקָּה הַזֹּאת לְמוֹעֲדָהּ מִיָּמִים יָמִֽימָה:
      וְהָיָה כִּי־יְבִאֲךָ יְהֹוָה אֶל־אֶֽרֶץ הַכְּ֒נַעֲנִי כַּאֲשֶׁר נִשְׁבַּע לְךָ וְלַאֲבֹתֶֽיךָ וּנְתָנָהּ לָךְ: וְהַעֲבַרְתָּ כָל־פֶּֽטֶר־רֶֽחֶם לַֽיהוָֹה וְכָל פֶּֽטֶר שֶֽׁגֶר בְּהֵמָה אֲשֶׁר יִהְיֶה לְךָ הַזְּ֒כָרִים לַיהוָֹה: וְכָל־פֶּֽטֶר חֲמֹר תִּפְדֶּה בְשֶׂה וְאִם־לֹא תִפְדֶּה וַעֲרַפְתּוֹ וְכֹל בְּכוֹר אָדָם בְּבָנֶֽיךָ תִּפְדֶּה: וְהָיָה כִּי־יִשְׁאָלְ֒ךָ בִנְךָ מָחָר לֵאמֹר מַה־זֹּאת וְאָמַרְתָּ אֵלָיו בְּחֹֽזֶק יָד הוֹצִיאָֽנוּ יְהֹוָה מִמִּצְרַֽיִם מִבֵּית עֲבָדִים: וַיְהִי כִּי־הִקְשָׁה פַרְעֹה לְשַׁלְּ֒חֵנוּ וַיַּהֲרֹג יְהֹוָה כָּל־בְּכוֹר בְּאֶֽרֶץ מִצְרַֽיִם מִבְּֽ֒כֹר אָדָם וְעַד־בְּכוֹר בְּהֵמָה עַל־כֵּן אֲנִי זֹבֵֽחַ לַֽיהוָֹה כָּל־פֶּֽטֶר רֶֽחֶם הַזְּ֒כָרִים וְכָל־בְּכוֹר בָּנַי אֶפְדֶּה: וְהָיָה לְאוֹת עַל־יָדְ֒כָה וּלְטוֹטָפֹת בֵּין עֵינֶֽיךָ כִּי בְּחֹֽזֶק יָד הוֹצִיאָֽנוּ יְהֹוָה מִמִּצְרָֽיִם:
  - id: shacharis-ma-tovu
    title: Ma Tovu
    titleHe: מה טובו
    text: "מַה־טֹּֽבוּ אֹהָלֶֽיךָ יַעֲקֹב מִשְׁכְּ֒נֹתֶֽיךָ יִשְׂרָאֵל: וַאֲנִי בְּרֹב חַסְדְּ֒ךָ אָבוֹא בֵיתֶֽךָ אֶשְׁתַּחֲוֶה אֶל־הֵיכַל־קָדְשְׁ֒ךָ בְּיִרְאָתֶֽךָ: יְהֹוָה אָהַֽבְתִּי מְעוֹן בֵּיתֶֽךָ וּמְקוֹם מִשְׁכַּן כְּבוֹדֶֽךָ: וַאֲנִי אֶשְׁתַּחֲוֶה וְאֶכְרָֽעָה אֶבְרְ֒כָה לִפְנֵי יְהֹוָה עֹשִׂי: וַאֲנִי תְפִלָּתִי־לְךָ יְהֹוָה עֵת רָצוֹן אֱלֹהִים בְּרָב־חַסְדֶּֽךָ עֲנֵֽנִי בֶּאֱמֶת יִשְׁעֶֽךָ:"
  - id: shacharis-adon-olam
    title: Adon Olam
    titleHe: אדון עולם
    text: |-
      אֲדוֹן עוֹלָם אֲשֶׁר מָלַךְ, בְּטֶֽרֶם כָּל יְצִיר נִבְרָא:
      לְעֵת נַעֲשָׂה בְחֶפְצוֹ כֹּל, אֲזַי מֶֽלֶךְ שְׁמוֹ נִקְרָא:
      וְאַחֲרֵי כִּכְלוֹת הַכֹּל, לְבַדּוֹ יִמְלֹךְ נוֹרָא:
      וְהוּא הָיָה וְהוּא הֹוֶה, וְהוּא יִהְיֶה בְּתִפְאָרָה:
      וְהוּא אֶחָד וְאֵין שֵׁנִי, לְהַמְשִׁיל לוֹ לְהַחְבִּֽירָה:
      בְּלִי רֵאשִׁית בְּלִי תַכְלִית, וְלוֹ הָעֹז וְהַמִּשְׂרָה:
      וְהוּא אֵלִי וְחַי גּוֹאֲלִי, וְצוּר חֶבְלִי בְּעֵת צָרָה:
      וְהוּא נִסִּי וּמָנוֹס לִי, מְנָת כּוֹסִי בְּיוֹם אֶקְרָא:
      בְּיָדוֹ אַפְקִיד רוּחִי, בְּעֵת אִישַׁן וְאָעִֽירָה:
      וְעִם רוּחִי גְּוִיָּתִי, יְהֹוָה לִי וְלֹא אִירָא:
  - id: shacharis-yigdal
    title: Yigdal
    titleHe: יגדל
    instruction: |-
      פיוט המיוסד על שלושה עשר עקרי האמונה. מיוחס לר' דניאל בן יהודה הרומי
      מציאות השם
    text: |-
      יִגְדַּל אֱלֹהִים חַי וְיִשְׁתַּבַּח, נִמְצָא וְאֵין עֵת אֶל מְצִיאוּתוֹ:
      אחדות השם
      אֶחָד וְאֵין יָחִיד כְּיִחוּדוֹ, נֶעְלָם וְגַם אֵין סוֹף לְאַחְדּוּתוֹ:
      שאינו גוף
      אֵין לוֹ דְמוּת הַגּוּף וְאֵינוֹ גוּף, לֹא נַעֲרֹךְ אֵלָיו קְדֻשָּׁתוֹ:
      קדמות השם
      קַדְמוֹן לְכָל־דָּבָר אֲשֶׁר נִבְרָא, רִאשׁוֹן וְאֵין רֵאשִׁית לְרֵאשִׁיתוֹ:
      שרק אותו ראוי לעבוד
      הִנּוֹ אֲדוֹן עוֹלָם לְכָל־נוֹצָר, יוֹרֶה גְדֻלָּתוֹ וּמַלְכוּתוֹ:
      נבואה
      שֶֽׁפַע נְבוּאָתוֹ נְתָנוֹ, אֶל אַנְשֵׁי סְגֻלָּתוֹ וְתִפְאַרְתּוֹ:
      נבואת משה אמיתית
      לֹא קָם בְּיִשְׂרָאֵל כְּמשֶׁה עוֹד, נָבִיא וּמַבִּיט אֶת־תְּמוּנָתוֹ:
      תורה מן השמים
      תּוֹרַת אֱמֶת נָתַן לְעַמּוֹ אֵל, עַל יַד נְבִיאוֹ נֶאֱמַן בֵּיתוֹ:
      נצחיות התורה
      לֹא יַחֲלִיף הָאֵל וְלֹא יָמִיר דָּתוֹ, לְעוֹלָמִים לְזוּלָתוֹ:
      השגחה
      צוֹפֶה וְיוֹדֵֽעַ סְתָרֵֽינוּ, מַבִּיט לְסוֹף דָּבָר בְּקַדְמָתוֹ:
      שכר ועונש
      גּוֹמֵל לְאִישׁ חֶֽסֶד כְּמִפְעָלוֹ, נוֹתֵן לְרָשָׁע רָע כְּרִשְׁעָתוֹ:
      ביאת המשיח
      יִשְׁלַח לְקֵץ הַיָּמִין מְשִׁיחֵֽנוּ, לִפְדּוֹת מְחַכֵּי קֵץ יְשׁוּעָתוֹ:
      תחיית המתים
      מֵתִים יְחַיֶּה אֵל בְּרֹב חַסְדּוֹ, בָּרוּךְ עֲדֵי עַד שֵׁם תְּהִלָּתוֹ:
  - id: shacharis-morning-blessings
    title: Morning Blessings
    titleHe: ברכות השחר
    text: |-
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם אֲשֶׁר נָתַן לַשֶּֽׂכְוִי בִינָה לְהַבְחִין בֵּין יוֹם וּבֵין לָֽיְלָה:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם שֶׁלֹּא עָשַֽׂנִי גּוֹי:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם שֶׁלֹּא עָשַֽׂנִי עָֽבֶד:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם שֶׁלֹּא עָשַֽׂנִי אִשָּׁה:
      (נשים אומרות: בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם שֶׁעָשַֽׂנִי כִּרְצוֹנוֹ:)
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם פּוֹקֵֽחַ עִוְרִים:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם מַלְבִּישׁ עֲרֻמִּים:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם מַתִּיר אֲסוּרִים:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם זוֹקֵף כְּפוּפִים:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם רוֹקַע הָאָֽרֶץ עַל הַמָּֽיִם:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם שֶׁעָשָׂה לִי כָּל־צָרְכִּי:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם הַמֵּכִין מִצְעֲדֵי גָֽבֶר:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם אוֹזֵר יִשְׂרָאֵל בִּגְבוּרָה:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם עוֹטֵר יִשְׂרָאֵל בְּתִפְאָרָה:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם הַנּוֹתֵן לַיָּעֵף כֹּֽחַ:
      בָּרוּךְ אַתָּה יְהֹוָה אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם הַמַּעֲבִיר שֵׁנָה מֵעֵינָי וּתְנוּמָה מֵעַפְעַפָּי:
      וִיהִי רָצוֹן מִלְּ֒פָנֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ שֶׁתַּרְגִּילֵֽנוּ בְּתוֹרָתֶֽךָ וְדַבְּ֒קֵֽנוּ בְּמִצְוֹתֶֽיךָ, וְאַל תְּבִיאֵֽנוּ לֹא לִידֵי חֵטְא וְלֹא לִידֵי עֲבֵרָה וְעָוֹן וְלֹא לִידֵי נִסָּיוֹן וְלֹא לִידֵי בִזָּיוֹן וְאַל יִשְׁלֹט בָּֽנוּ יֵֽצֶר הָרָע וְהַרְחִיקֵֽנוּ מֵאָדָם רָע וּמֵחָבֵר רָע וְדַבְּ֒קֵֽנוּ בְּיֵֽצֶר הַטּוֹב וּבְמַעֲשִׂים טוֹבִים וְכוֹף אֶת־יִצְרֵֽנוּ לְהִשְׁתַּעְבֶּד־לָךְ וּתְנֵֽנוּ הַיּוֹם וּבְכָל־יוֹם לְחֵן וּלְחֶֽסֶד וּלְרַחֲמִים בְּעֵינֶֽיךָ וּבְעֵינֵי כָל־רוֹאֵֽינוּ וְתִגְמְ֒לֵֽנוּ חֲסָדִים טוֹבִים: בָּרוּךְ אַתָּה יְהֹוָה גּוֹמֵל חֲסָדִים טוֹבִים לְעַמּוֹ יִשְׂרָאֵל:
      יְהִי רָצוֹן מִלְּ֒פָנֶֽיךָ יְהֹוָה אֱלֹהַי וֵאלֹהֵי אֲבוֹתַי שֶׁתַּצִּילֵֽנִי הַיּוֹם וּבְכָל־יוֹם מֵעַזֵּי פָנִים וּמֵעַזּוּת פָּנִים מֵאָדָם רָע וּמֵחָבֵר רָע וּמִשָּׁכֵן רָע וּמִפֶּֽגַע רָע וּמִשָּׂטָן הַמַּשְׁחִית מִדִּין קָשֶׁה וּמִבַּֽעַל דִּין קָשֶׁה, בֵּין שֶׁהוּא בֶן בְּרִית וּבֵין שֶׁאֵינוֹ בֶן בְּרִית:
  - id: shacharis-akedah
    title: Akedah
    titleHe: עקדה
    text: |-
      אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ זָכְרֵֽנוּ בְּזִכָּרוֹן טוֹב לְפָנֶֽיךָ וּפָקְדֵֽנוּ בִּפְקֻדַּת יְשׁוּעָה וְרַחֲמִים מִשְּׁ֒מֵי שְׁמֵי קֶֽדֶם וּזְכָר לָֽנוּ יְהֹוָה אֱלֹהֵֽינוּ אַהֲבַת הַקַּדְמוֹנִים אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל עֲבָדֶֽיךָ אֶת־הַבְּ֒רִית וְאֶת־הַחֶֽסֶד וְאֶת־הַשְּׁ֒בוּעָה שֶׁנִּשְׁבַּֽעְתָּ לְאַבְרָהָם אָבִֽינוּ בְּהַר הַמֹּרִיָּה וְאֶת־הָעֲקֵדָה שֶׁעָקַד אֶת־יִצְחָק בְּנוֹ עַל גַּבֵּי הַמִּזְבֵּֽחַ כַּכָּתוּב בְּתוֹרָתֶֽךָ:
      וַיְהִי אַחַר הַדְּ֒בָרִים הָאֵֽלֶּה וְהָאֱלֹהִים נִסָּה אֶת־אַבְרָהָם וַיֹּֽאמֶר אֵלָיו אַבְרָהָם וַיֹּֽאמֶר הִנֵּֽנִי: וַיֹּֽאמֶר קַח־נָא אֶת־בִּנְךָ אֶת־יְחִידְ֒ךָ אֲשֶׁר־אָהַֽבְתָּ אֶת־יִצְחָק וְלֶךְ־לְךָ אֶל־אֶֽרֶץ הַמֹּרִיָּה וְהַעֲלֵֽהוּ שָׁם לְעֹלָה עַל אַחַד הֶהָרִים אֲשֶׁר אֹמַר אֵלֶֽיךָ: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּֽקֶר וַיַּחֲבשׁ אֶת־חֲמֹרוֹ וַיִּקַּח אֶת־שְׁנֵי נְעָרָיו אִתּוֹ וְאֵת יִצְחָק בְּנוֹ וַיְבַקַּע עֲצֵי עֹלָה וַיָּֽקָם וַיֵּֽלֶךְ אֶל־הַמָּקוֹם אֲשֶׁר־אָֽמַר־לוֹ הָאֱלֹהִֽים: בַּיּוֹם הַשְּׁ֒לִישִׁי וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא אֶת־הַמָּקוֹם מֵרָחֹק: וַיֹּֽאמֶר אַבְרָהָם אֶל־נְעָרָיו שְׁבוּ־לָכֶם פֹּה עִם־הַחֲמוֹר וַאֲנִי וְהַנַּֽעַר נֵלְ֒כָה עַד־כֹּה וְנִשְׁתַּחֲוֶה וְנָשֽׁוּבָה אֲלֵיכֶם: וַיִּקַּח אַבְרָהָם אֶת־עֲצֵי הָעֹלָה וַיָּֽשֶׂם עַל־יִצְחָק בְּנוֹ וַיִּקַּח בְּיָדוֹ אֶת־הָאֵשׁ וְאֶת־הַמַּאֲכֶֽלֶת וַיֵּלְ֒כוּ שְׁנֵיהֶם יַחְדָּו: וַיֹּֽאמֶר יִצְחָק אֶל־אַבְרָהָם אָבִיו וַיֹּֽאמֶר אָבִי וַיֹּֽאמֶר הִנֶּֽנִּי בְנִי וַיֹּֽאמֶר הִנֵּה הָאֵשׁ וְהָעֵצִים וְאַיֵּה הַשֶּׂה לְעֹלָֽה: וַיֹּֽאמֶר אַבְרָהָם אֱלֹהִים יִרְאֶה־לּוֹ הַשֶּׂה לְעֹלָה בְּנִי וַיֵּלְ֒כוּ שְׁנֵיהֶם יַחְדָּו: וַיָּבֹֽאוּ אֶל־הַמָּקוֹם אֲשֶׁר אָֽמַר־לוֹ הָאֱלֹהִים וַיִּֽבֶן שָׁם אַבְרָהָם אֶת־הַמִּזְבֵּֽחַ וַיַּעֲרֹךְ אֶת־הָעֵצִים וַיַּעֲקֹד אֶת־יִצְחָק בְּנוֹ וַיָּֽשֶׂם אֹתוֹ עַל־הַמִּזְבֵּֽחַ מִמַּֽעַל לָעֵצִים: וַיִּשְׁלַח אַבְרָהָם אֶת־יָדוֹ וַיִּקַּח אֶת־הַמַּאֲכֶֽלֶת לִשְׁחֹט אֶת־בְּנוֹ: וַיִּקְרָא אֵלָיו מַלְאַךְ יְהֹוָה מִן־הַשָּׁמַֽיִם וַיֹּֽאמֶר אַבְרָהָם אַבְרָהָם וַיֹּֽאמֶר הִנֵּֽנִי: וַיֹּֽאמֶר אַל־תִּשְׁלַח יָֽדְ֒ךָ אֶל־הַנַּֽעַר וְאַל־תַּֽעַשׂ לוֹ מְאוּמָה כִּי עַתָּה יָדַֽעְתִּי כִּי־יְרֵא אֱלֹהִים אַֽתָּה וְלֹא חָשַֽׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידְ֒ךָ מִמֶּֽנִּי: וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַֽיִל אַחַר נֶאֱחַז בַּסְּ֒בַךְ בְּקַרְנָיו וַיֵּֽלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַֽיִל וַיַּעֲלֵֽהוּ לְעֹלָה תַּֽחַת בְּנוֹ: וַיִּקְרָא אַבְרָהָם שֵׁם־הַמָּקוֹם הַהוּא יְהֹוָה יִרְאֶה אֲשֶׁר יֵאָמֵר הַיּוֹם בְּהַר יְהֹוָה יֵרָאֶה: וַיִּקְרָא מַלְאַךְ יְהֹוָה אֶל־אַבְרָהָם שֵׁנִית מִן־הַשָּׁמָֽיִם: וַיֹּֽאמֶר בִּי נִשְׁבַּֽעְתִּי נְאֻם־יְהֹוָה כִּי יַֽעַן אֲשֶׁר עָשִֽׂיתָ אֶת־הַדָּבָר הַזֶּה וְלֹא חָשַֽׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידֶֽךָ: כִּי־בָרֵךְ אֲבָרֶכְ֒ךָ וְהַרְבָּה אַרְבֶּה אֶת־זַרְעֲךָ כְּכוֹכְ֒בֵי הַשָּׁמַֽיִם וְכַחוֹל אֲשֶׁר עַל־שְׂפַת הַיָּם וְיִרַשׁ זַרְעֲךָ אֵת שַֽׁעַר אֹיְ֒בָיו: וְהִתְבָּרְ֒כוּ בְזַרְעֲךָ כֹּל גּוֹיֵי הָאָֽרֶץ עֵֽקֶב אֲשֶׁר שָׁמַֽעְתָּ בְּקֹלִי: וַיָּֽשָׁב אַבְרָהָם אֶל־נְעָרָיו וַיָּקֻֽמוּ וַיֵּלְ֒כוּ יַחְדָּו אֶל־בְּאֵר שָֽׁבַע וַיֵּֽשֶׁב אַבְרָהָם בִּבְאֵר שָֽׁבַע:
      רִבּוֹנוֹ שֶׁל עוֹלָם יְהִי רָצוֹן מִלְּפָנֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ שֶׁתִּזְכֹּר לָֽנוּ בְּרִית אֲבוֹתֵֽינוּ כְּמוֹ שֶׁכָּבַשׁ אַבְרָהָם אָבִֽינוּ אֶת רַחֲמָיו מִבֶּן יְחִידוֹ וְרָצָה לִשְׁחֹט אוֹתוֹ כְּדֵי לַעֲשׂוֹת רְצוֹנֶֽךָ כֵּן יִכְבְּשׁוּ רַחֲמֶֽיךָ אֶת־כַּעַסְךָ מֵעָלֵֽינוּ וְיָגֹֽלּוּ רַחֲמֶֽיךָ עַל מִדּוֹתֶֽיךָ, וְתִכָּנֵס אִתָּֽנוּ לִפְנִים מִשּׁוּרַת דִּינֶֽךָ וְתִתְנַהֵג עִמָּֽנוּ יְהֹוָה אֱלֹהֵֽינוּ בְּמִדַּת הַחֶֽסֶד וּבְמִדַּת הָרַחֲמִים וּבְטוּבְךָ הַגָּדוֹל יָשׁוּב חֲרוֹן אַפְּ֒ךָ מֵעַמְּ֒ךָ וּמֵעִירְ֒ךָ וּמֵאַרְצְ֒ךָ וּמִנַּחֲלָתֶֽךָ וְקַיֶּם לָֽנוּ יְהֹוָה אֱלֹהֵֽינוּ אֶת־הַדָּבָר שֶׁהִבְטַחְתָּֽנוּ עַל יְדֵי משֶׁה עַבְדֶּֽךָ כָּאָמוּר: וְזָכַרְתִּי אֶת־בְּרִיתִי יַעֲקוֹב וְאַף אֶת־בְּרִיתִי יִצְחָק וְאַף אֶת־בְּרִיתִי אַבְרָהָם אֶזְכֹּר וְהָאָֽרֶץ אֶזְכֹּר:
  - id: shacharis-sovereignty-of-heaven
    title: Sovereignty of Heaven
    titleHe: עול מלכות שמים
    text: |-
      לְעוֹלָם יְהֵא אָדָם יְרֵא שָׁמַֽיִם בְּסֵֽתֶר וּבַגָּלוּי וּמוֹדֶה עַל־הָאֱמֶת וְדוֹבֵר אֱמֶת בִּלְבָבוֹ וְיַשְׁכֵּם וְיֹאמַר:
      רִבּוֹן כָּל הָעוֹלָמִים לֹא עַל צִדְקוֹתֵֽינוּ אֲנַֽחְנוּ מַפִּילִים תַּחֲנוּנֵֽינוּ לְפָנֶֽיךָ כִּי עַל רַחֲמֶֽיךָ הָרַבִּים, מָה אָֽנוּ מֶה חַיֵּֽינוּ מֶה חַסְדֵּֽנוּ, מַה צִּדְקוֹתֵֽינוּ, מַה יְּשׁוּעָתֵֽנוּ, מַה כֹּחֵֽנוּ מַה גְּבוּרָתֵֽנוּ, מַה נֹּאמַר לְפָנֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ הֲלֹא כָּל הַגִּבּוֹרִים כְּאַֽיִן לְפָנֶֽיךָ וְאַנְשֵׁי הַשֵּׁם כְּלֹא הָיוּ וַחֲכָמִים כִּבְלִי מַדָּע וּנְבוֹנִים כִּבְלִי הַשְׂכֵּל כִּי רוֹב מַעֲשֵׂיהֶם תֹּֽהוּ וִימֵי חַיֵּיהֶם הֶֽבֶל לְפָנֶֽיךָ, וּמוֹתַר הָאָדָם מִן הַבְּ֒הֵמָה אָֽיִן כִּי הַכֹּל הָֽבֶל:
      אֲבָל אֲנַֽחְנוּ עַמְּ֒ךָ בְּנֵי בְרִיתֶֽךָ, בְּנֵי אַבְרָהָם אֹהַבְךָ שֶׁנִּשְׁבַּֽעְתָּ לּוֹ בְּהַר הַמֹּרִיָּה, זֶֽרַע יִצְחָק יְחִידוֹ שֶׁנֶּעֱקַד עַל גַּבֵּי הַמִּזְבֵּֽחַ, עֲדַת יַעֲקֹב בִּנְךָ בְּכוֹרֶֽךָ שֶׁמֵּאַהֲבָתְ֒ךָ שֶׁאָהַֽבְתָּ אוֹתוֹ וּמִשִּׂמְחָתְ֒ךָ שֶׁשָּׂמַֽחְתָּ בּוֹ קָרָֽאתָ אֶת שְׁמוֹ יִשְׂרָאֵל וִישֻׁרוּן:
      לְפִיכָךְ אֲנַֽחְנוּ חַיָּבִים לְהוֹדוֹת לְךָ וּלְשַׁבֵּחֲךָ וּלְפָאֶרְךָ וּלְבָרֵךְ וּלְקַדֵּשׁ וְלָֽתֶת־שֶֽׁבַח וְהוֹדָיָה לִשְׁמֶֽךָ: אַשְׁרֵֽינוּ מַה־טּוֹב חֶלְקֵֽנוּ וּמַה־נָּעִים גּוֹרָלֵֽנוּ וּמַה־יָּפָה יְרֻשָּׁתֵֽנוּ: אַשְׁרֵֽינוּ שֶׁאֲנַֽחְנוּ מַשְׁכִּימִים וּמַעֲרִיבִים עֶֽרֶב וָבֹֽקֶר וְאוֹמְ֒רִים פַּעֲמַֽיִם בְּכָל־יוֹם:
      שְׁמַע יִשְׂרָאֵל יְהֹוָה אֱלֹהֵֽינוּ יְהֹוָה אֶחָד:
  - id: shacharis-sovereignty-of-heaven-1
    title: Sovereignty of Heaven
    titleHe: עול מלכות שמים
    instruction: "ויאמר בלחש:"
    text: |-
      בָּרוּךְ שֵׁם כְּבוֹד מַלְכוּתוֹ לְעוֹלָם וָעֶד:
      וְאָהַבְתָּ אֵת יְהֹוָה אֱלֹהֶֽיךָ בְּכָל֯־לְ֯בָבְ֒ךָ וּבְכָל־נַפְשְׁ֒ךָ וּבְכָל־מְאֹדֶֽךָ: וְהָיוּ הַדְּ֒בָרִים הָאֵֽלֶּה אֲשֶׁר֯ אָ֯נֹכִי מְצַוְּ֒ךָ הַיּוֹם עַל֯־לְ֯בָבֶֽךָ: וְשִׁנַּנְתָּם לְבָנֶֽיךָ וְדִבַּרְתָּ בָּם בְּשִׁבְתְּ֒ךָ בְּבֵיתֶֽךָ וּבְלֶכְתְּ֒ךָ בַדֶּֽרֶךְ וּבְשָׁכְבְּ֒ךָ וּבְקוּמֶֽךָ: וּקְשַׁרְתָּם לְאוֹת עַל֯־יָ֯דֶֽךָ וְהָיוּ לְטֹטָפֹת בֵּין עֵינֶֽיךָ: וּכְתַבְתָּם עַל־מְזֻזוֹת בֵּיתֶֽךָ וּבִשְׁעָרֶֽיךָ:
      אַתָּה הוּא עַד שֶׁלֹּא נִבְרָא הָעוֹלָם, אַתָּה הוּא מִשֶּׁנִּבְרָא הָעוֹלָם, אַתָּה הוּא בָּעוֹלָם הַזֶּה וְאַתָּה הוּא לָעוֹלָם הַבָּא, קַדֵּשׁ אֶת־שִׁמְךָ עַל מַקְדִּישֵׁי שְׁמֶֽךָ וְקַדֵּשׁ אֶת־שִׁמְךָ בְּעֹלָמֶֽךָ, וּבִישׁוּעָתְ֒ךָ תָּרוּם וְתַגְבִּֽיהַּ קַרְנֵֽנוּ: בָּרוּךְ אַתָּה יְהֹוָה מְקַדֵּשׁ אֶת־שִׁמְךָ בָּרַבִּים:
      אַתָּה הוּא יְהֹוָה אֱלֹהֵֽינוּ בַּשָּׁמַֽיִם וּבָאָֽרֶץ וּבִשְׁמֵי הַשָּׁמַֽיִם הָעֶלְיוֹנִים. אֱמֶת אַתָּה הוּא רִאשׁוֹן וְאַתָּה הוּא אַחֲרוֹן וּמִבַּלְעָדֶֽיךָ אֵין אֱלֹהִים. קַבֵּץ קֹוֶֽיךָ מֵאַרְבַּע כַּנְפוֹת הָאָֽרֶץ. יַכִּֽירוּ וְיֵדְ֒עוּ כָּל־בָּאֵי עוֹלָם כִּי אַתָּה הוּא הָאֱלֹהִים לְבַדְּ֒ךָ לְכֹל מַמְלְ֒כוֹת הָאָֽרֶץ. אַתָּה עָשִֽׂיתָ אֶת־הַשָּׁמַֽיִם וְאֶת־הָאָֽרֶץ אֶת־הַיָּם וְאֶת־כָּל־אֲשֶׁר בָּם. וּמִי בְּכָל־מַעֲשֵׂי יָדֶֽיךָ בָּעֶלְיוֹנִים אוֹ בַתַּחְתּוֹנִים שֶׁיֹּאמַר לְךָ מַה תַּעֲשֶׂה. אָבִֽינוּ שֶׁבַּשָּׁמַֽיִם עֲשֵׂה עִמָּֽנוּ חֶֽסֶד בַּעֲבוּר שִׁמְךָ הַגָּדוֹל שֶׁנִּקְרָא עָלֵֽינוּ וְקַיֶּם־לָֽנוּ יְהֹוָה אֱלֹהֵֽינוּ מַה שֶּׁכָּתוּב בָּעֵת הַהִיא אָבִיא אֶתְכֶם וּבָעֵת קַבְּ֒צִי אֶתְכֶם כִּֽי־אֶתֵּן אֶתְכֶם לְשֵׁם וְלִתְהִלָּה בְּכֹל עַמֵּי הָאָרֶץ בְּשׁוּבִי אֶת־שְׁבֽוּתֵיכֶם לְעֵֽינֵיכֶם אָמַר יְהֹוָֽה:
  - id: shacharis-kiyor
    title: Kiyor
    titleHe: פרשת הכיור
    instruction: "אמרו חכמים (מנחות קי.): מאי דכתיב זאת תורת החטאת וזאת תורת האשם. כל העוסק בתורת חטאת כאילו הקריב חטאת וכל העוסק בתורת אשם כאילו הקריב אשם. ולכן אין די באמירת הפסוקים לבד אלא יתבונן בטעמי הקרבנות ובדיניהם כפי השגתו."
    text: "וַיְדַבֵּר יְהֹוָה אֶל־משֶׁה לֵּאמֹר: וְעָשִֽׂיתָ כִּיּוֹר נְחֽשֶׁת וְכַנּוֹ נְחֽשֶׁת לְרָחְצָה וְנָתַתָּ אֹתוֹ בֵּין־אֹֽהֶל מוֹעֵד וּבֵין הַמִּזְבֵּֽחַ וְנָתַתָּ שָֽׁמָּה מָֽיִם: וְרָחֲצוּ אַהֲרֹן וּבָנָיו מִמֶּֽנּוּ אֶת־יְדֵיהֶם וְאֶת־רַגְלֵיהֶם: בְּבֹאָם אֶל־אֹֽהֶל מוֹעֵד יִרְחֲצוּ־מַֽיִם וְלֹא יָמֻֽתוּ אוֹ בְגִשְׁתָּם אֶל־הַמִּזְבֵּֽחַ לְשָׁרֵת לְהַקְטִיר אִשֶּׁה לַיהוָֹה: וְרָחֲצוּ יְדֵיהֶם וְרַגְלֵיהֶם וְלֹא יָמֻֽתוּ וְהָיְ֒תָה לָהֶם חָק־עוֹלָם לוֹ וּלְזַרְעוֹ לְדֹרֹתָם:"
  - id: shacharis-terumat-hadeshen
    title: Terumat HaDeshen
    titleHe: פרשת תרומת הדשן
    instruction: תרומת הדשן קודמת לכל עבודות לפיכך יאמר פרשת תרומת הדשן קודם פרשת התמיד. ואומרה אף שלא האיר היום.
    text: |-
      וַיְדַבֵּר יְהֹוָה אֶל־משֶׁה לֵּאמֹר: צַו אֶת־אַהֲרֹן וְאֶת־בָּנָיו לֵאמֹר זֹאת תּוֹרַת הָעֹלָה הִוא הָעֹלָה עַל מוֹקְ֒דָה עַל־הַמִּזְבֵּֽחַ כָּל־הַלַּֽיְלָה עַד־הַבֹּֽקֶר וְאֵשׁ הַמִּזְבֵּֽחַ תּוּקַד בּוֹ: וְלָבַשׁ הַכֹּהֵן מִדּוֹ בַד וּמִכְנְ֒סֵי־בַד יִלְבַּשׁ עַל־בְּשָׂרוֹ וְהֵרִים אֶת־הַדֶּֽשֶׁן אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה עַל־הַמִּזְבֵּֽחַ וְשָׂמוֹ אֵֽצֶל הַמִּזְבֵּֽחַ: וּפָשַׁט אֶת־בְּגָדָיו וְלָבַשׁ בְּגָדִים אֲחֵרִים וְהוֹצִיא אֶת־הַדֶּֽשֶׁן אֶל־מִחוּץ לַמַּחֲנֶה אֶל־מָקוֹם טָהוֹר: וְהָאֵשׁ עַל־הַמִּזְבֵּֽחַ תּֽוּקַד־בּוֹ לֹא תִכְבֶּה וּבִעֵר עָלֶֽיהָ הַכֹּהֵן עֵצִים בַּבֹּֽקֶר בַּבֹּֽקֶר וְעָרַךְ עָלֶֽיהָ הָעֹלָה וְהִקְטִיר עָלֶֽיהָ חֶלְבֵי הַשְּׁ֒לָמִים: אֵשׁ תָּמִיד תּוּקַד עַל־הַמִּזְבֵּֽחַ לֹא תִכְבֶּה:
      אומרים פרשת התמיד. ואם אי אפשר לאומרה בצבור יכול לאומרה בביתו ולחזור לקרותה עם הצבור. ויכוין בפעם השנייה כקורא בתורה (טור). יש מי שמצריך לעמוד בשעת אמירת הקרבנות, דהקרבת קרבן אינו אלא בעמידה (מגן אברהם).
  - id: shacharis-korban-hatamid
    title: Korban HaTamid
    titleHe: פרשת קרבן תמיד
    instruction: יש שאין אומרים 'יהי רצון' בשבת ויום טוב
    text: |-
      יְהִי רָצוֹן מִלְּ֒פָנֶֽיךָ, יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ, שֶׁתְּ֒רַחֵם עָלֵֽינוּ וְתִמְחָל לָֽנוּ עַל כָּל חַטֹּאתֵֽינוּ וּתְכַפֶּר לָֽנוּ אֶת כָּל עֲוֹנוֹתֵֽינוּ וְתִסְלַח לָֽנוּ עַל־כָּל פְּשָׁעֵֽינוּ וְשֶׁתִּבְנֶה בֵּית הַמִּקְדָּשׁ בִּמְהֵרָה בְיָמֵֽינוּ וְנַקְרִיב לְפָנֶֽיךָ קָרְבַּן הַתָּמִיד שֶׁיְּ֒כַפֵּר בַּעֲדֵֽנוּ כְּמוֹ שֶׁכָּתַֽבְתָּ עָלֵֽינוּ בְּתוֹרָתֶֽךָ, עַל יְדֵי משֶׁה עַבְדֶּֽךָ, מִפִּי כְבוֹדֶֽךָ כָּאָמוּר:
      וַיְדַבֵּר יְהֹוָה אֶל־משֶׁה לֵּאמֹר: צַו אֶת־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם אֶת־קָרְבָּנִי לַחְמִי לְאִשַּׁי רֵֽיחַ נִיחֹחִי תִּשְׁמְ֒רוּ לְהַקְרִיב לִי בְּמוֹעֲדוֹ: וְאָמַרְתָּ לָהֶם זֶה הָאִשֶּׁה אֲשֶׁר תַּקְרִֽיבוּ לַיהוָֹה כְּבָשִׂים בְּנֵי־שָׁנָה תְמִימִם שְׁנַֽיִם לַיּוֹם עֹלָה תָמִיד: אֶת־הַכֶּֽבֶשׂ אֶחָד תַּעֲשֶׂה בַבֹּֽקֶר וְאֵת הַכֶּֽבֶשׂ הַשֵּׁנִי תַּעֲשֶׂה בֵּין הָעַרְבָּֽיִם: וַֽעֲשִׂירִית הָאֵיפָה סֹֽלֶת לְמִנְחָה בְּלוּלָה בְּשֶֽׁמֶן כָּתִית רְבִיעִת הַהִין: עֹלַת תָּמִיד הָעֲשֻׂיָה בְּהַר סִינַי לְרֵֽיחַ נִיחֹֽחַ אִשֶּׁה לַיהוָֹה: וְנִסְכּוֹ רְבִיעִת הַהִין לַכֶּֽבֶשׂ הָאֶחָד בַּקֹּֽדֶשׁ הַסֵּךְ נֶֽסֶךְ שֵׁכָר לַיהוָֹה: וְאֵת הַכֶּֽבֶשׂ הַשֵּׁנִי תַּעֲשֶׂה בֵּין הָעַרְבָּֽיִם כְּמִנְחַת הַבֹּֽקֶר וּכְנִסְכּוֹ תַּעֲשֶׂה אִשֵּׁה רֵֽיחַ נִיחֹֽחַ לַיהוָֹה:
      וְשָׁחַט אֹתוֹ עַל יֶֽרֶךְ הַמִּזְבֵּֽחַ צָפֹֽנָה לִפְנֵי יְהֹוָה וְזָרְ֒קוּ בְּנֵי אַהֲרֹן הַכֹּהֲנִים אֶת־דָּמוֹ עַל־הַמִּזְבֵּֽחַ סָבִיב:
      יְהִי רָצוֹן מִלְּ֒פָנֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ שֶׁתְּ֒הֵא אֲמִירָה זוּ חֲשׁוּבָה וּמְקֻבֶּֽלֶת וּמְרֻצָּה לְפָנֶֽיךָ כְּאִלּוּ הִקְרַֽבְנוּ קָרְבַּן הַתָּמִיד בְּמוֹעֲדוֹ וּבִמְקוֹמוֹ וּכְהִלְכָתוֹ:
  - id: shacharis-ketoret
    title: Ketoret
    titleHe: פרשת הקטורת
    text: |-
      אַתָּה הוּא יְהֹוָה אֱלֹהֵֽינוּ שֶׁהִקְטִֽירוּ אֲבוֹתֵֽינוּ לְפָנֶֽיךָ אֶת קְטֹֽרֶת הַסַּמִּים בִּזְמַן שֶׁבֵּית הַמִּקְדָּשׁ הָיָה קַיָּם כַּאֲשֶׁר צִוִּיתָ אוֹתָם עַל יְדֵי משֶׁה נְבִיאֶֽךָ כַּכָּתוּב בְּתוֹרָתֶֽךָ:
      וַיֹּֽאמֶר יְהֹוָה אֶל־משֶׁה קַח־לְךָ סַמִּים נָטָף וּשְׁחֵֽלֶת וְחֶלְבְּ֒נָה סַמִּים וּלְבֹנָה זַכָּה בַּד בְּבַד יִהְיֶה: וְעָשִֽׂיתָ אֹתָהּ קְטֹֽרֶת רֹֽקַח מַעֲשֵׂה רוֹקֵֽחַ מְמֻלָּח טָהוֹר קֹֽדֶשׁ: וְשָׁחַקְתָּ מִמֶּֽנָּה הָדֵק וְנָתַתָּה מִמֶּֽנָּה לִפְנֵי הָעֵדֻת בְּאֹֽהֶל מוֹעֵד אֲשֶׁר אִוָּעֵד לְךָ שָֽׁמָּה קֹֽדֶשׁ קָדָשִׁים תִּהְיֶה לָכֶם: וְנֶאֱמַר:
      וְהִקְטִיר עָלָיו אַהֲרֹן קְטֹֽרֶת סַמִּים בַּבֹּֽקֶר בַּבֹּֽקֶר בְּהֵיטִיבוֹ אֶת־הַנֵּרֹת יַקְטִירֶֽנָּה: וּבְהַעֲלֹת אַהֲרֹן אֶת־הַנֵּרֹת בֵּין הָֽעַרְבַּֽיִם יַקְטִירֶֽנָּה קְטֹֽרֶת תָּמִיד לִפְנֵי יְהֹוָה לְדֹרֹתֵיכֶם:
      תָּנוּ רַבָּנָן פִּטּוּם הַקְּ֒טֹֽרֶת כֵּיצַד שְׁלֹש מֵאוֹת וְשִׁשִּׁים וּשְׁמוֹנָה מָנִים הָיוּ בָהּ, שְׁלֹש מֵאוֹת וְשִׁשִּׁים וַחֲמִשָּׁה כְּמִנְיַן יְמוֹת הַחַמָּה מָנֶה לְכָל יוֹם, פְּרַס בַּשַּׁחֲרִית וּפְרַס בֵּין הָעַרְבָּֽיִם, וּשְׁלשָׁה מָנִים יְתֵרִים שֶׁמֵּהֶם מַכְנִיס כֹּהֵן גָּדוֹל מְלֹא חָפְנָיו בְּיוֹם הַכִּפּוּרִים, וּמַחֲזִירָן לְמַכְתֶּֽשֶׁת בְּעֶֽרֶב יוֹם הַכִּפּוּרִים, וְשׁוֹחֲקָן יָפֶה יָפֶה כְּדֵי שֶׁתְּ֒הֵא דַקָּה מִן הַדַּקָּה, וְאַחַד עָשָׂר סַמָּנִים הָֽיוּ בָהּ, וְאֵֽלּוּ הֵן: הַצֳּרִי וְהַצִּפֹּֽרֶן הַחֶלְבְּ֒נָה וְהַלְּ֒בוֹנָה מִשְׁקַל שִׁבְעִים שִׁבְעִים מָנֶה, מוֹר וּקְצִיעָה שִׁבֹּֽלֶת נֵרְדְּ וְכַרְכֹּם מִשְׁקַל שִׁשָּׁה עָשָׂר שִׁשָּׁה עָשָׂר מָנֶה, הַקּשְׁטְ שְׁנֵים עָשָׂר וְקִלּוּפָה שְׁלשָׁה וְקִנָּמוֹן תִּשְׁעָה, בֹּרִית כַּרְשִׁינָה תִּשְׁעָה קַבִּין, יֵין קַפְרִיסִין סְאִין תְּלָתָא וְקַבִּין תְּלָתָא, וְאִם אֵין לוֹ יֵין קַפְרִיסִין מֵבִיא חֲמַר חִוַּרְיָן עַתִּיק, מֶֽלַח סְדוֹמִית רֹֽבַע הַקָּב, מַעֲלֶה עָשָׁן כָּל שֶׁהוּא, רַבִּי נָתָן הַבַּבְלִי אוֹמֵר אַף כִּפַּת הַיַּרְדֵּן כָּל שֶׁהוּא, וְאִם נָֽתַן בָּהּ דְּבַשׁ פְּסָלָהּ וְאִם חִסַּר אַחַת מִכָּל־סַמָּנֶֽיהָ חַיָּב מִיתָה:
      רַבָּן שִׁמְעוֹן בֶּן גַּמְלִיאֵל אוֹמֵר הַצֳּרִי אֵינוֹ אֶלָּא שְׂרָף הַנּוֹטֵף מֵעֲצֵי הַקְּ֒טָף, בֹּרִית כַּרְשִׁינָה לָמָּה הִיא בָֽאָה כְּדֵי לְיַפּוֹת בָּהּ אֶת הַצִּפֹּרֶן כְּדֵי שֶׁתְּ֒הֵא נָאָה. יֵין קַפְרִיסִין לָמָּה הוּא בָא כְּדֵי לִשְׁרוֹת בּוֹ אֶת הַצִפֹּרֶן כְּדֵי שֶׁתְּ֒הֵא עַזָּה. וַהֲלֹא מֵי רַגְלַֽיִם יָפִין לָהּ אֶלָּא שֶׁאֵין מַכְנִיסִין מֵי רַגְלַֽיִם בַּמִּקְדָּשׁ מִפְּ֒נֵי הַכָּבוֹד:
      תַּנְיָא רַבִּי נָתָן אוֹמֵר כְּשֶׁהוּא שׁוֹחֵק אוֹמֵר הָדֵק הֵיטֵב הֵיטֵב הָדֵק מִפְּ֒נֵי שֶׁהַקּוֹל יָפֶה לַבְּ֒שָׂמִים, פִּטְּ֒מָהּ לַחֲצָאִין כְּשֵׁרָה לִשְׁלִישׁ וְלִרְבִֽיעַ לֹא שָׁמַֽעְנוּ: אָמַר רַבִּי יְהוּדָה זֶה הַכְּ֒לָל אִם כְּמִדָּתָהּ כְּשֵׁרָה לַחֲצָאִין וְאִם חִסַּר אַחַת מִכָּל סַמָּנֶֽיהָ חַיָּב מִיתָה:
      תַּנְיָא בַּר קַפָּרָא אוֹמֵר אַחַת לְשִׁשִּׁים אוֹ לְשִׁבְעִים שָׁנָה הָיְ֒תָה בָאָה שֶׁל שִׁירַֽיִם לַחֲצָאִין: וְעוֹד תָּנֵי בַּר קַפָּרָא אִלּוּ הָיָה נוֹתֵן בָּהּ קוֹרְ֒טוֹב שֶׁל דְּבַשׁ אֵין אָדָם יָכוֹל לַעֲמֹד מִפְּ֒נֵי רֵיחָהּ וְלָֽמָּה אֵין מְעָרְ֒בִין בָּהּ דְּבַשׁ מִפְּ֒נֵי שֶׁהַתּוֹרָה אָמְ֒רָה כִּי כָל־שְׂאֹר וְכָל־דְּבַשׁ לֹא־תַקְטִֽירוּ מִמֶּֽנּוּ אִשֶּׁה לַיהוָֹה:
      ג"פ: יְהֹוָה צְבָאוֹת עִמָּֽנוּ מִשְׂגַּב־לָֽנוּ אֱלֹהֵי יַעֲקֹב סֶֽלָה: ג"פ: יְהֹוָה צְבָאוֹת אַשְׁרֵי אָדָם בֹּטֵֽחַ בָּךְ: ג"פ: יְהֹוָה הוֹשִֽׁיעָה הַמֶּֽלֶךְ יַעֲנֵֽנוּ בְיוֹם־קָרְאֵֽנוּ:
      אַתָּה סֵֽתֶר לִי מִצַּר תִּצְּ֒רֵֽנִי רָנֵּי פַלֵּט תְּסוֹבְ֒בֵֽנִי סֶֽלָה: וְעָרְ֒בָה לַיהוָֹה מִנְחַת יְהוּדָה וִירוּשָׁלָֽםִ כִּימֵי עוֹלָם וּכְשָׁנִים קַדְמֹנִיּוֹת:
  - id: shacharis-order-of-the-temple-service
    title: Order of the Temple Service
    titleHe: סדר המערכה
    text: |-
      אַבַּיֵּי הֲוָה מְסַדֵּר סֵֽדֶר הַמַּעֲרָכָה מִשְּׁ֒מָא דִגְמָרָא וְאַלִּבָּא דְאַבָּא שָׁאוּל, מַעֲרָכָה גְדוֹלָה קוֹדֶֽמֶת לְמַעֲרָכָה שְׁנִיָּה שֶׁל קְטֹֽרֶת, וּמַעֲרָכָה שְׁנִיָּה שֶׁל קְטֹֽרֶת קוֹדֶֽמֶת לְסִדּוּר שְׁנֵי גִזְרֵי עֵצִים, וְסִדּוּר שְׁנֵי גִזְרֵי עֵצִים קֽוֹדֶם לְדִשּׁוּן מִזְבֵּֽחַ הַפְּ֒נִימִי, וְדִשּׁוּן מִזְבֵּֽחַ הַפְּ֒נִימִי קֽוֹדֶם לְהַטָּבַת חָמֵשׁ נֵרוֹת, וְהַטָּבַת חָמֵשׁ נֵרוֹת קוֹדֶֽמֶת לְדַם הַתָּמִיד, וְדַם הַתָּמִיד קֽוֹדֶם לְהַטָּבַת שְׁתֵּי נֵרוֹת, וְהַטָּבַת שְׁתֵּי נֵרוֹת קוֹדֶֽמֶת לִקְטֹֽרֶת, וּקְטֹֽרֶת קוֹדֶֽמֶת לְאֵבָרִים, וְאֵבָרִים לְמִנְחָה, וּמִנְחָה לַחֲבִתִּין, וַחֲבִתִּין לִנְסָכִין, וּנְסָכִין לְמוּסָפִין, וּמוּסָפִין לְבָזִיכִין, וּבָזִיכִין קוֹדְ֒מִין לְתָמִיד שֶׁל בֵּין הָעַרְבָּֽיִם, שֶׁנֶּאֱמַר וְעָרַךְ עָלֶֽיהָ הָעֹלָה וְהִקְטִיר עָלֶֽיהָ חֶלְבֵי הַשְּׁ֒לָמִים, עָלֶֽיהָ הַשְׁלֵם כָּל הַקָּרְבָּנוֹת כֻּלָּם:
      אָנָּא בְּכֹֽחַ גְּדֻלַּת יְמִינְ֒ךָ תַּתִּיר צְרוּרָה: קַבֵּל רִנַּת עַמְּ֒ךָ שַׂגְּ֒בֵֽנוּ טַהֲרֵֽנוּ נוֹרָא: נָא גִבּוֹר דּוֹרְ֒שֵׁי יִחוּדְ֒ךָ כְּבָבַת שָׁמְרֵם: בָּרְ֒כֵם טַהֲרֵם רַחֲמֵם צִדְקָתְ֒ךָ תָּמִיד גָּמְלֵם: חֲסִין קָדוֹשׁ בְּרֹב טוּבְ֒ךָ נַהֵל עֲדָתֶֽךָ: יָחִיד גֵּאֶה לְעַמְּ֒ךָ פְּנֵה, זוֹכְ֒רֵי קְדֻשָּׁתֶֽךָ: שַׁוְעָתֵֽנוּ קַבֵּל וּשְׁמַע צַעֲקָתֵֽנוּ יוֹדֵֽעַ תַּעֲלוּמוֹת: בָּרוּךְ שֵׁם כְּבוֹד מַלְכוּתוֹ לְעוֹלָם וָעֶד:
      רִבּוֹן הָעוֹלָמִים אַתָּה צִוִּיתָֽנוּ לְהַקְרִיב קָרְבַּן הַתָּמִיד בְּמוֹעֲדוֹ וְלִהְיוֹת כֹּהֲנִים בַּעֲבוֹדָתָם וּלְוִיִּם בְּדוּכָנָם וְיִשְׂרָאֵל בְּמַעֲמָדָם. וְעַתָּה בַּעֲוֹנוֹתֵֽינוּ חָרֵב בֵּית הַמִּקְדָּשׁ וּבָטֵל הַתָּמִיד וְאֵין לָֽנוּ לֹא כֹהֵן בַּעֲבוֹדָתוֹ וְלֹא לֵוִי בְּדוּכָנוֹ וְלֹא יִשְׂרָאֵל בְּמַעֲמָדוֹ. וְאַתָּה אָמַֽרְתָּ וּנְשַׁלְּ֒מָה פָרִים שְׂפָתֵֽינוּ. לָכֵן יְהִי רָצוֹן מִלְּ֒פָנֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ שֶׁיְּ֒הֵא שִֽׂיחַ שִׂפְתוֹתֵֽינוּ חָשׁוּב וּמְקֻבָּל וּמְרֻצֶּה לְפָנֶֽיךָ כְּאִלּוּ הִקְרַֽבְנוּ קָרְבַּן הַתָּמִיד בְּמוֹעֲדוֹ וְעָמַֽדְנוּ עַל־מַעֲמָדוֹ:
      בראש חודש מוסיפים:
      וּבְרָאשֵׁי חָדְשֵׁיכֶם תַּקְרִֽיבוּ עֹלָה לַיהוָֹה פָּרִים בְּנֵי־בָקָר שְׁנַֽיִם וְאַֽיִל אֶחָד כְּבָשִׂים בְּנֵי־שָׁנָה שִׁבְעָה תְּמִימִם: וּשְׁלשָׁה עֶשְׂרֹנִים סֹֽלֶת מִנְחָה בְּלוּלָה בַשֶּֽׁמֶן לַפָּר הָאֶחָד וּשְׁנֵי עֶשְׂרֹנִים סֹֽלֶת מִנְחָה בְּלוּלָה בַשֶּֽׁמֶן לָאַֽיִל הָאֶחָד: וְעִשָּׂרֹן עִשָּׂרוֹן סֹֽלֶת מִנְחָה בְּלוּלָה בַשֶּֽׁמֶן לַכֶּֽבֶשׂ הָאֶחָד עֹלָה רֵֽיחַ נִיחֹֽחַ אִשֶּׁה לַיהוָֹה: וְנִסְכֵּיהֶם חֲצִי הַהִין יִהְיֶה לַפָּר וּשְׁלִישִׁת הַהִין לָאַֽיִל וּרְבִיעִת הַהִין לַכֶּֽבֶשׂ יָֽיִן זֹאת עֹלַת חֹֽדֶשׁ בְּחָדְשׁוֹ לְחָדְשֵׁי הַשָּׁנָה: וּשְׂעִיר עִזִּים אֶחָד לְחַטָּאת לַיהוָֹה עַל עֹלַת הַתָּמִיד יֵעָשֶׂה וְנִסְכּוֹ:
  - id: shacharis-laws-of-sacrifices
    title: Laws of Sacrifices
    titleHe: דיני זבחים
    instruction: קבעו לשנות אחר פרשת התמיד פרק איזהו מקומן וברייתא דרבי ישמעאל כדי שיזכה כל אדם ללמוד בכל יום מקרא משנה וגמרא. דברייתא דרבי ישמעאל הוי במקום גמרא, שהמדרש כגמרא (שו"ע או"ח נ, א).
    text: |-
      משנה א אֵיזֶהוּ מְקוֹמָן שֶׁל זְבָחִים קָדְשֵׁי קָדָשִׁים שְׁחִיטָתָן בַּצָּפוֹן פָּר וְשָׂעִיר שֶׁל יוֹם הַכִּפּוּרִים שְׁחִיטָתָן בַּצָּפוֹן וְקִבּוּל דָּמָן בִּכְלִי שָׁרֵת בַּצָּפוֹן וְדָמָן טָעוּן הַזָּיָה עַל בֵּין הַבַּדִּים וְעַל הַפָּרֹֽכֶת וְעַל מִזְבַּח הַזָּהָב מַתָּנָה אַחַת מֵהֶן מְעַכָּֽבֶת: שְׁיָרֵי הַדָּם הָיָה שׁוֹפֵךְ עַל יְסוֹד מַעֲרָבִי שֶׁל מִזְבֵּֽחַ הַחִיצוֹן אִם לֹא נָתַן לֹא עִכֵּב:
      משנה ב פָּרִים הַנִּשְׂרָפִים וּשְׂעִירִים הַנִּשְׂרָפִים שְׁחִיטָתָן בַּצָּפוֹן וְקִבּוּל דָּמָן בִּכְלִי שָׁרֵת בַּצָּפוֹן וְדָמָן טָעוּן הַזָּיָה עַל הַפָּרֹֽכֶת וְעַל מִזְבַּח הַזָּהָב מַתָּנָה אַחַת מֵהֶן מְעַכָּֽבֶת: שְׁיָרֵי הַדָּם הָיָה שׁוֹפֵךְ עַל יְסוֹד מַעֲרָבִי שֶׁל מִזְבֵּֽחַ הַחִיצוֹן אִם לֹא נָתַן לֹא עִכֵּב אֵֽלּוּ וָאֵֽלּוּ נִשְׂרָפִין בְּבֵית הַדָּֽשֶׁן:
      משנה ג חַטֹּאת הַצִּבּוּר וְהַיָּחִיד אֵֽלּוּ הֵן חַטֹּאת הַצִּבּוּר שְׂעִירֵי רָאשֵׁי חֳדָשִׁים וְשֶׁל מוֹעֲדוֹת שְׁחִיטָתָן בַּצָּפוֹן וְקִבּוּל דָּמָן בִּכְלִי שָׁרֵת בַּצָּפוֹן וְדָמָן טָעוּן אַרְבַּע מַתָּנוֹת עַל אַרְבַּע קְרָנוֹת, כֵּיצַד עָלָה בַכֶּֽבֶשׁ וּפָנָה לַסּוֹבֵב וּבָא לוֹ לְקֶֽרֶן דְּרוֹמִית מִזְרָחִית, מִזְרָחִית צְפוֹנִית, צְפוֹנִית מַעֲרָבִית, מַעֲרָבִית דְּרוֹמִית, שְׁיָרֵי הַדָּם הָיָה שׁוֹפֵךְ עַל יְסוֹד דְּרוֹמִי וְנֶאֱכָלִין לִפְנִים מִן הַקְּ֒לָעִים לְזִכְרֵי כְהֻנָּה בְּכָל מַאֲכָל לְיוֹם וָלַֽיְלָה עַד חֲצוֹת:
      משנה ד הָעוֹלָה קֹֽדֶשׁ קָדָשִׁים שְׁחִיטָתָהּ בַּצָּפוֹן וְקִבּוּל דָּמָהּ בִּכְלִי שָׁרֵת בַּצָּפוֹן וְדָמָהּ טָעוּן שְׁתֵּי מַתָּנוֹת שֶׁהֵן אַרְבַּע וּטְעוּנָה הֶפְשֵׁט וְנִתּֽוּחַ וְכָלִיל לָאִשִּׁים:
      משנה ה זִבְחֵי שַׁלְמֵי צִבּוּר וַאֲשָׁמוֹת, אֵֽלּוּ הֵן אֲשָׁמוֹת אֲשַׁם גְּזֵלוֹת אֲשַׁם מְעִילוֹת אֲשַׁם שִׁפְחָה חֲרוּפָה אֲשַׁם נָזִיר אֲשַׁם מְצוֹרָע אָשָׁם תָּלוּי, שְׁחִיטָתָן בַּצָּפוֹן וְקִבּוּל דָּמָן בִּכְלִי שָׁרֵת בַּצָּפוֹן, וְדָמָן טָעוּן שְׁתֵּי מַתָּנוֹת שֶׁהֵן אַרְבַּע, וְנֶאֱכָלִין לִפְנִים מִן הַקְּ֒לָעִים לְזִכְרֵי כְהֻנָּה בְּכָל מַאֲכָל לְיוֹם וָלַֽיְלָה עַד חֲצוֹת:
      משנה ו הַתּוֹדָה וְאֵיל נָזִיר קָדָשִׁים קַלִּים שְׁחִיטָתָן בְּכָל־מָקוֹם בָּעֲזָרָה וְדָמָן טָעוּן שְׁתֵּי מַתָּנוֹת שֶׁהֵן אַרְבַּע, וְנֶאֱכָלִין בְּכָל־הָעִיר לְכָל־אָדָם בְּכָל־מַאֲכָל לְיוֹם וָלַֽיְלָה עַד־חֲצוֹת, הַמּוּרָם מֵהֶם כַּיּוֹצֵא בָהֶם אֶלָּא שֶׁהַמּוּרָם נֶאֱכָל לַכֹּהֲנִים לִנְשֵׁיהֶם וְלִבְנֵיהֶם וּלְעַבְדֵיהֶם:
      משנה ז שְׁלָמִים קָדָשִׁים קַלִּים שְׁחִיטָתָן בְּכָל מָקוֹם בָּעֲזָרָה וְדָמָן טָעוּן שְׁתֵּי מַתָּנוֹת שֶׁהֵן אַרְבַּע, וְנֶאֱכָלִין בְּכָל הָעִיר לְכָל אָדָם בְּכָל מַאֲכָל לִשְׁנֵי יָמִים וְלַֽיְלָה אֶחָד: הַמּוּרָם מֵהֶם כַּיּוֹצֵא בָהֶם אֶלָּא שֶׁהַמּוּרָם נֶאֱכָל לַכֹּהֲנִים לִנְשֵׁיהֶם וְלִבְנֵיהֶם וּלְעַבְדֵיהֶם:
      משנה ח הַבְּ֒כוֹר וְהַמַּעֲשֵׂר וְהַפֶּֽסַח קָדָשִׁים קַלִּים שְׁחִיטָתָן בְּכָל מָקוֹם בָּעֲזָרָה וְדָמָן טָעוּן מַתָּנָה אֶחָת וּבִלְבָד שֶׁיִּתֵּן כְּנֶֽגֶד הַיְסוֹד, שִׁנָּה בַאֲכִילָתָן הַבְּ֒כוֹר נֶאֱכָל לַכֹּהֲנִים וְהַמַּעֲשֵׂר לְכָל אָדָם, וְנֶאֱכָלִין בְּכָל הָעִיר בְּכָל מַאֲכָל לִשְׁנֵי יָמִים וְלַֽיְלָה אֶחָד: הַפֶּֽסַח אֵינוֹ נֶאֱכָל אֶלָּא בַלַּֽיְלָה וְאֵינוֹ נֶאֱכָל אֶלָּא עַד חֲצוֹת וְאֵינוֹ נֶאֱכָל אֶלָּא לִמְנוּיָו וְאֵינוֹ נֶאֱכָל אֶלָּא צָלִי:
  - id: shacharis-baraita-of-rabbi-yishmael
    title: Baraita of Rabbi Yishmael
    titleHe: ברייתא דרבי ישמעאל
    text: |-
      רַבִּי יִשְׁמָעֵאל אוֹמֵר בִּשְׁלֹשׁ עֶשְׂרֵה מִדּוֹת הַתּוֹרָה נִדְרָֽשֶׁת:
      מִקַּל וָחֹֽמֶר.
      וּמִגְּ֒זֵרָה שָׁוָה.
      מִבִּנְיַן אָב מִכָּתוּב אֶחָד, וּמִבִּנְיַן אָב מִשְּׁ֒נֵי כְתוּבִים.
      מִכְּ֒לָל וּפְרָט.
      וּמִפְּ֒רָט וּכְלָל.
      כְּלָל וּפְרָט וּכְלָל אִי אַתָּה דָן אֶלָּא כְּעֵין הַפְּ֒רָט.
      מִכְּ֒לָל שֶׁהוּא צָרִיךְ לִפְרָט וּמִפְּ֒רָט שֶׁהוּא צָרִיךְ לִכְלָל.
      כָּל־דָּבָר שֶׁהָיָה בִּכְלָל וְיָצָא מִן הַכְּ֒לָל לְלַמֵּד לֹא לְלַמֵּד עַל עַצְמוֹ יָצָא אֶלָּא לְלַמֵּד עַל הַכְּ֒לָל כֻּלּוֹ יָצָא.
      כָּל־דָּבָר שֶׁהָיָה בִּכְלָל וְיָצָא לִטְעֹן טֹֽעַן אֶחָד שֶׁהוּא כְעִנְיָנוֹ יָצָא לְהָקֵל וְלֹא לְהַחֲמִיר.
      כָּל־דָּבָר שֶׁהָיָה בִּכְלָל וְיָצָא לִטְעֹן טֹֽעַן אַחֵר שֶׁלֹּא כְעִנְיָנוֹ יָצָא לְהָקֵל וּלְהַחֲמִיר.
      כָּל־דָּבָר שֶׁהָיָה בִּכְלָל וְיָצָא לִדּוֹן בַּדָּבָר הֶחָדָשׁ אִי אַתָּה יָכוֹל לְהַחֲזִירוֹ לִכְלָלוֹ עַד שֶׁיַּחֲזִירֶֽנּוּ הַכָּתוּב לִכְלָלוֹ בְּפֵרוּשׁ.
      דָּבָר הַלָּמֵד מֵעִנְיָנוֹ וְדָבָר הַלָּמֵד מִסּוֹפוֹ.
      וְכֵן שְׁנֵי כְתוּבִים הַמַּכְחִישִׁים זֶה אֶת־זֶה עַד שֶׁיָּבֹא הַכָּתוּב הַשְּׁ֒לִישִׁי וְיַכְרִֽיעַ בֵּינֵיהֶם:
      יְהִי רָצוֹן מִלְּ֒פָנֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ שֶׁיִּבָּנֶה בֵּית הַמִּקְדָּשׁ בִּמְהֵרָה בְיָמֵֽינוּ וְתֵן חֶלְקֵֽנוּ בְּתוֹרָתֶֽךָ: וְשָׁם נַעֲבָדְךָ בְּיִרְאָה כִּימֵי עוֹלָם וּכְשָׁנִים קַדְמוֹנִיּוֹת:
  - id: shacharis-kaddish-derabbanan
    title: Kaddish DeRabbanan
    titleHe: קדיש דרבנן
    instruction: מה שאנו אומרין הקדיש בלשון תרגום, יש אומרים מפני המלאכים שלא יתקנאו בנו שאנו משבחים שבח נאה כזה ואם יבינו המלאכים זה יקטרגו עלינו, על כן אומרים אותו בלשון שלא יבינו, שאינן מכירין ארמית. ויש מפרשים הטעם לפי שהיו רגילין לומר אותו אחר הדרשה והיו שם עמי הארץ שאינן מכירין אלא ארמית שהוא לשונם לכן נהגו לאומרו בלשון שהכל מבינין בו (ע"פ טור או"ח נו)
    text: |-
      יִתְגַּדַּל וְיִתְקַדַּשׁ שְׁמֵהּ רַבָּא (אָמֵן)
      בְּעָלְ֒מָֽא דִּי־בְרָא כִרְעוּתֵהּ וְיַמְלִיךְ מַלְכוּתֵהּ בְּחַיֵּיכוֹן וּבְיוֹמֵיכוֹן וּבְחַיֵּי דְכָל־בֵּית יִשְׂרָאֵל בַּעֲגָלָא וּבִזְמַן קָרִיב וְאִמְרוּ אָמֵן:
      יְהֵא שְׁמֵהּ רַבָּא מְבָרַךְ לְעָלַם וּלְעָלְ֒מֵי עָלְ֒מַיָּא
      יִתְבָּרַךְ וְיִשְׁתַּבַּח וְיִתְפָּאַר וְיִתְרוֹמַם וְיִתְנַשֵּׂא וְיִתְהַדָּר וְיִתְעַלֶּה וְיִתְהַלָּל שְׁמֵהּ דְקוּדְשָׁא בְּרִיךְ הוּא
      לְעֵֽלָּא מִן־כָּל־ (בעשי"ת לְעֵֽלָּא לְעֵֽלָּא מִכָּל) בִּרְכָתָֽא וְשִׁירָתָֽא תֻּשְׁבְּ֒חָתָֽא וְנֶחָמָתָֽא דַּאֲמִירָן בְּעָלְ֒מָֽא וְאִמְרוּ אָמֵן:
      עַל יִשְׂרָאֵל וְעַל רַבָּנָן וְעַל תַלְמִידֵיהוֹן וְעַל כָּל תַּלְמִידֵי תַלְמִידֵיהוֹן. וְעַל כָּל מָאן דְּעָסְ֒קִין בְּאוֹרַיְתָא. דִּי בְאַתְרָא הָדֵין וְדִי בְכָל אֲתַר וַאֲתַר. יְהֵא לְהוֹן וּלְכוֹן שְׁלָמָא רַבָּא חִנָּא וְחִסְדָּא וְרַחֲמִין וְחַיִּין אֲרִיכִין וּמְזוֹנָא רְוִיחֵי וּפוּרְקָנָא מִן קֳדָם אֲבוּהוֹן דְבִשְׁמַיָּא (וְאַרְעָא) וְאִמְרוּ אָמֵן:
      יְהֵא שְׁלָמָֽא רַבָּֽא מִן־שְׁמַיָּֽא וְחַיִּים עָלֵֽינוּ וְעַל־כָּל־יִשְׂרָאֵל וְאִמְרוּ אָמֵן:
      עוֹשֶׂה שָׁלוֹם (בעשי"ת הַשָּׁלוֹם) בִּמְרוֹמָיו הוּא יַעֲשֶׂה שָׁלוֹם עָלֵֽינוּ וְעַל כָּל יִשְׂרָאֵל וְאִמְרוּ אָמֵן:
