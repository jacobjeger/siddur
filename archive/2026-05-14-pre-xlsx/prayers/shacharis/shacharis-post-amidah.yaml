id: shacharis-post-amidah
name: Post Amidah
nameHe: אחר העמידה
category: shacharis
timeContext: shacharis
sections:
  - id: shacharis-vidui-and-13-middot
    title: Vidui and 13 Middot
    titleHe: וידוי וי"ג מידות
    instruction: טעם נכון למה נתקן הוידוי בלשון רבים כי היה צריך לומר אשמתי בגדתי וכו'. אך העניין הוא שמלבד מה שנענש האדם על חטאיו גם הוא נענש על חברו מטעם הערבות כי כל ישראל הם גוף אחד כלול מאיברים רבים. אם כן לזה ראוי לאדם שיתוודה בלשון רבים כדי שיתוודה גם על חברו. (שער הכונות)
    text: |-
      אֱלֺהֵֽינוּ וֵאלֺהֵי אֲבוֹתֵֽינוּ תָּבֹא לְפָנֶֽיךָ תְּפִלָּֽתֵֽנוּ, וְאַל־תִּתְעַלַּם מִתְּ֒חִנָּתֵֽנוּ שֶׁאֵין אָֽנוּ עַזֵּי פָנִים וּקְשֵׁי עֹֽרֶף לוֹמַר לְפָנֶֽיךָ יְהֹוָה אֱלֺהֵֽינוּ וֵאלֺהֵי אֲבוֹתֵֽינוּ צַדִּיקִים אֲנַֽחְנוּ וְלֺא חָטָֽאנוּ אֲבָל אֲנַֽחְנוּ וַאֲבוֹתֵֽינוּ חָטָֽאנוּ:
      אָשַֽׁמְנוּ. בָּגַֽדְנוּ. גָּזַֽלְנוּ. דִּבַּֽרְנוּ דֹּֽפִי. הֶעֱוִֽינוּ. וְהִרְשַֽׁעְנוּ. זַֽדְנוּ. חָמַֽסְנוּ. טָפַֽלְנוּ שֶֽׁקֶר. יָעַֽצְנוּ רָע. כִּזַּֽבְנוּ. לַֽצְנוּ. מָרַֽדְנוּ. נִאַֽצְנוּ. סָרַֽרְנוּ. עָוִֽינוּ. פָּשַֽׁעְנוּ. צָרַֽרְנוּ. קִשִּֽׁינוּ עֹֽרֶף. רָשַֽׁעְנוּ. שִׁחַֽתְנוּ. תִּעַֽבְנוּ. תָּעִֽינוּ. תִּעְתָּֽעְנוּ:
      סַֽרְנוּ מִמִּצְוֹתֶֽיךָ וּמִמִּשְׁפָּטֶֽיךָ הַטּוֹבִים וְלֺא שָֽׁוָה לָֽנוּ. וְאַתָּה צַדִּיק עַל כָּל הַבָּא עָלֵֽינוּ. כִּי אֱמֶת עָשִֽׂיתָ וַאֲנַֽחְנוּ הִרְשָֽׁעְנוּ:
      אֵל אֶֽרֶךְ־אַפַּֽיִם אַתָּה. וּבַֽעַל הָרַחֲמִים נִקְרֵֽאתָ. וְדֶֽרֶךְ תְּשׁוּבָה הוֹרֵֽיתָ: גְּדֻלַּת רַחֲמֶֽיךָ וַחֲסָדֶֽיךָ. תִּזְכֺּר הַיּוֹם וּבְכָל־יוֹם לְזֶֽרַע יְדִידֶֽיךָ: תֵּֽפֶן אֵלֵֽינוּ בְּרַחֲמִים. כִּי אַתָּה הוּא בַּֽעַל הָרַחֲמִים: בְּתַחֲנוּן וּבִתְפִלָּה פָּנֶֽיךָ נְקַדֵּם. כְּהוֹדַֽעְתָּ לֶעָנָיו מִקֶּֽדֶם: מֵחֲרוֹן אַפְּ֒ךָ שׁוּב. כְּמוֹ בְּתוֹרָתְ֒ךָ כָּתוּב: וּבְצֵל כְּנָפֶֽיךָ נֶחֱסֶה וְנִתְלוֹנָן. כְּיוֹם וַיֵֽרֶד יְהֺוָה בֶּעָנָן: תַּעֲבֺר עַל־פֶּֽשַׁע וְתִמְחֶה אָשָׁם. כְּיוֹם וַַיִּתְיַצֵּב עִמּוֹ שָׁם: תַּאֲזִין שַׁוְעָתֵֽנוּ וְתַקְשִׁיב מֶֽנוּ מַאֲמַר. כְּיוֹם וַיִּקְרָא בְשֵׁם יְהֹוָה, וְשָׁם נֶאֱמַר:
      קהל וש"ץ:
      וַיַּעֲבֹר יְהֺוָה עַל פָּנָיו וַיִּקְרָא:
      יְהֺוָה יְהֺוָה אֵל רַחוּם וְחַנּוּן אֶֽרֶךְ אַפַּֽיִם וְרַב־חֶֽסֶד וֶאֱמֶת: נֹצֵר חֶֽסֶד לָאֲלָפִים נֹשֵׂא עָוֹן וָפֶֽשַׁע וְחַטָּאָה וְנַקֵּה:
      וְסָלַחְתָּ לַעֲוֺנֵֽנוּ וּלְחַטָּאתֵֽנוּ וּנְחַלְתָּֽנוּ: סְלַח־לָֽנוּ אָבִֽינוּ כִּי־חָטָֽאנוּ. מְחַל־לָֽנוּ מַלְכֵּֽנוּ כִּי־פָשָֽׁעְנוּ: כִּי־אַתָּה אֲדֺנָי טוֹב וְסַלָּח וְרַב־חֶֽסֶד לְכָל־קוֹרְ֒אֶֽיךָ:
  - id: shacharis-avinu-malkenu
    title: Avinu Malkenu
    titleHe: אבינו מלכנו
    instruction: בתענית ציבור ובעשי"ת אומרים כאן אבינו מלכנו. גודל מעלת אבינו מלכנו הובא בספרים. ויסדה רבי עקיבא. ונתקן כנגד ברכות אמצעיות דתפלת י"ח דחול. ולפי שיש בו מעין י"ח אין אומרים בשבת.
    text: |-
      אָבִֽינוּ מַלְכֵּֽנוּ חָטָֽאנוּ לְפָנֶֽיךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ אֵין לָֽנוּ מֶֽלֶךְ אֶלָּא אָֽתָּה:
      אָבִֽינוּ מַלְכֵּֽנוּ עֲשֵׂה עִמָּֽנוּ לְמַֽעַן שְׁמֶֽךָ:
      בעשי"ת: אָבִֽינוּ מַלְכֵּֽנוּ חַדֵּשׁ עָלֵֽינוּ שָׁנָה טוֹבָה:
      בתענית ציבור: אָבִֽינוּ מַלְכֵּֽנוּ בָּרֵךְ עָלֵֽינוּ שָׁנָה טוֹבָה:
      אָבִֽינוּ מַלְכֵּֽנוּ בַּטֵּל מֵעָלֵֽינוּ כָּל גְּזֵרוֹת קָשׁוֹת:
      אָבִֽינוּ מַלְכֵּֽנוּ בַּטֵּל מַחְשְׁ֒בוֹת שׂוֹנְ֒אֵֽינוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ הָפֵר עֲצַת אוֹיְ֒בֵֽינוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ כַּלֵּה כָּל צַר וּמַשְׂטִין מֵעָלֵֽינוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ סְתוֹם פִּיּוֹת מַשְׂטִינֵֽנוּ וּמְקַטְרְ֒גֵֽנוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ כַּלֵּה דֶּֽבֶר וְחֶֽרֶב וְרָעָב וּשְׁבִי וּמַשְׁחִית וְעָוֹן וּשְׁמַד מִבְּ֒נֵי בְרִיתֶֽךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ מְנַע מַגֵּפָה מִנַּחֲלָתֶֽךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ סְלַח וּמְחַל לְכָל עֲוֹנוֹתֵֽינוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ מְחֵה וְהַעֲבֵר פְּשָׁעֵֽינוּ וְחַטֹּאתֵֽינוּ מִנֶּֽגֶד עֵינֶֽיךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ מְחוֹק בְּרַחֲמֶֽיךָ הָרַבִּים כָּל שִׁטְרֵי חוֹבוֹתֵֽינוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ הַחֲזִירֵֽנוּ בִּתְשׁוּבָה שְׁלֵמָה לְפָנֶֽיךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ שְׁלַח רְפוּאָה שְׁלֵמָה לְחוֹלֵי עַמֶּֽךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ קְרַע רֹֽעַ גְּזַר דִּינֵֽנוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ זָכְרֵֽנוּ בְּזִכָּרוֹן טוֹב לְפָנֶֽיךָ:
      בעשרת ימי תשובה:
      אָבִֽינוּ מַלְכֵּֽנוּ כָּתְבֵֽנוּ בְּסֵֽפֶר חַיִּים טוֹבִים:
      אָבִֽינוּ מַלְכֵּֽנוּ כָּתְבֵֽנוּ בְּסֵֽפֶר גְּאֻלָּה וִישׁוּעָה:
      אָבִֽינוּ מַלְכֵּֽנוּ כָּתְבֵֽנוּ בְּסֵֽפֶר פַּרְנָסָה וְכַלְכָּלָה:
      אָבִֽינוּ מַלְכֵּֽנוּ כָּתְבֵֽנוּ בְּסֵֽפֶר זְכֻיּוֹת:
      אָבִֽינוּ מַלְכֵּֽנוּ כָּתְבֵֽנוּ בְּסֵֽפֶר סְלִיחָה וּמְחִילָה:
      בתענית ציבור
      אָבִֽינוּ מַלְכֵּֽנוּ זָכְרֵֽנוּ לְחַיִּים טוֹבִים:
      אָבִֽינוּ מַלְכֵּֽנוּ זָכְרֵֽנוּ לִגְאֻלָּה וִישׁוּעָה:
      אָבִֽינוּ מַלְכֵּֽנוּ זָכְרֵֽנוּ לְפַרְנָסָה וְכַלְכָּלָה:
      אָבִֽינוּ מַלְכֵּֽנוּ זָכְרֵֽנוּ לִזְכֻיּוֹת:
      אָבִֽינוּ מַלְכֵּֽנוּ זָכְרֵֽנוּ לִסְלִיחָה וּמְחִילָה:
      אָבִֽינוּ מַלְכֵּֽנוּ הַצְמַח לָֽנוּ יְשׁוּעָה בְּקָרוֹב:
      אָבִֽינוּ מַלְכֵּֽנוּ הָרֵם קֶֽרֶן יִשְׂרָאֵל עַמֶּֽךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ הָרֵם קֶֽרֶן מְשִׁיחֶֽךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ מַלֵּא יָדֵֽינוּ מִבִּרְכוֹתֶֽיךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ מַלֵּא אֲסָמֵֽינוּ שָׂבָע:
      אָבִֽינוּ מַלְכֵּֽנוּ שְׁמַע קוֹלֵֽנוּ חוּס וְרַחֵם עָלֵֽינוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ קַבֵּל בְּרַחֲמִים וּבְרָצוֹן אֶת תְּפִלָּתֵֽנוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ פְּתַח שַׁעֲרֵי שָׁמַֽיִם לִתְפִלָּתֵֽנוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ זָכוֹר כִּי עָפָר אֲנָֽחְנוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ נָא אַל תְּשִׁיבֵֽנוּ רֵיקָם מִלְּפָנֶֽיךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ תְּהֵא הַשָּׁעָה הַזֹּאת שְׁעַת רַחֲמִים וְעֵת רָצוֹן מִלְּפָנֶֽיךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ חֲמוֹל עָלֵֽינוּ וְעַל עוֹלָלֵֽינוּ וְטַפֵּֽנוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ עֲשֵׂה לְמַֽעַן הֲרוּגִים עַל שֵׁם קָדְשֶֽׁךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ עֲשֵׂה לְמַֽעַן טְבוּחִים עַל יִחוּדֶֽךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ עֲשֵׂה לְמַֽעַן בָּאֵי בָאֵשׁ וּבַמַּֽיִם עַל קִדּוּשׁ שְׁמֶֽךָ:
      אָבִֽינוּ מַלְכֵּֽנוּ נְקוֹם לְעֵינֵֽינוּ נִקְמַת דַּם־עֲבָדֶֽיךָ הַשָּׁפוּךְ:
      אָבִֽינוּ מַלְכֵּֽנוּ עֲשֵׂה לְמַעַנְךָ אִם לֺא לְמַעֲנֵֽנוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ עֲשֵׂה לְמַעַנְךָ וְהוֹשִׁיעֵֽנוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ עֲשֵׂה לְמַֽעַן רַחֲמֶֽיךָ הָרַבִּים:
      אָבִֽינוּ מַלְכֵּֽנוּ עֲשֵׂה לְמַֽעַן שִׁמְךָ הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא שֶׁנִּקְרָא עָלֵֽינוּ:
      אָבִֽינוּ מַלְכֵּֽנוּ חָנֵּֽנוּ וַעֲנֵֽנוּ כִּי אֵין בָּֽנוּ מַעֲשִׂים עֲשֵׂה עִמָּֽנוּ צְדָקָה וָחֶֽסֶד וְהוֹשִׁיעֵֽנוּ:
      בשני וחמישי יאמר והוא רחום. בשאר ימים שאומרים בהם תחנון יאמר שומר ישראל.
  - id: shacharis-for-monday-and-thursday
    title: For Monday and Thursday
    titleHe: והוא רחום
    instruction: נוהגים להרבות בתחנונים בשני וחמישי משום דאמרינן במדרש דמרע"ה עלה בחמישי לקבל לוחות אחרונות וירד בשני. ואומרים והוא רחום. ויש במדרש דג' זקנים תקנוהו. שתפשם מלך אחד ונתנם בג' ספינות בלא מנהיג. ושלחם לים ונתפזרו למרחקים. ולמקום שבאו הציר להם מאד ועמדו בתפלה וכל אחד יסד מקצת. ובכל חלק י"ח שמות כנגד תפלת י"ח. וימת אותו מלך שהציר להם בתחלואים רעים. ושלחו תפלתם בכל תפוצות ישראל לאמרה בשני וחמישי (ע"פ מחזור מכל השנה)
    text: |-
      וְהוּא רַחוּם יְכַפֵּר עָוֺן וְלֹא־יַשְׁחִית וְהִרְבָּה לְהָשִׁיב אַפּוֹ וְלֹא־יָעִיר כָּל־חֲמָתוֹ: אַתָּה יְהֹוָה לֺא תִכְלָא רַחֲמֶֽיךָ מִמֶּֽנּוּ חַסְדְּ֒ךָ וַאֲמִתְּ֒ךָ תָּמִיד יִצְ֒רֽוּנוּ: הוֹשִׁיעֵֽנוּ יְהֹוָה אֱלֺהֵֽינוּ וְקַבְּ֒צֵֽנוּ מִן־הַגּוֹיִם לְהוֹדוֹת לְשֵׁם קָדְשֶֽׁךָ לְהִשְׁתַּבֵּֽחַ בִּתְ֒הִלָּתֶֽךָ: אִם־עֲוֺנוֹת תִּשְׁמָר־יָהּ אֲדֹנָי מִי יַעֲמֹד: כִּי־עִמְּ֒ךָ הַסְּ֒לִיחָה לְמַֽעַן תִּוָּרֵא: לֺא כַחֲטָאֵֽינוּ תַּעֲשֶׂה־לָּֽנוּ וְלֹא כַעֲוֺנֹתֵֽינוּ תִּגְמֹל עָלֵֽינוּ: אִם־עֲוֺנֵֽינוּ עָֽנוּ בָֽנוּ יְהֹוָה עֲשֵׂה לְמַֽעַן שְׁמֶֽךָ: זְכָר־רַחֲמֶֽיךָ יְהֹוָה וַחֲסָדֶֽיךָ כִּי מֵעוֹלָם הֵֽמָּה: יַעֲנֵֽנוּ יְהֹוָה בְּיוֹם צָרָה יְשַׂגְּ֒בֵֽנוּ שֵׁם אֱלֺהֵי יַעֲקֹב: יְהֹוָה הוֹשִֽׁיעָה הַמֶּֽלֶךְ יַעֲנֵֽנוּ בְיוֹם־קָרְאֵֽנוּ: אָבִֽינוּ מַלְכֵּֽנוּ חָנֵּֽנוּ וַעֲנֵֽנוּ כִּי אֵין בָּֽנוּ מַעֲשִׂים צְדָקָה עֲשֵׂה עִמָּֽנוּ לְמַֽעַן שְׁמֶֽךָ: אֲדוֹנֵֽינוּ אֱלֺהֵֽינוּ שְׁמַע קוֹל תַּחֲנוּנֵֽינוּ וּזְכָר־לָֽנוּ אֶת־בְּרִית אֲבוֹתֵֽינוּ וְהוֹשִׁיעֵֽנוּ לְמַֽעַן שְׁמֶֽךָ: וְעַתָּה אֲדֹנָי אֱלֺהֵֽינוּ אֲשֶׁר הוֹצֵֽאתָ אֶת־עַמְּ֒ךָ מֵאֶֽרֶץ מִצְרַֽיִם בְּיָד חֲזָקָה וַתַּֽעַשׂ־לְךָ שֵׁם כַּיּוֹם הַזֶּה חָטָֽאנוּ רָשָֽׁעְנוּ: אֲדֹנָי כְּכָל־צִדְ֒קֹתֶֽיךָ יָֽשָׁב־נָא אַפְּ֒ךָ וַחֲמָתְ֒ךָ מֵעִירְ֒ךָ יְרוּשָׁלַֽםִ הַר־קָדְשֶֽׁךָ כִּי בַחֲטָאֵֽינוּ וּבַעֲוֺנוֹת אֲבֹתֵֽינוּ יְרוּשָׁלַֽםִ וְעַמְּ֒ךָ לְחֶרְפָּה לְכָל־סְבִיבֹתֵֽינוּ: וְעַתָּה שְׁמַע אֱלֺהֵֽינוּ אֶל־תְּפִלַּת עַבְדְּךָ וְאֶל־תַּחֲנוּנָיו וְהָאֵר פָּנֶֽיךָ עַל־מִקְדָּשְׁ֒ךָ הַשָּׁמֵם לְמַֽעַן אֲדֹנָי:
      הַטֵּה אֱלֺהַי אָזְנְךָ וּשְׁ֒מָע פְּקַח עֵינֶֽיךָ וּרְאֵה שֹׁמְ֒מוֹתֵֽינוּ וְהָעִיר אֲשֶׁר־נִקְרָא שִׁמְךָ עָלֶֽיהָ כִּי לֺא עַל־צִדְ֒קֹתֵֽינוּ אֲנַֽחְנוּ מַפִּילִים תַּחֲנוּנֵֽינוּ לְפָנֶֽיךָ כִּי עַל־רַחֲמֶֽיךָ הָרַבִּים: אֲדֹנָי שְׁמָֽעָה אֲדֹנָי סְלָֽחָה אֲדֹנָי הַקְשִֽׁיבָה וַעֲשֵׂה אַל־תְּאַחַר: לְמַעַנְךָ אֱלֺהַי כִּי־שִׁמְךָ נִקְרָא עַל־עִירְ֒ךָ וְעַל־עַמֶּֽךָ: אָבִֽינוּ אָב הָרַחֲמָן הַרְאֵֽנוּ אוֹת לְטוֹבָה וְקַבֵּץ נְפוּצוֹתֵֽינוּ מֵאַרְבַּע כַּנְפוֹת הָאָֽרֶץ: יַכִּֽירוּ וְיֵדְ֒עוּ כָּל־הַגּוֹיִם כִּי אַתָּה יְהֹוָה אֱלֺהֵֽינוּ: וְעַתָּה יְהֹוָה אָבִֽינוּ אָֽתָּה אֲנַֽחְנוּ הַחֹֽמֶר וְאַתָּה יֹצְ֒רֵֽנוּ וּמַעֲשֵׂה יָדְ֒ךָ כֻּלָּֽנוּ: הוֹשִׁיעֵֽנוּ לְמַֽעַן שְׁמֶֽךָ צוּרֵֽנוּ מַלְכֵּֽנוּ וְגוֹאֲלֵֽנוּ: חֽוּסָה יְהֹוָה עַל־עַמֶּֽךָ וְאַל־תִּתֵּן נַחֲלָתְ֒ךָ לְחֶרְפָּה לִמְשָׁל־בָּם גּוֹיִם: לָֽמָּה יֹאמְ֒רוּ בָעַמִּים אַיֵּה אֱלֺהֵיהֶם: יָדַֽעְנוּ כִּי חָטָֽאנוּ וְאֵין מִי יַעֲמֹד בַּעֲדֵֽנוּ שִׁמְךָ הַגָּדוֹל יַעֲמָד־לָֽנוּ בְּעֵת צָרָה: יָדַֽעְנוּ כִּי אֵין בָּֽנוּ מַעֲשִׂים צְדָקָה עֲשֵׂה עִמָּֽנוּ לְמַֽעַן שְׁמֶֽךָ: כְּרַחֵם אָב עַל־בָּנִים כֵּן תְּרַחֵם יְהֹוָה עָלֵֽינוּ וְהוֹשִׁיעֵֽנוּ לְמַֽעַן שְׁמֶֽךָ: חֲמוֹל עַל עַמֶּֽךָ רַחֵם עַל נַחֲלָתֶֽךָ חֽוּסָה־נָּא כְּרוֹב רַחֲמֶֽיךָ חָנֵּֽנוּ וַעֲנֵֽנוּ כִּי לְךָ יְהֹוָה הַצְּ֒דָקָה עֹשֵׂה נִפְלָאוֹת בְּכָל עֵת:
      הַבֶּט־נָא רַחֶם־נָא עַל־עַמְּךָ מְהֵרָה לְמַֽ‎עַן שְׁמֶךָ: בְּרַחֲמֶֽ‎יךָ הָרַבִּים יְהֹוָה אֱלהֵֽ‎ינוּ חוּס וְרַחֵם וְהוֹשִֽׁיעָה צֹאן מַרְעִיתֶֽךָ וְאַל־יִמְשָׁל בָּֽ‎נוּ קֶצֶף כִּי לְךָ עֵינֵֽ‎ינוּ תְלוּיות: הושִׁיעֵֽ‎נוּ לְמַֽ‎עַן שְׁמֶֽ‎ךָ רַחֵם עָלֵֽינוּ לְמַעַן בְּרִיתֶֽךָ: הַבִּֽיטָה וַעֲנֵֽ‎נוּ בְּעֵת צָרָה כִּי לְךָ יְהֹוָה הַיְשׁוּעָה: בְּךָ תוֹחַלְתֵּֽ‎נוּ אֱלֽ‎וֹהַּ סְלִיחות אָנָּא סְלַח־נָא אֵל טוֹב וְסַלָּח כִּי אֵל מֶֽ‎לֶךְ חַנּוּן וְרַחוּם אָֽתָּה:
      אָנָּא מֶֽלֶךְ חַנּוּן וְרַחוּם זְכוֹר וְהַבֵּט לִבְ֒רִית בֵּין הַבְּ֒תָרִים וְתֵרָאֶה לְפָנֶֽיךָ עֲקֵדַת יָחִיד לְמַֽעַן יִשְׂרָאֵל: אָבִֽינוּ מַלְכֵּ‎ֽנוּ חָנֵּֽנוּ וַעֲנֵֽנוּ כִּי שִׁמְךָ הַגָּדוֹל נִקְרָא עָלֵֽינוּ עֹשֵׂה נִפְלָאוֹת בְּכָל־עֵת עֲשֵׂה עִמָּֽנוּ כְּחַסְדֶּֽךָ: חַנּוּן וְרַחוּם הַבִּֽיטָה וַעֲנֵֽנוּ בְּעֵת צָרָה כִּי לְךָ יְהֺוָה הַיְשׁוּעָה: אָבִֽינוּ מַלְכֵּֽנוּ מַחֲסֵֽנוּ אַל־תַּֽעַשׁ עִמָּֽנוּ כְּרֹֽעַ מַעֲלָלֵֽינוּ: זְכֹר רַחֲמֶֽיךָ יְהֺוָה וַחֲסָדֶֽיךָ וּכְרוֹב טוּבְךָ הושִׁיעֵֽנוּ וַחֲמָל־נָא עָלֵֽינוּ כִּי אֵין לָֽנוּ אֱלֽוֹהַּ אַחֵר מִבַּלְעָדֶֽיךָ צוּרֵֽנוּ: אַל תַּעַזְבֵֽנוּ יְהֺוָה אֱלֹהֵֽינוּ אַל תִּרְחַק מִמֶּֽנוּ כִּי נַפְשֵֽׁנוּ קְצָרָה מֵחֶֽרֶב וּמִשְּׁבִי וּמִדֶּֽבֶר וּמִמַּגֵּפָה וּמִכָּל־צָרָה וְיָגוֹן: הַצִּילֵֽנוּ כִּי לְךָ קִוִּֽינוּ וְאַל תַּכְלִימֵֽנוּ יְהֺוָה אֱלֹהֵֽינוּ וְהָאֵר פָּנֶֽיךָ בָּֽנוּ וּזְכָר־לָֽנוּ אֶת־בְּרִית אֲבוֹתֵֽינוּ וְהושִׁיעֵֽנוּ לְמַֽעַן שְׁמֶֽךָ: רְאֵה בְצָרוֹתֵֽינוּ וּשְׁמַע קוֹל תְּפִלָּתֵֽנוּ כִּי אַתָּה שׁוֹמֵֽע תְּפִלַּת כָּל־פֶּה:
      אֵל רַחוּם וְחַנּוּן רַחֵם עָלֵֽינוּ וְעַל כָּל־מַעֲשֶֽׂיךָ כִּי אֵין כָּמֽוֹךָ יְהֺוָה אֱלֹהֵֽינוּ: אָנָּא שָׂא נָא פְשָׁעֵֽינוּ: אָבִֽינוּ מַלְכֵּֽנוּ צוּרֵֽנוּ וְגוֹאֲלֵֽנוּ אֵל חַי וְקַיָּם הַחֲסִין בַּכֹּֽחַ חָסִיד וָטוֹב עַל כָּל־מַעֲשֶֽׂיךָ כִּי אַתָּה הוּא יְהֺוָה אֱלֹהֵֽינוּ: אֵל אֶֽרֶךְ אַפַּֽיִם וּמָלֵא רַחֲמִים עֲשֵׂה עִמָּֽנוּ כְּרוֹב רַחֲמֶֽיךָ וְהוֹשִׁיעֵֽנוּ לְמַֽעַן שְׁמֶֽךָ: שְׁמַע מַלְכֵּֽנוּ תְּפִלָּתֵֽנוּ וּמִיַּד אוֹיְבֵֽינוּ הַצִּילֵֽנוּ: שְׁמַע מַלְכֵּֽנוּ תְּפִלָתֵֽנוּ וּמִכָּל־צָרָה וְיָגוֹן הַצִּילֵֽנוּ: אָבִֽינוּ מַלְכֵּֽנוּ אָֽתָּה וְשִׁמְךָ עָלֵֽינוּ נִקְרָא אַל־תַּנִּיחֵֽנוּ: אַל תַּעַזְבֵֽנוּ אָבִֽינוּ וְאַל־תִּטְּשֵֽׁנוּ בּוֹרְאֵֽנוּ וְאַל־תִּשְׁכָּחֵֽנוּ יוֹצְרֵֽנוּ כִּי אֵל מֶֽ‎לֶךְ חַנּוּן וְרַחוּם אָֽ‎תָּה:
      אֵין כָּמֽוֹךָ חַנּוּן וְרַחוּם יְהֹוָה אֱלֺהֵֽינוּ אֵין כָּמֽוֹךָ אֵל אֶֽרֶךְ אַפַּֽיִם וְרַב חֶֽסֶד וֶאֱמֶת: הוֹשִׁיעֵֽנוּ בְּרַחֲמֶֽיךָ הָרַבִּים מֵרַֽעַשׁ וּמֵרֺֽגֶז הַצִּילֵֽנוּ: זְכֺר לַעֲבָדֶֽיךָ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב אַל־תֵּֽפֶן אֶל־קָשְׁיֵֽנוּ וְאֶל־רִשְׁעֵֽנוּ וְאֶל־חַטָּאתֵֽנוּ: שׁוּב מֵחֲרוֹן אַפֶּֽךָ וְהִנָּחֵם עַל־הָרָעָה לְעַמֶּֽךָ וְהָסֵר מִמֶּֽנּוּ מַכַּת הַמָּֽוֶת כִּי רַחוּם אָֽתָּה כִּי כֵן דַּרְכֶּֽךָ עֹשֶׂה חֶֽסֶד חִנָּם בְּכָל־דּוֹר וָדוֹר: חֽוּסָה יְהֹוָה עַל־עַמֶּֽךָ וְהַצִּילֵֽנוּ מִזַּעְמֶֽךָ וְהָסֵר מִמֶּֽנּוּ מַכַּת הַמַּגֵּפָה וּגְזֵרָה קָשָׁה כִּי אַתָּה שׁוֹמֵר יִשְׂרָאֵל: לְךָ אֲדֹנָי הַצְּ֒דָקָה וְלָֽנוּ בּֽשֶׁת הַפָּנִים: מַה־נִּתְאוֹנֵן מַה־נֹּאמַר מַה־נְּדַבֵּר וּמַה־נִּצְטַּדָּק: נַחְפְּשָׂה דְרָכֵֽינוּ וְנַחְקֺֽרָה וְנָשֽׁוּבָה אֵלֶֽיךָ כִּי יְמִינְ֒ךָ פְשׁוּטָה לְקַבֵּל שָׁבִים: אָֽנָּא יְהֹוָה הוֹשִֽׁיעָה נָּא: אָֽנָּא יְהֹוָה הַצְלִיחָה נָא: אָֽנָּא יְהֹוָה עֲנֵֽנוּ בְיוֹם קָרְאֵֽנוּ: לְךָ יְהֹוָה חִכִּֽינוּ לְךָ יְהֹוָה קִוִּינוּ לְךָ יְהֹוָה נְיַחֵל: אַל תֶּחֱשֶׁה וּתְעַנֵּֽנוּ כִּי נָאֲמוּ גוֹיִם אָבְ֒דָה תִקְוָתָם: כָּל־בֶּֽרֶךְ וְכָל־קוֹמָה לְךָ לְבַד תִּשְׁתַּחֲוֶה:
      הַפּוֹתֵֽחַ יָד בִּתְ֒שׁוּבָה לְקַבֵּל פּוֹשְׁ֒עִים וְחַטָּאִים נִבְהֲלָה נַפְשֵֽׁנוּ מֵרוֹב עִצְּ֒בוֹנֵֽנוּ אַל־תִּשְׁכָּחֵֽנוּ נֶֽצַח: קֽוּמָה וְהוֹשִׁיעֵֽנוּ כִּי חָסִֽינוּ בָךְ: אָבִֽינוּ מַלְכֵּֽנוּ אִם אֵין בָּֽנוּ צְדָקָה וּמַעֲשִׂים טוֹבִים זְכָר־לָֽנוּ אֶת־בְּרִית אֲבוֹתֵֽינוּ וְעֵדוֹתֵֽינוּ בְּכָל־יוֹם יְהֹוָה אֶחָד: הַבִּֽיטָה בְעָנְיֵֽנוּ כִּי רַבּוּ מַכְאוֹבֵֽינוּ וְצָרוֹת לְבָבֵֽנוּ: חֽוּסָה יְהֹוָה עָלֵֽינוּ בְּאֶֽרֶץ שִׁבְיֵֽנוּ ואַל־תִּשְׁפּוֹךְ חֲרוֹנְ֒ךָ עָלֵֽינוּ כִּי אֲנַֽחְנוּ עַמְּ֒ךָ בְּנֵי בְרִיתֶֽךָ: אֵל הַבִּֽיטָה דַּל כְּבוֹדֵֽנוּ בַּגּוֹיִם וְשִׁקְּ֒צֽוּנוּ כְּטֻמְאַת הַנִּדָּה: עַד מָתַי עֻזְּ֒ךָ בַּשְּׁ֒בִי וְתִפְאַרְתְּ֒ךָ בְּיַד־צָר: עוֹרְ֒רָה גְבוּרָתְ֒ךָ וְקִנְאָתְךָ עַל־אֹיְבֶֽיךָ הֵם יֵבֽשׁוּ וְיֵחַֽתּוּ מִגְבוּרָתָם וְאַל־יִמְעֲטוּ לְפָנֶֽיךָ תְּלָאוֹתֵֽינוּ: מַהֵר יְקַדְּ֒מֽוּנוּ רַחֲמֶֽיךָ בְּיוֹם צָרָתֵֽינוּ וְאִם־לֺֹא לְמַעֲנֵֽנוּ לְמַעַנְךָ פְעַל וְאַל־תַּשְׁחִית זֵֽכֶר שְׁאֵרִיתֵֽנוּ: וְחוֹן אוֹם הַמְיַחֲדִים שִׁמְךָ פַּעֲמַֽיִם בְּכָל־יוֹם תָּמִיד בְּאַהֲבָה ואוֹמְ֒רִים: שְׁמַע יִשְׂרָאֵל יְהֹוָה אֱלֺהֵֽינוּ יְהֹוָה אֶחָד:
  - id: shacharis-nefilat-apayim
    title: Nefilat Apayim
    titleHe: נפילת אפיים
    text: |-
      וַיֹּֽאמֶר דָּוִד אֶל־גָּד צַר־לִי מְאֹד נִפְּ֒לָה־נָּא בְיַד־יְהֹוָה כִּי־רַבִּים רַחֲמָיו וּבְיַד־אָדָם אַל־אֶפֹּֽלָה:
      רַחוּם וְחַנּוּן חָטָֽאתִי לְפָנֶֽיךָ יְהֹוָה מָלֵא רַחֲמִים רַחֵם עָלַי וְקַבֵּל תַּחֲנוּנָי: יְהֹוָה אַל־בְּאַפְּ֒ךָ תוֹכִיחֵֽנִי וְאַל־בַּחֲמָתְ֒ךָ תְיַסְּ֒רֵֽנִי: חָנֵּֽנִי יְהֹוָה כִּי אֻמְלַל אָֽנִי רְפָאֵֽנִי יְהֹוָה כִּי נִבְהֲלוּ עֲצָמָי: וְנַפְשִׁי נִבְהֲלָה מְאֹד וְאַתָּה יְהֹוָה עַד־מָתָי: שׁוּבָה יְהֹוָה חַלְּ֒צָה נַפְשִׁי הוֹשִׁיעֵֽנִי לְמַֽעַן חַסְדֶּֽךָ: כִּי אֵין בַּמָּֽוֶת זִכְרֶךָ בִּשְׁ֒אוֹל מִי־יוֹדֶה לָּךְ: יָגַֽעְתִּי־בְּאַנְחָתִי אַשְׂחֶה בְכָל־לַֽיְלָה מִטָּתִי בְּדִמְעָתִי עַרְשִׂי אַמְסֶה: עָשְׁ֒שָׁה מִכַּֽעַס עֵינִי עָתְ֒קָה בְּכָל־צוֹרְ֒רָי: סֽוּרוּ מִמֶּֽנִּי כָּל־פֹּֽעֲלֵי אָוֶן כִּי־שָׁמַע יְהֹוָה קוֹל בִּכְיִי: שָׁמַע יְהֹוָה תְּחִנָּתִי יְהֹוָה תְּפִלָּתִי יִקָּח: יֵבֽשׁוּ וְיִבָּהֲלוּ מְאֹד כָּל־אֹיְ֒בָי יָשֻֽׁבוּ יֵבֽשׁוּ רָֽגַע:
  - id: shacharis-god-of-israel
    title: God of Israel
    titleHe: ה אל׳ ישראל
    text: |-
      יְהֹוָה אֱלֺהֵי יִשְׂרָאֵל שׁוּב מֵחֲרוֹן אַפֶּֽךָ וְהִנָּחֵם עַל־הָרָעָה לְעַמֶּֽךָ:
      הַבֵּט מִשָּׁמַֽיִם וּרְאֵה כִּי הָיִֽינוּ לַֽעַג וָקֶֽלֶס בַּגּוֹיִם: נֶחְשַֽׁבְנוּ כַּצֹּאן לָטֶֽבַח יוּבָל, לַהֲרוֹג וּלְאַבֵּד וּלְמַכָּה וּלְחֶרְפָּה: וּבְכָל־זֹאת שִׁמְךָ לֺא שָׁכָֽחְנוּ נָא אַל־תִּשְׁכָּחֵֽנוּ:
      יְהֹוָה אֱלֺהֵי יִשְׂרָאֵל שׁוּב מֵחֲרוֹן אַפֶּֽךָ וְהִנָּחֵם עַל־הָרָעָה לְעַמֶּֽךָ:
      זָרִים אוֹמְ֒רִים אֵין תּוֹחֶֽלֶת וְתִקְוָה: חוֹן אוֹם לְשִׁמְךָ מְקַוֶּה: טָהוֹר, יְשׁוּעָתֵֽנוּ קָרְ֒בָה, יָגַֽעְנוּ וְלֺא הֽוּנַח־לָֽנוּ: רַחֲמֶֽיךָ יִכְבְּ֒שׁוּ אֶת־כַּעַסְךָ מֵעָלֵֽינוּ: אָנָּא שׁוּב מֵחֲרוֹנְ֒ךָ וְרַחֵם סְגֻלָּה אֲשֶׁר בָּחָֽרְתָּ:
      יְהֹוָה אֱלֺהֵי יִשְׂרָאֵל שׁוּב מֵחֲרוֹן אַפֶּֽךָ וְהִנָּחֵם עַל־הָרָעָה לְעַמֶּֽךָ:
      חֽוּסָה יְהֹוָה עָלֵֽינוּ בְּרַחֲמֶֽיךָ, וְאַל תִּתְּ֒נֵֽנוּ בִּידֵי אַכְזָרִים: לָֽמָּה יֹאמְ֒רוּ הַגּוֹיִם אַיֵּה־נָא אֱלֺהֵיהֶם לְמַעַנְךָ עֲשֵׂה עִמָּֽנוּ חֶֽסֶד וְאַל תְּאַחַר: אָנָּא שׁוּב מֵחֲרוֹנְ֒ךָ וְרַחֵם סְגֻלָּה אֲשֶׁר בָּחָֽרְתָּ:
      יְהֹוָה אֱלֺהֵי יִשְׂרָאֵל שׁוּב מֵחֲרוֹן אַפֶּֽךָ וְהִנָּחֵם עַל־הָרָעָה לְעַמֶּֽךָ:
      קוֹלֵֽנוּ תִשְׁמַע וְתָחוֹן וְאַל־תִּטְּ֒שֵֽׁנוּ בְּיַד אֹיְ֒בֵֽינוּ לִמְחוֹת אֶת־שְׁמֵֽנוּ: זְכוֹר אֲשֶׁר נִשְׁבַּֽעְתָּ לַאֲבוֹתֵֽינוּ, כְּכוֹכְ֒בֵי הַשָּׁמַֽיִם אַרְבֶּה אֶת־זַרְעֲכֶם וְעַתָּה נִשְׁאַֽרְנוּ מְעַט מֵהַרְבֵּה: וּבְכָל־זֹאת שִׁמְךָ לֺא שָׁכָֽחְנוּ נָא אַל תִּשְׁכָּחֵֽנוּ:
      יְהֹוָה אֱלֺהֵי יִשְׂרָאֵל שׁוּב מֵחֲרוֹן אַפֶּֽךָ וְהִנָּחֵם עַל־הָרָעָה לְעַמֶּֽךָ:
      עָזְ֒רֵֽנוּ אֱלֺהֵי יִשְׁעֵֽנוּ עַל־דְּבַר כְּבוֹד־שְׁמֶֽךָ וְהַצִּילֵֽנוּ וְכַפֵּר עַל־חַטֹּאתֵֽינוּ לְמַֽעַן שְׁמֶֽךָ:
      יְהֹוָה אֱלֺהֵי יִשְׂרָאֵל שׁוּב מֵחֲרוֹן אַפֶּֽךָ וְהִנָּחֵם עַל־הָרָעָה לְעַמֶּֽךָ:
  - id: shacharis-shomer-yisrael
    title: Shomer Yisrael
    titleHe: שומר ישראל
    text: |-
      שׁוֹמֵר יִשְׂרָאֵל שְׁמוֹר שְׁאֵרִית יִשְׂרָאֵל וְאַל יֹאבַד יִשְׂרָאֵל הָאֹמְ֒רִים שְׁמַע יִשְׂרָאֵל:
      שׁוֹמֵר גּוֹי אֶחָד שְׁמוֹר שְׁאֵרִית עַם אֶחָד וְאַל יֹאבַד גּוֹי אֶחָד הַמְיַחֲדִים שִׁמְךָ יְהֹוָה אֱלֺהֵֽינוּ יְהֹוָה אֶחָד:
      שׁוֹמֵר גּוֹי קָדוֹשׁ שְׁמוֹר שְׁאֵרִית עַם קָדוֹשׁ וְאַל יֹאבַד גּוֹי קָדוֹשׁ הַמְשַׁלְּ֒שִׁים בְּשָׁלשׁ קְדֻשּׁוֹת לְקָדוֹשׁ:
      מִתְרַצֶּה בְּרַחֲמִים וּמִתְפַּיֵּס בְּתַחֲנוּנִים הִתְרַצֶּה וְהִתְפַּיֵּס לְדוֹר עָנִי כִּי אֵין עוֹזֵר: אָבִֽינוּ מַלְכֵּֽנוּ חָנֵּֽנוּ וַעֲנֵֽנוּ כִּי אֵין בָּֽנוּ מַעֲשִׂים עֲשֵׂה עִמָּֽנוּ צְדָקָה וָחֶֽסֶד וְהוֹשִׁיעֵֽנוּ:
      וַאֲנַֽחְנוּ לֺא נֵדַע מַה נַּעֲשֶׂה כִּי עָלֶֽיךָ עֵינֵֽינוּ: זְכֹר רַחֲמֶֽיךָ יְהֹוָה וַחֲסָדֶֽיךָ כִּי מֵעוֹלָם הֵֽמָּה: יְהִי חַסְדְּךָ יְהֹוָה עָלֵֽינוּ כַּאֲשֶׁר יִחַֽלְנוּ לָךְ: אַל תִּזְכָּר לָֽנוּ עֲוֹנוֹת רִאשׁוֹנִים מַהֵר יְקַדְּמֽוּנוּ רַחֲמֶֽיךָ כִּי דַלּֽוֹנוּ מְאֹד: חָנֵּֽנוּ יְהֹוָה חָנֵּֽנוּ כִּי־רַב שָׂבַֽעְנוּ בוּז: בְּרֺֽגֶז רַחֵם תִּזְכּוֹר: כִּי הוּא יָדַע יִצְרֵֽנוּ זָכוּר כִּי עָפָר אֲנָֽחְנוּ: עָזְרֵֽנוּ אֱלֺהֵי יִשְׁעֵֽנוּ עַל־דְּבַר כְּבוֹד־שְׁמֶֽךָ וְהַצִּילֵֽנוּ וְכַפֵּר עַל־חַטֹּאתֵֽינוּ לְמַֽעַן שְׁמֶֽךָ:
  - id: shacharis-half-kaddish
    title: Half Kaddish
    titleHe: חצי קדיש
    instruction: 'ש"ץ אומר חצי קדיש:'
    text: |-
      יִתְגַּדַּל וְיִתְקַדַּשׁ שְׁמֵהּ רַבָּא (אָמֵן)
      בְּעָלְ֒מָֽא דִּי־בְרָא כִרְעוּתֵהּ וְיַמְלִיךְ מַלְכוּתֵהּ בְּחַיֵּיכוֹן וּבְיוֹמֵיכוֹן וּבְחַיֵּי דְכָל־בֵּית יִשְׂרָאֵל בַּעֲגָלָא וּבִזְמַן קָרִיב וְאִמְרוּ אָמֵן:
      יְהֵא שְׁמֵהּ רַבָּא מְבָרַךְ לְעָלַם וּלְעָלְ֒מֵי עָלְ֒מַיָּא
      יִתְבָּרַךְ וְיִשְׁתַּבַּח וְיִתְפָּאַר וְיִתְרוֹמַם וְיִתְנַשֵּׂא וְיִתְהַדָּר וְיִתְעַלֶּה וְיִתְהַלָּל שְׁמֵהּ דְקוּדְשָׁא בְּרִיךְ הוּא
      לְעֵֽלָּא מִן־כָּל־ (בעשי"ת לְעֵֽלָּא לְעֵֽלָּא מִכָּל) בִּרְכָתָֽא וְשִׁירָתָֽא תֻּשְׁבְּ֒חָתָֽא וְנֶחָמָתָֽא דַּאֲמִירָן בְּעָלְ֒מָֽא וְאִמְרוּ אָמֵן:
      אשרי ובא לציון. כשמכריזים דבר יש להכריז קודם שיתחיל החזן אשרי (מגן אברהם סי' קלב)
