id: shacharis-post-service
name: Post Service
nameHe: תפילות נוספות
category: shacharis
timeContext: shacharis
sections:
  - id: shacharis-six-remembrances
    title: Six Remembrances
    titleHe: שש זכירות
    instruction: זכירת יציאת מצרים
    text: |-
      לְמַֽעַן תִּזְכֹּר אֶת יוֹם צֵאתְ֒ךָ מֵאֶֽרֶץ מִצְרַֽיִם כֹּל יְמֵי חַיֶּֽיךָ:
      זכירת מעמד הר סיני
      רַק הִשָּֽׁמֶר לְךָ וּשְׁמֹר נַפְשְׁ֒ךָ מְאֹד פֶּן תִּשְׁכַּח אֶת הַדְּ֒בָרִים אֲשֶׁר רָאוּ עֵינֶֽיךָ וּפֶן יָסֽוּרוּ מִלְּ֒בָבְ֒ךָ כֹּל יְמֵי חַיֶּֽיךָ, וְהוֹדַעְתָּם לְבָנֶֽיךָ וְלִבְנֵי בָנֶֽיךָ: יוֹם אֲשֶׁר עָמַֽדְתָּ לִפְנֵי יְהֹוָה אֱלֺהֶֽיךָ בְּחֹרֵב:
      זכירת מחיית עמלק
      זָכוֹר אֵת אֲשֶׁר עָשָׂה לְךָ עֲמָלֵק, בַּדֶּֽרֶךְ בְּצֵאתְ֒כֶם מִמִּצְרָֽיִם: אֲשֶׁר קָרְ֒ךָ בַּדֶּֽרֶךְ וַיְזַנֵּב בְּךָ כָּל הַנֶּחֱשָׁלִים אַחֲרֶֽיךָ, וְאַתָּה עָיֵף וְיָגֵֽעַ, וְלֺא יָרֵא אֱלֺהִים: וְהָיָה בְּהָנִֽיחַ יְהֹוָה אֱלֺהֶֽיךָ לְךָ, מִכָּל אֹיְ֒בֶֽיךָ מִסָּבִיב, בָּאָֽרֶץ אֲשֶׁר יְהֹוָה אֱלֺהֶֽיךָ נֹתֵן לְךָ נַחֲלָה לְרִשְׁתָּהּ, תִּמְחֶה אֶת זֵֽכֶר עֲמָלֵק מִתַּחַת הַשָּׁמָֽיִם, לֺא תִּשְׁכָּח:
      זכירת מעשה העגל
      זְכֹר אַל תִּשְׁכַּח אֵת אֲשֶׁר הִקְצַֽפְתָּ אֶת יְהֹוָה אֱלֺהֶֽיךָ בַּמִּדְבָּר:
      זכירת מעשה מרים
      זָכוֹר אֵת אֲשֶׁר עָשָׂה יְהֹוָה אֱלֺהֶֽיךָ לְמִרְיָם, בַּדֶּֽרֶךְ בְּצֵאתְ֒כֶם מִמִּצְרָֽיִם:
      זכירת השבת
      זָכוֹר אֶת יוֹם הַשַּׁבָּת לְקַדְּ֒שׁוֹ:
  - id: shacharis-ten-commandments
    title: Ten Commandments
    titleHe: עשרת הדברות
    text: |-
      אָנֹכִי יְהוָה אֱלֹהֶיךָ אֲשֶׁר הוֹצֵאתִיךָ מֵאֶרֶץ מִצְרַיִם מִבֵּית עֲבָדִים׃
      לֹא יִהְיֶה־לְךָ אֱלֹהִים אֲחֵרִים עַל־פָּנָי לֹא תַעֲשֶׂה־לְךָ פֶסֶל וְכָל־תְּמוּנָה אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל וַאֲשֶׁר בָּאָרֶץ מִתַָּחַת וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ לֹא־תִשְׁתַּחְוֶה לָהֶם וְלֹא תָעָבְדֵם כִּי אָנֹכִי יְהוָה אֱלֹהֶיךָ אֵל קַנָּא פֹּקֵד עֲוֺן אָבֹת עַל־בָּנִים עַל־שִׁלֵּשִׁים וְעַל־רִבֵּעִים לְשֹׂנְאָי׃ וְעֹשֶׂה חֶסֶד לַאֲלָפִים לְאֹהֲבַי וּלְשֹׁמְרֵי מִצְוֺתָי׃
      לֹא תִשָּׂא אֶת־שֵׁם־יְהוָה אֱלֹהֶיךָ לַשָּׁוְא כִּי לֹא יְנַקֶּה יְהוָה אֵת אֲשֶׁר־יִשָּׂא אֶת־שְׁמוֹ לַשָּׁוְא׃
      זָכוֹר אֶת־יוֹם הַשַּׁבָּת לְקַדְּשׁוֹ שֵׁשֶׁת יָמִים תַּעֲבֹד וְעָשִׂיתָ כָּל־מְלַאכְתֶּךָ וְיוֹם הַשְּׁבִיעִי שַׁבָּת לַיהוָה אֱלֹהֶיךָ לֹא־תַעֲשֶׂה כָל־מְלָאכָה אַתָּה וּבִנְךָ־וּבִתֶּךָ עַבְדְּךָ וַאֲמָתְךָ וּבְהֶמְתֶּךָ וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ כִּי שֵׁשֶׁת־יָמִים עָשָׂה יְהוָה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ אֶת־הַיָּם וְאֶת־כָּל־אֲשֶׁר־בָּם וַיָּנַח בַּיּוֹם הַשְּׁבִיעִי עַל־כֵּן בֵּרַךְ יְהוָה אֶת־יוֹם הַשַּׁבָּת וַיְקַדְּשֵׁהוּ׃
      כַּבֵּד אֶת־אָבִיךָ וְאֶת־אִמֶּךָ לְמַעַן יַאֲרִכוּן יָמֶיךָ עַל הָאֲדָמָה אֲשֶׁר־יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ׃
      לֹא תִּרְצָח׃
      לֹא תִּנְאָף׃
      לֹא תִּגְנֹב׃
      לֹא־תַעֲנֶה בְרֵעֲךָ עֵד שָׁקֶר׃
      לֹא תַחְמֹד בֵּית רֵעֶךָ לֹא־תַחְמֹד אֵשֶׁת רֵעֶךָ וְעַבְדּוֹ וַאֲמָתוֹ וְשׁוֹרוֹ וַחֲמֹרוֹ וְכֹל אֲשֶׁר לְרֵעֶךָ׃
  - id: shacharis-thirteen-principles
    title: Thirteen Principles
    titleHe: י"ג עיקרי אמונה
    text: |-
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁהַבּוֹרֵא יִתְבָּרַךְ שְׁמוֹ הוּא בוֹרֵא וּמַנְהִיג לְכָל הַבְּ֒רוּאִים וְהוּא לְבַדּוֹ עָשָׂה וְעוֹשֶׂה וְיַעֲשֶׂה לְכָל הַמַּעֲשִׂים:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁהַבּוֹרֵא יִתְבָּרַךְ שְׁמוֹ הוּא יָחִיד וְאֵין יְחִידוּת כָּמֽוֹהוּ בְּשׁוּם פָּנִים וְהוּא לְבַדּוֹ אֱלֺהֵֽינוּ הָיָה הֹוֶה וְיִהְיֶה:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁהַבּוֹרֵא יִתְבָּרַךְ שְׁמוֹ אֵינוֹ גוּף וְלֺא יַשִּׂיגֽוּהוּ מַשִּׂיגֵי הַגּוּף וְאֵין לוֹ שׁוּם דִּמְיוֹן כְּלָל:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁהַבּוֹרֵא יִתְבָּרַךְ שְׁמוֹ הוּא רִאשׁוֹן וְהוּא אַחֲרוֹן:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁהַבּוֹרֵא יִתְבָּרַךְ שְׁמוֹ לוֹ לְבַדּוֹ רָאוּי לְהִתְפַּלֵּל וְאֵין רָאוּי לְהִתְפַּלֵּל לְזוּלָתוֹ:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁכָּל דִּבְ֒רֵי נְבִיאִים אֱמֶת:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁנְּ֒בוּאַת משֶׁה רַבֵּֽנוּ עָלָיו הַשָּׁלוֹם הָיְ֒תָה אֲמִתִּית וְשֶׁהוּא הָיָה אָב לַנְּ֒בִיאִים לַקּוֹדְ֒מִים לְפָנָיו וְלַבָּאִים אַחֲרָיו:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁכָּל הַתּוֹרָה הַמְּ֒צוּיָה עַתָּה בְיָדֵֽינוּ הִיא הַנְּ֒תוּנָה לְמשֶׁה רַבֵּֽנוּ עָלָיו הַשָּׁלוֹם:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁזֹּאת הַתּוֹרָה לֺא תְהֵא מֻחְלֶֽפֶת וְלֺא תְהֵא תוֹרָה אַחֶֽרֶת מֵאֵת הַבּוֹרֵא יִתְבָּרַךְ שְׁמוֹ:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁהַבּוֹרֵא יִתְבָּרַךְ שְׁמוֹ יוֹדֵֽעַ כָּל מַעֲשֵׂה בְנֵי אָדָם וְכָל מַחְשְׁ֒בוֹתָם שֶׁנֶּאֱמַר הַיֹּצֵר יַֽחַד לִבָּם הַמֵּבִין אֶל כָּל מַעֲשֵׂיהֶם:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁהַבּוֹרֵא יִתְבָּרַךְ שְׁמוֹ גּוֹמֵל טוֹב לְשׁוֹמְ֒רֵי מִצְוֹתָיו וּמַעֲנִישׁ לְעוֹבְ֒רֵי מִצְוֹתָיו:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה בְּבִיאַת הַמָּשִֽׁיחַ וְאַף עַל פִּי שֶׁיִּתְמַהְמֵֽהַּ עִם כָּל זֶה אֲחַכֶּה לּוֹ בְּכָל יוֹם שֶׁיָּבוֹא:
      אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁתִּהְיֶה תְּחִיַּת הַמֵּתִים בְּעֵת שֶׁיַּעֲלֶה רָצוֹן מֵאֵת הַבּוֹרֵא יִתְבָּרַךְ שְׁמוֹ וְיִתְעַלֶּה זִכְרוֹ לָעַד וּלְנֵֽצַח נְצָחִים:
