category: blessings
timeContext: anytime
sections:
  - id: blessings-netilat-yadayim
    title: Netilat Yadayim
    titleHe: נטילת ידים
    instruction: "לפני אכילת לחם נוטל את ידיו ואומר:"
    text: "בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו, וְצִוָּנוּ עַל נְטִילַת יָדָים:"
  - id: blessings-hamotzi
    title: HaMotzi
    titleHe: המוציא
    instruction: "על הלחם מברך:"
    text: "בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם הַמּוֹצִיא לֶחֶם מִן הָאָרֶץ:"
  - id: blessings-mezonot
    title: Mezonot
    titleHe: מזונות
    instruction: "על תבשיל מחמשת מיני דגן ועל מיני מאפה מברך:"
    text: "בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם בּוֹרֵא מִינֵי מְזוֹנוֹת:"
  - id: blessings-hagafen
    title: HaGafen
    titleHe: הגפן
    instruction: "על היין מברך:"
    text: "בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם בּוֹרֵא פְּרִי הַגָּפֶן:"
  - id: blessings-haetz
    title: HaEtz
    titleHe: העץ
    instruction: "על כל פרי העץ מברך:"
    text: "בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם בּוֹרֵא פְּרִי הָעֵץ:"
  - id: blessings-haadamah
    title: HaAdamah
    titleHe: האדמה
    instruction: "על פרי האדמה מברך:"
    text: "בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם בּוֹרֵא פְּרִי הָאֲדָמָה:"
  - id: blessings-shehakol
    title: SheHakol
    titleHe: שהכל
    instruction: "על בשר ודגים. חלב וביצה וגבינה. כמהין ופטריות וכדומה. גם על המשקים חוץ מיין אומר:"
    text: "בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם שֶׁהַכֹּל נִהְיָה בִּדְבָרוֹ:"
  - id: blessings-al-hamichyah
    title: Al Hamichyah
    titleHe: על המחיה
    text: |-
      בָּרוּךְ אַתָּה יְיָ, אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם,
      על חמשת מיני דגן—עַל הַמִּחְיָה וְעַל הַכַּלְכָּלָה
      על היין—עַל הַגֶּפֶן וְעַל פְּרִי הַגֶּפֶן
      על פירות משבעת המינים—עַל הָעֵץ וְעַל פְּרִי הָעֵץ
      וְעַל תְּנוּבַת הַשָּׂדֶה וְעַל אֶרֶץ חֶמְדָּה טוֹבָה וּרְחָבָה שֶׁרָצִיתָ וְהִנְחַלְתָּ לַאֲבוֹתֵינוּ לֶאֱכוֹל מִפִּרְיָהּ וְלִשְׂבּוֹעַ מִטּוּבָהּ. רַחֵם (נָא) יְיָ אֱלֹהֵינוּ עַל יִשְׂרָאֵל עַמֶּךָ וְעַל יְרוּשָׁלַיִם עִירֶךָ וְעַל צִיּוֹן מִשְׁכַּן כְּבוֹדֶךָ, וְעַל מִזְבְּחֶךָ, וְעַל הֵיכָלֶךָ. וּבְנֵה יְרוּשָׁלַיִם עִיר הַקּדֶשׁ בִּמְהֵרָה בְיָמֵינוּ. וְהַעֲלֵנוּ לְתוֹכָהּ וְשַׂמְּחֵנוּ בְּבִנְיָנָהּ, וְנֹאכַל מִפִּרְיָּהּ וְנִשְׂבַּע מִטּוּבָהּ וּנְבָרֶכְךָ עָלֶיהָ בִּקְדֻשָּׁה וּבְטָהֳרָה.
      בשבת: וּרְצֵה וְהַחֲלִיצֵנוּ בְּיוֹם הַשַׁבָּת הַזֶּה.
      בר"ח: וְזָכְרֵנוּ לְטוֹבָה בְּיוֹם רֹאשׁ הַחֹדֶשׁ הַזֶּה.
      בר"ה: וְזָכְרֵנוּ לְטוֹבָה בְּיוֹם הַזִּכָּרוֹן הַזֶּה.
      ביום טוב ובחוה"מ: וְשַׂמְּחֵנוּ בְיוֹם
      בפסח: חַג הַמַּצּוֹת הַזֶּה,
      בשבועות: חַג הַשָּׁבוּעוֹת הַזֶּה,
      בסוכות: חַג הַסֻּכּוֹת הַזֶּה,
      בשמיני עצרת: שְׁמִינִי, חַג עֲצֶרֶת הַזֶּה,
      בְּיוֹם (טוֹב) מִקְרָא קֹדֶשׁ הַזֶּה.
      כִּי אַתָּה יְיָ טוֹב וּמֵטִיב לַכּל וְנוֹדֶה לְּךָ עַל הָאָרֶץ
      על חמשת מיני דגן—וְעַל הַמִּחְיָה
      על היין—וְעַל פְּרִי גַפְנָהּ (בחו"ל—וְעַל פְּרִי הַגָּֽפֶן)
      על פירות משבעת המינים—וְעַל פֵּרוֹתֶיהָ (בחו"ל—וְעַל הַפֵּרוֹת)
      בָּרוּךְ אַתָּה יְיָ, עַל הָאָרֶץ
      על חמשת מיני דגן—וְעַל הַמִּחְיָה (וי"א גם וְעַל הַכַּלְכָּלָה).
      על היין—וְעַל פְּרִי גַפְנָהּ (בחו"ל—וְעַל פְּרִי הַגָּֽפֶן).
      על פירות משבעת המינים—וְעַל פֵּרוֹתֶיהָ (בחו"ל—וְעַל הַפֵּרוֹת).
  - id: blessings-borei-nefashot
    title: Borei Nefashot
    titleHe: בורא נפשות
    instruction: "על פירות האילן חוץ מז' מינים ופירות האדמה וירקות ועל כל המשקין ועל דבר שאין גידולו מן הארץ אחרי האכילה אומר:"
    text: "בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם בּוֹרֵא נְפָשׁוֹת רַבּוֹת וְחֶסְרוֹנָן עַל כָּל מַה שֶׁבָּרָאתָּ לְהַחֲיוֹת בָּהֶם נֶפֶשׁ כָּל חָי בָּרוּךְ חֵי חַי הָעוֹלָמִים:"
