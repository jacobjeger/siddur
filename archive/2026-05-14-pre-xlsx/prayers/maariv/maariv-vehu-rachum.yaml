name: Vehu Rachum
nameHe: מעריב
category: maariv
timeContext: maariv
sections:
  - id: maariv-vehu-rachum
    title: Vehu Rachum
    titleHe: והוא רחום
    instruction: כשיגיע הלילה יתפלל תפלת ערבית. ואינה חובה שלא נתקנה אלא כנגד איברים ופדרים של תמיד של בין הערבים שלא נתעכלו ביום שקרבין והולכין כל הלילה. ומ"מ מצוה איכא ואין לבטלה. ורב אלפס כתב דהאידנא קבעוה חובה ואין לבטלה כלל (טור או"ח רל"ה)
    text: "וְהוּא רַחוּם יְכַפֵּר עָוֹן וְלֹא־יַשְׁחִית וְהִרְבָּה לְהָשִׁיב אַפּוֹ וְלֹא־יָעִיר כָּל־חֲמָתוֹ: יְהֹוָה הוֹשִׁיעָה הַמֶּֽלֶךְ יַעֲנֵֽנוּ בְיוֹם־קָרְאֵֽנוּ:"
