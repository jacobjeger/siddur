id: lifecycle-to-mourners
name: To Mourners
nameHe: לאבלים
category: lifecycle
timeContext: anytime
sections:
  - id: lifecycle-to-mourners-nichum
    title: Comforting Mourners
    titleHe: ניחום אבלים
    instruction: "כשמנחמים את האבל אומרים:"
    text: "הַמָּקוֹם יְנַחֵם אֶתְכֶם בְּתוֹךְ שְׁאָר אֲבֵלֵי צִיּוֹן וִירוּשָׁלָיִם:"
  - id: lifecycle-to-mourners-tzidduk-hadin
    title: Tzidduk HaDin
    titleHe: צידוק הדין
    instruction: "אומרים בשעת הלוויה:"
    text: |-
      הַצּוּר תָּמִים פָּעֳלוֹ, כִּי כָל דְּרָכָיו מִשְׁפָּט, אֵל אֱמוּנָה וְאֵין עָוֶל, צַדִּיק וְיָשָׁר הוּא:
      הַצּוּר תָּמִים בְּכָל פֹּעַל, מִי יֹאמַר לוֹ מַה תִּפְעַל. הַמּוֹשֵׁל בַּתַּחְתּוֹנִים וּבָעֶלְיוֹנִים, מֵמִית וּמְחַיֶּה, מוֹרִיד שְׁאוֹל וַיָּעַל:
      הַצּוּר תָּמִים בְּכָל מַעֲשֶׂה, מִי יֹאמַר לוֹ מַה תַּעֲשֶׂה. הָאוֹמֵר וְעוֹשֶׂה, חָנֵּנוּ, עֲשֵׂה עִמָּנוּ חֶסֶד, וּבִזְכוּת הַנֶּאֱקָד כַּשֶׂה, שְׁמַע וַעֲשֵׂה:
      צַדִּיק בְּכָל דְּרָכָיו, הַצּוּר תָּמִים, אֶרֶךְ אַפַּיִם וּמָלֵא רַחֲמִים, נָא חוּס וְרַחֵם עַל אָבוֹת וּבָנִים, כִּי לְךָ אֲדֹנָי הַסְּלִיחָה וְהָרַחֲמִים:
      צַדִּיק אַתָּה יְיָ לְהָמִית וּלְהַחֲיוֹת, אֲשֶׁר בְּיָדְךָ פִּקְדוֹן כָּל רוּחוֹת, חָלִילָה לְךָ לִמְחוֹת זִכְרוֹנֵנוּ, יַבִּיטוּ עֵינֶיךָ עָלֵינוּ בְּרַחֲמִים, כִּי לְךָ אֲדֹנָי הַסְּלִיחָה וְהָרַחֲמִים:
      אִם יִחְיֶה אָדָם שָׁנָה אוֹ אֶלֶף שָׁנִים, מַה יִּתְרוֹן לוֹ, כְּלֹא הָיָה יִהְיֶה. בָּרוּךְ דַּיַּן הָאֱמֶת, שֶׁהוּא מֵמִית וּמְחַיֶּה:
      בָּרוּךְ הוּא כִּי אֱמֶת דִּינוֹ, וְצוֹפֶה הַכֹּל, וְשׁוֹלֵם לָאָדָם כְּחֶשְׁבּוֹנוֹ וּמִשְׁפָּטוֹ, וְהַכֹּל יוֹדוּ לִשְׁמוֹ:
      נוֹדַע כִּי יְיָ הוּא הָאֱלֹהִים, הוּא עָשָׂנוּ וְלוֹ אֲנַחְנוּ, עַמּוֹ וְצֹאן מַרְעִיתוֹ:
      יְיָ נָתַן וַייָ לָקָח, יְהִי שֵׁם יְיָ מְבֹרָךְ:
      וְהוּא רַחוּם יְכַפֵּר עָוֹן וְלֹא יַשְׁחִית, וְהִרְבָּה לְהָשִׁיב אַפּוֹ, וְלֹא יָעִיר כָּל חֲמָתוֹ:
