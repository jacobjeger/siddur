id: other-tikun-chatzos
name: Tikun Chatzos
nameHe: תיקון חצות
category: other
timeContext: anytime
sections:
  - id: other-tikun-chatzos-rachel
    title: Tikun Rachel
    titleHe: תיקון רחל
    instruction: תיקון רחל — אין אומרים בשבת, יום טוב, ראש חודש, ערב ראש חודש אחר חצות היום, חול המועד, ט"ו באב, ט"ו בשבט, פורים, פורים קטן, חנוכה, ל"ג בעומר, ערב יום טוב אחר חצות, ערב שבת, ימי ניסן.
    text: |-
      עַל נַהֲרוֹת בָּבֶל שָׁם יָשַֽׁבְנוּ גַּם בָּכִינוּ בְּזָכְרֵנוּ אֶת צִיּוֹן: עַל עֲרָבִים בְּתוֹכָהּ תָּלִינוּ כִּנֹּרוֹתֵינוּ: כִּי שָׁם שְׁאֵלוּנוּ שׁוֹבֵינוּ דִּבְרֵי שִׁיר וְתוֹלָלֵינוּ שִׂמְחָה שִׁירוּ לָנוּ מִשִּׁיר צִיּוֹן: אֵיךְ נָשִׁיר אֶת שִׁיר יְהוָה עַל אַדְמַת נֵכָר: אִם אֶשְׁכָּחֵךְ יְרוּשָׁלָֽיִם תִּשְׁכַּח יְמִינִי: תִּדְבַּק לְשׁוֹנִי | לְחִכִּי אִם לֹא אֶזְכְּרֵכִי אִם לֹא אַעֲלֶה אֶת יְרוּשָׁלַֽיִם עַל רֹאשׁ שִׂמְחָתִי: זְכֹר יְהוָה | לִבְנֵי אֱדוֹם אֵת יוֹם יְרוּשָׁלָֽיִם הָאֹמְרִים עָרוּ | עָרוּ עַד הַיְסוֹד בָּהּ: בַּת בָּבֶל הַשְּׁדוּדָה אַשְׁרֵי שֶׁיְשַׁלֶּם לָךְ אֶת גְּמוּלֵךְ שֶׁגָּמַלְתְּ לָנוּ: אַשְׁרֵי | שֶׁיֹּאחֵז וְנִפֵּץ אֶת עֹלָלַֽיִךְ אֶל הַסָּלַע:
      שִׁיר הַמַּעֲלוֹת מִמַּעֲמַקִּים קְרָאתִיךָ יְהוָה: אֲדֹנָי שִׁמְעָה בְקוֹלִי תִּהְיֶינָה אָזְנֶיךָ קַשֻּׁבוֹת לְקוֹל תַּחֲנוּנָי: אִם עֲוֹנוֹת תִּשְׁמָר יָהּ אֲדֹנָי מִי יַעֲמֹד: כִּי עִמְּךָ הַסְּלִיחָה לְמַעַן תִּוָּרֵא: קִוִּיתִי יְהוָה קִוְּתָה נַפְשִׁי וְלִדְבָרוֹ הוֹחָלְתִּי: נַפְשִׁי לַאדֹנָי מִשֹּׁמְרִים לַבֹּקֶר שֹׁמְרִים לַבֹּקֶר: יַחֵל יִשְׂרָאֵל אֶל יְהוָה כִּי עִם יְהוָה הַחֶסֶד וְהַרְבֵּה עִמּוֹ פְדוּת: וְהוּא יִפְדֶּה אֶת יִשְׂרָאֵל מִכֹּל עֲוֹנוֹתָיו:
      אֵיכָה יָשְׁבָה בָדָד הָעִיר רַבָּתִי עָם, הָיְתָה כְּאַלְמָנָה, רַבָּתִי בַגּוֹיִם, שָׂרָתִי בַּמְּדִינוֹת, הָיְתָה לָמַס:
      בָּכוֹ תִבְכֶּה בַּלַּיְלָה וְדִמְעָתָהּ עַל לֶחֱיָהּ, אֵין לָהּ מְנַחֵם מִכָּל אֹהֲבֶיהָ, כָּל רֵעֶיהָ בָּגְדוּ בָהּ הָיוּ לָהּ לְאוֹיְבִים:
  - id: other-tikun-chatzos-leah
    title: Tikun Leah
    titleHe: תיקון לאה
    instruction: תיקון לאה — אומרים אחרי תיקון רחל, ובימים שאין אומרים תיקון רחל אומרים תיקון לאה בלבד.
    text: |-
      אֶשָּׂא עֵינַי אֶל הֶהָרִים מֵאַיִן יָבֹא עֶזְרִי: עֶזְרִי מֵעִם יְהוָה עֹשֵׂה שָׁמַיִם וָאָרֶץ: אַל יִתֵּן לַמּוֹט רַגְלֶךָ אַל יָנוּם שֹׁמְרֶךָ: הִנֵּה לֹא יָנוּם וְלֹא יִישָׁן שׁוֹמֵר יִשְׂרָאֵל: יְהוָה שֹׁמְרֶךָ יְהוָה צִלְּךָ עַל יַד יְמִינֶךָ: יוֹמָם הַשֶּׁמֶשׁ לֹא יַכֶּכָּה וְיָרֵחַ בַּלָּיְלָה: יְהוָה יִשְׁמָרְךָ מִכָּל רָע יִשְׁמֹר אֶת נַפְשֶׁךָ: יְהוָה יִשְׁמָר צֵאתְךָ וּבוֹאֶךָ מֵעַתָּה וְעַד עוֹלָם:
      הַלְלוּיָהּ | הַלְלוּ אֵל בְּקָדְשׁוֹ הַלְלוּהוּ בִּרְקִיעַ עֻזּוֹ: הַלְלוּהוּ בִגְבוּרֹתָיו הַלְלוּהוּ כְּרֹב גֻּדְלוֹ: הַלְלוּהוּ בְּתֵקַע שׁוֹפָר הַלְלוּהוּ בְּנֵבֶל וְכִנּוֹר: הַלְלוּהוּ בְתֹף וּמָחוֹל הַלְלוּהוּ בְּמִנִּים וְעוּגָב: הַלְלוּהוּ בְצִלְצְלֵי שָׁמַע הַלְלוּהוּ | בְּצִלְצְלֵי תְרוּעָה: כֹּל הַנְּשָׁמָה תְּהַלֵּל יָהּ הַלְלוּיָהּ:
      יְהִי רָצוֹן מִלְּפָנֶיךָ יְיָ אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ, שֶׁתְּרַחֵם עַל עַמְּךָ יִשְׂרָאֵל בְּכָל מָקוֹם שֶׁהֵם, וְתוֹצִיאֵם מִגָּלוּת לִגְאֻלָּה, מֵאֲפֵלָה לְאוֹרָה, וְתִבְנֶה בֵּית מִקְדָּשֵׁנוּ בִּמְהֵרָה בְיָמֵינוּ, אָמֵן:
