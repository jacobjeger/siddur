sections:
  - id: other-separating-trumos-text
    title: Separating Trumos & Ma'asros
    titleHe: הפרשת תרומות ומעשרות
    instruction: "נוהג בארץ ישראל. מפריש מעט יותר מאחד ממאה מן הפירות ואומר:"
    text: |-
      מַה שֶׁיֵּשׁ כָּאן יוֹתֵר מֵאֶחָד מִמֵּאָה בִּצְפוֹנוֹ — הֲרֵי הוּא תְּרוּמָה גְּדוֹלָה.
      אוֹתוֹ אֶחָד מִמֵּאָה שֶׁיֵּשׁ כָּאן, עִם עוֹד תִּשְׁעָה חֲלָקִים כְּמוֹתוֹ בִּצְפוֹן הַפֵּרוֹת — הֲרֵי הוּא מַעֲשֵׂר רִאשׁוֹן.
      אוֹתוֹ אֶחָד מִמֵּאָה שֶׁעָשִׂיתִיו מַעֲשֵׂר רִאשׁוֹן — עָשׂוּי תְּרוּמַת מַעֲשֵׂר.

      בשנה א' ב' ד' ה' לשמיטה:
      מַעֲשֵׂר שֵׁנִי יְהֵא בִּדְרוֹמוֹ שֶׁל הַפֵּרוֹת, וּמְחֻלָּל הוּא וְאֶחָד מֵרֶבַע עַל הַמַּטְבֵּעַ שֶׁיִּחַדְתִּי לְחִלּוּל מַעֲשֵׂר שֵׁנִי.

      בשנה ג' ו' לשמיטה:
      מַעֲשֵׂר עָנִי יְהֵא בִּדְרוֹמוֹ שֶׁל הַפֵּרוֹת.
