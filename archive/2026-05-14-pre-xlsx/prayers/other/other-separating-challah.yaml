sections:
  - id: other-separating-challah-text
    title: Separating Challah
    titleHe: הפרשת חלה
    instruction: "כשלש עיסה מה' מיני דגן בשיעור של קילו ושש מאות ושבעים גרם קמח (שיעור חלה בברכה) מפרישים חלה ומברכים:"
    text: |-
      בָּרוּךְ אַתָּה יְיָ אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ לְהַפְרִישׁ חַלָּה:

      ואומר: הֲרֵי זוֹ חַלָּה.

      יְהִי רָצוֹן מִלְּפָנֶיךָ יְיָ אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ, שֶׁתִּשְׁלַח בְּרָכָה בְּמַעֲשֵׂה יָדֵינוּ, כְּמוֹ שֶׁבֵּרַכְתָּ אֶת עִסַּת שָׂרָה אִמֵּנוּ, וְתִתֵּן לָנוּ לֶחֶם לֶאֱכוֹל וּבֶגֶד לִלְבּוֹשׁ, וְתִשְׁלַח בְּרָכָה בְּכָל מַעֲשֵׂה יָדֵינוּ. אָמֵן:
