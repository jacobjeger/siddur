      לְעֵלָּא מִן כָּל בִּרְכָתָא (בעשי"ת: לְעֵלָּא לְעֵלָּא מִכָּל) וְשִׁירָתָא תֻּשְׁבְּחָתָא וְנֶחֱמָתָא דַּאֲמִירָן בְּעָלְמָא. וְאִמְרוּ אָמֵן: [קהל: אמן]
