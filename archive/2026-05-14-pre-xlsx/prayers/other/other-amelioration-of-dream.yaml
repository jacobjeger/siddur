  - id: other-amelioration-of-dream-text
    title: Amelioration of a Dream
    titleHe: הטבת חלום
    instruction: "מי שראה חלום ונפשו עגומה עליו, יאמר בשעת נשיאת כפים או בשעת ברכת כהנים:"
    text: "רִבּוֹנוֹ שֶׁל עוֹלָם, אֲנִי שֶׁלְּךָ וַחֲלוֹמוֹתַי שֶׁלְּךָ. חֲלוֹם חָלַמְתִּי וְאֵינִי יוֹדֵעַ מַה הוּא. בֵּין שֶׁחָלַמְתִּי אֲנִי לְעַצְמִי, וּבֵין שֶׁחָלְמוּ לִי חֲבֵרַי, וּבֵין שֶׁחָלַמְתִּי עַל אֲחֵרִים — אִם טוֹבִים הֵם, חַזְּקֵם וְאַמְּצֵם וְיִתְקַיְּמוּ בִי וּבָהֶם כַּחֲלוֹמוֹת יוֹסֵף הַצַּדִּיק. וְאִם צְרִיכִים רְפוּאָה, רְפָאֵם כְּחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה מֵחָלְיוֹ, וּכְמִרְיָם הַנְּבִיאָה מִצָּרַעְתָּהּ, וּכְנַעֲמָן מִצָּרַעְתּוֹ, וּכְמֵי מָרָה עַל יְדֵי משֶׁה רַבֵּנוּ, וּכְמֵי יְרִיחוֹ עַל יְדֵי אֱלִישָׁע. וּכְשֵׁם שֶׁהָפַכְתָּ אֶת קִלְלַת בִּלְעָם הָרָשָׁע מִקְּלָלָה לִבְרָכָה, כֵּן תַּהֲפֹךְ כָּל חֲלוֹמוֹתַי עָלַי וְעַל כָּל יִשְׂרָאֵל לְטוֹבָה. שָׁמְרֵנִי, וְחָנֵּנִי, וּרְצֵנִי. אָמֵן:"
