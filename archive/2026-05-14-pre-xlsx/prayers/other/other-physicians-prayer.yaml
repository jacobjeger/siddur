sections:
  - id: other-physicians-prayer-text
    title: Physician's Prayer
    titleHe: תפילת הרופא
    instruction: תפילת הרופא המיוחסת לרמב"ם.
    text: |-
      אֵל עֶלְיוֹן, לִפְנֵי שֶׁאֲנִי מַתְחִיל בְּעִסּוּק הַקָּדוֹשׁ לִרְפֹּא יְצִירֵי כַפֶּיךָ, אֲנִי מִתְחַנֵּן לִפְנֵי כִסֵּא כְבוֹדֶךָ שֶׁתִּתֵּן לִי אֹמֶץ רוּחַ וּמֹחַ, שֶׁיֹּאירוּ שְׁנֵיהֶם שְׁבִילֵי עֲבוֹדָתִי, שֶׁלֹּא יִתְעוּ:
      חַיֵּי בְּנֵי אָדָם וּבְרִיאוּתָם נִמְסְרוּ בְּיָדִי, הַגֵּן עֲלֵיהֶם בְּרַחֲמֶיךָ. תֵּן בְּלִבִּי אַהֲבַת הַמְּלָאכָה וְאַהֲבַת הַבְּרִיּוֹת, וְאַל תַּנַּח לְצַד אַהֲבַת הַבֶּצַע אוֹ רְדִיפַת הַכָּבוֹד לְהִתְעָרֵב בְּעֵסֶק עֲבוֹדָתִי, כִּי אֵלֶּה הֵם אוֹיְבֵי הָאֱמֶת וְהָאַהֲבָה, וְעָלוּל הַדָּבָר שֶׁיַּטְעוּנִי בִּרְפוּאַת חוֹלֶיךָ:
      חַזֵּק כֹּחַ לִבִּי בִּשְׁמִירַת מִדּוֹתָיו, שֶׁיְּהֵא מוּכָן תָּמִיד לְשָׁרֵת עָנִי וְעָשִׁיר, אוֹהֵב וְשׂוֹנֵא, טוֹב וָרָע. בַּחוֹלֶה הַרְאֵנִי רַק אֶת הָאָדָם:
      אַל תִּתֵּן לְפִי שָׂנְאוֹ לְבַטֵּל עֵצָתִי, וְלֹא לְפִי שֶׁאוֹהֵב לְקַבְּלָהּ בְּלִי בְּדִיקָה. תֵּן לִי כֹּחַ, רָצוֹן וְהִזְדַּמְּנוּת לְהַרְחִיב יְדִיעוֹתַי. תֵּן לִי עֲנָוָה כְּלַפֵּי כָּל הַבָּאִים לִשְׁאֹל בַּעֲצָתִי. אָמֵן:
