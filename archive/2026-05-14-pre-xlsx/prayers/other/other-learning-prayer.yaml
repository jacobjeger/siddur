id: other-learning-prayer
name: Before & After Learning
nameHe: תפילת בית המדרש
category: other
timeContext: anytime
sections:
  - id: other-learning-prayer-before
    title: Before Learning
    titleHe: לפני הלימוד
    instruction: "נאמרת לפני לימוד תורה:"
    text: "יְהִי רָצוֹן מִלְּפָנֶיךָ יְיָ אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ, שֶׁלֹּא יֶאֱרַע דְּבַר תַּקָּלָה עַל יָדִי, וְלֹא אֶכָּשֵׁל בִּדְבַר הֲלָכָה, וְיִשְׂמְחוּ בִּי חֲבֵרַי, וְלֹא אֹמַר עַל טָמֵא טָהוֹר וְלֹא עַל טָהוֹר טָמֵא, וְלֹא עַל מֻתָּר אָסוּר וְלֹא עַל אָסוּר מֻתָּר, וְלֹא יִכָּשְׁלוּ חֲבֵרַי בִּדְבַר הֲלָכָה וְאֶשְׂמַח בָּהֶם:"
  - id: other-learning-prayer-after
    title: After Learning
    titleHe: אחרי הלימוד
    instruction: "נאמרת אחרי לימוד תורה:"
    text: "מוֹדֶה אֲנִי לְפָנֶיךָ יְיָ אֱלֹהַי וֵאלֹהֵי אֲבוֹתַי, שֶׁשַּׂמְתָּ חֶלְקִי מִיּוֹשְׁבֵי בֵּית הַמִּדְרָשׁ, וְלֹא שַׂמְתָּ חֶלְקִי מִיּוֹשְׁבֵי קְרָנוֹת. שֶׁאֲנִי מַשְׁכִּים וְהֵם מַשְׁכִּימִים, אֲנִי מַשְׁכִּים לְדִבְרֵי תוֹרָה וְהֵם מַשְׁכִּימִים לִדְבָרִים בְּטֵלִים. אֲנִי עָמֵל וְהֵם עֲמֵלִים, אֲנִי עָמֵל וּמְקַבֵּל שָׂכָר וְהֵם עֲמֵלִים וְאֵינָם מְקַבְּלִים שָׂכָר. אֲנִי רָץ וְהֵם רָצִים, אֲנִי רָץ לְחַיֵּי הָעוֹלָם הַבָּא וְהֵם רָצִים לִבְאֵר שָׁחַת:"
