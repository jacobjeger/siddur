sections:
  - id: other-eruv-tavshilin-text
    title: Eruv Tavshilin
    titleHe: עירוב תבשילין
    instruction: "כשחל יום טוב בערב שבת, עושין עירוב תבשילין מערב יום טוב. לוקח פת ותבשיל ומברך:"
    text: |-
      בָּרוּךְ אַתָּה יְיָ אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ עַל מִצְוַת עֵרוּב:
      בַּהֲדֵין עֵרוּבָא יְהֵא שָׁרֵא לָנָא לַאֲפוּיֵי וּלְבַשּׁוּלֵי וּלְאַטְמוּנֵי וּלְאַדְלוּקֵי שְׁרָגָא וּלְמֶעְבַּד כָּל צָרְכָנָא מִיּוֹמָא טָבָא לְשַׁבְּתָא, לָנָא וּלְכָל יִשְׂרָאֵל הַדָּרִים בָּעִיר הַזֹּאת:
