timeContext: anytime
sections:
  - id: birkhot-hamitzvot-birkhot-hamitzvot
    title: Birkhot Hamitzvot
    titleHe: ברכת המצוות
    instruction: |-
      ברכות המצות:
      מצות עשה מן התורה לעשות מעקה, וצריך שיהיה גבהו לא פחות מעשרה טפחים, ושיהיה חזק שיכולים להשען עליו, ולפני שיקבענו יברך:
    text: "בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ לַעֲשֹוֹת מַעֲקֶה:"
  - id: birkhot-hamitzvot-birkhot-hamitzvot-1
    title: Birkhot Hamitzvot
    titleHe: ברכת המצוות
    instruction: "מצות עשה מן התורה לקבוע מזוזה, וצריך לקבוע אותה על מזוזת ימין הנכנס בתוך חלל הפתח, תחת המשקוף, ובטפח הסמוך לחוץ, ובתחילת שליש העליון של גובה השער מלמטה למעלה, ותהיה זקופה לאורך מזוזת הפתח, ולפני שיקבענה יברך:"
    text: |-
      בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ לִקְבֹּעַ מְזוּזָה:
      ואחר שיקבענה ינשקנה ויאמר - זֶה הַשַּׁעַר לַיֹיָ, צַדִּיקִים יָבֹאוּ בוֹ:
  - id: birkhot-hamitzvot-birkhot-hamitzvot-2
    title: Birkhot Hamitzvot
    titleHe: ברכת המצוות
    instruction: "הקונה מהגוי כלי מתכת או זכוכית, או שקנה מיהודי כלי שנעשה על ידי גוי, חייב להטבילו לפני שישתמש בו, ולפני שיטבלנו יברך:"
    text: |-
      בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ עַל טְבִילַת כֵּלִים ואם מטיב כלי אחד אומר - כֶּלִי:
      ברכת חלה:
  - id: birkhot-hamitzvot-birkhot-hamitzvot-3
    title: Birkhot Hamitzvot
    titleHe: ברכת המצוות
    instruction: 'שיעור עיסה שחייבת בחלה הוא תשע"ז דרהם  גרם קמח, ולפני שתפריש תברך:'
    text: |-
      בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ לְהַפְרִישׁ חַלָּה תְרוּמָה:
      ואחר כך לוקחת דבר מועט ואומרת:­­- הֲרֵי זוֹ חַלָּה:
  - id: birkhot-hamitzvot-birkhot-hamitzvot-4
    title: Birkhot Hamitzvot
    titleHe: ברכת המצוות
    instruction: 'ברכת פטר חמור: חמורה שילדה זכר פטר רחם צריך לפדותו מן הכהן, כמו שנאמר - "ופטר חמור תפדה בשה". ולפני שיפדהו יברך:'
    text: "בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ עַל פִּדְיוֹן פֶּטֶר חֲמוֹר:"
  - id: birkhot-hamitzvot-birkhot-hamitzvot-5
    title: Birkhot Hamitzvot
    titleHe: ברכת המצוות
    instruction: |-
      ויברך שהחיינו:
      סדר ברכת האילנות: הרואה בימי ניסן עצי פרי פורחים אומר:
    text: |-
      "וִיהִי נֹעַם אֲדֹנָי אֱ-לֹהֵינוּ עָלֵינוּ, וּמַעֲשֹה יָדֵינוּ כּוֹנְנָה עָלֵינוּ, וּמַעֲשֹה יָדֵינוּ כּוֹנְנֵהוּ" שם צ, יז:
      בָּרוּךְ אַתָּה יְ‑יָ אֱ‑לֹהֵינוּ מֶלֶךְ הָעוֹלָם, שֶׁלֹּא חִסֵּר בְּעוֹלָמוֹ כְּלוּם, וּבָרָא בוֹ בְּרִיּוֹת טוֹבוֹת וְאִילָנוֹת טוֹבוֹת, לֵהָנוֹת בָּהֶם בְּנֵי אָדָם:
