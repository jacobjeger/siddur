  - id: other-ayin-hora-text
    title: Tefilla against Ayin Hora
    titleHe: תפילה נגד עין הרע
    text: |-
      בְּשֵׁם יְיָ אֱלֹהֵי יִשְׂרָאֵל, מִימִינִי מִיכָאֵל, וּמִשְּׂמֹאלִי גַּבְרִיאֵל, וּמִלְּפָנַי אוּרִיאֵל, וּמֵאֲחוֹרַי רְפָאֵל, וְעַל רֹאשִׁי שְׁכִינַת אֵל:
      רִבּוֹנוֹ שֶׁל עוֹלָם, אֲנִי שֶׁלְּךָ וַחֲלוֹמוֹתַי שֶׁלְּךָ. חֲלוֹם חָלַמְתִּי וְאֵינִי יוֹדֵעַ מַה הוּא. בֵּין שֶׁחָלַמְתִּי לְעַצְמִי, בֵּין שֶׁחָלְמוּ לִי אֲחֵרִים, בֵּין שֶׁחָלַמְתִּי עַל אֲחֵרִים — אִם טוֹבִים הֵם חַזְּקֵם וְאַמְּצֵם, וְאִם צְרִיכִים רְפוּאָה רְפָאֵם, כְּחִזְקִיָּהוּ מֵחָלְיוֹ, וּכְמִרְיָם הַנְּבִיאָה מִצָּרַעְתָּהּ, וּכְנַעֲמָן מִצָּרַעְתּוֹ, וּכְמֵי מָרָה עַל יְדֵי משֶׁה רַבֵּנוּ, וּכְמֵי יְרִיחוֹ עַל יְדֵי אֱלִישָׁע. וּכְשֵׁם שֶׁהָפַכְתָּ אֶת קִלְלַת בִּלְעָם הָרָשָׁע מִקְּלָלָה לִבְרָכָה, כֵּן תַּהֲפֹךְ כָּל חֲלוֹמוֹתַי עָלַי לְטוֹבָה. אָמֵן:
