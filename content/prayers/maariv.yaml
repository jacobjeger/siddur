    text: "בָּרוּךְ ה' לְעולָם. אָמֵן וְאָמֵן: בָּרוּךְ ה' מִצִּיּון שׁכֵן יְרוּשָׁלָיִם. הַלְלוּיָהּ: בָּרוּךְ ה' אֱלהִים אֱלהֵי יִשרָאֵל. עשה נִפְלָאות לְבַדּו: וּבָרוּךְ שֵׁם כְּבודו לְעולָם. וְיִמָּלֵא כְבודו אֶת כָּל הָאָרֶץ. אָמֵן וְאָמֵן:"
