  - id: maariv-vhu-rachum-maariv
    title: V'Hu Rachum (before Barchu)
    titleHe: והוא רחום
    group: Maariv
    sourceRef: archive:maariv-vehu-rachum.yaml#maariv-vehu-rachum
    text: "וְהוּא רַחוּם יְכַפֵּר עָוֹן וְלֹא־יַשְׁחִית וְהִרְבָּה לְהָשִׁיב אַפּוֹ וְלֹא־יָעִיר כָּל־חֲמָתוֹ: יְהֹוָה הוֹשִׁיעָה הַמֶּֽלֶךְ יַעֲנֵֽנוּ בְיוֹם־קָרְאֵֽנוּ:"
    instructionHe: כשיגיע הלילה יתפלל תפלת ערבית. ואינה חובה שלא נתקנה אלא כנגד איברים ופדרים של תמיד של בין הערבים שלא נתעכלו ביום שקרבין והולכין כל הלילה. ומ"מ מצוה איכא ואין לבטלה. ורב אלפס כתב דהאידנא קבעוה חובה ואין לבטלה כלל (טור או"ח רל"ה)
  - id: maariv-barchu-maariv
