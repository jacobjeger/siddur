      שַׁוְעָתֵֽנוּ קַבֵּל וּשְׁמַע צַעֲקָתֵֽנוּ יוֹדֵֽעַ תַּעֲלוּמוֹת:
      בָּרוּךְ שֵׁם כְּבוֹד מַלְכוּתוֹ לְעוֹלָם וָעֶד:
      רִבּוֹנוֹ שֶׁל עוֹלָם אַתָּה צִוִּיתָֽנוּ עַל יְדֵי משֶׁה עַבְדֶּֽךָ לִסְפֹּר סְפִירַת הָֽעֹמֶר כְּדֵי לְטַהֲרֵֽנוּ מִקְּ֒לִפּוֹתֵֽינוּ וּמִטֻּמְאוֹתֵֽינוּ כְּמוֹ שֶׁכָּתַֽבְתָּ בְּתוֹרָתֶֽךָ וּסְפַרְתֶּם לָכֶם מִמָּחֳרַת הַשַּׁבָּת מִיּוֹם הֲבִיאֲכֶם אֶת־עֹֽמֶר הַתְּ֒נוּפָה שֶֽׁבַע שַׁבָּתוֹת תְּמִימוֹת תִּהְיֶֽינָה עַד מִמָּחֳרַת הַשַּׁבָּת הַשְּׁ֒בִיעִית תִּסְפְּ֒רוּ חֲמִשִּׁים יוֹם כְּדֵי שֶׁיִּטָּהֲרוּ נַפְשׁוֹת עַמְּ֒ךָ יִשְׂרָאֵל מִזֻּהֲמָתָם: וּבְכֵן יְהִי רָצוֹן מִלְּ֒פָנֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ שֶׁבִּזְכוּת סְפִירַת הָעֹֽמֶר שֶׁסָּפַֽרְתִּי הַיּוֹם יְתֻקַּן מַה שֶּׁפָּגַֽמְתִּי בִּסְפִירָה (השייכת לאותו הלילה) וְאֶטָּהֵר וְאֶתְקַדֵּשׁ בִּקְדֻשָּׁה שֶׁל מַֽעְלָה וְעַל יְדֵי זֶה יֻשְׁפַּע שֶֽׁפַע רַב בְּכָל־הָעוֹלָמוֹת וּלְתַקֵּן אֶת־נַפְשׁוֹתֵֽינוּ וְרוּחוֹתֵֽינוּ וְנִשְׁמוֹתֵֽינוּ מִכָּל־סִיג וּפְגַם וּלְטַהֲרֵֽנוּ וּלְקַדְּ֒שֵֽׁנוּ בִּקְדֻשָּׁתְ֒ךָ הָעֶלְיוֹנָה אָמֵן סֶֽלָה:
    instructionHe: |-
      ערבית אחר התפלה מתחילין לספור העומר שזמנו מתחלת ליל ט"ז בניסן ומונה והולך מ"ט יום. שכח לספור בתחלת הלילה הולך וסופר כל הלילה. ומצוה על כל אחד ואחד לספור לעצמו. וצריך לספור מעומד ולברך תחלה. וסופר הימים והשבועות כיצד ביום הראשון עומד ומברך על ספירת העומר היום יום אחד עד שמגיע לשבעה ימים ואז יאמר היום שבעה ימים שהם שבוע אחד וביום שמונה יאמר היום שמונה ימים שהם שבוע אחד ויום אחד עד שיגיע לי"ד יאמר היום ארבעה עשר ימים שהם ב' שבועות וכן לעולם. (טור או"ח תפ"ט). ועתה בעונותינו שנתבטלה הבאת העומר אין הספירה מן התורה אלא מדרבנן זכר למקדש. ואם נסתפק לו אם מנה או לא מנה חוזר ומונה בלא ברכה. (אבודרהם).
