  - id: bedtime-shema-misc-kaddish-chatzi
    title: Chatzi Kaddish
    titleHe: חצי קדיש
    group: Kaddish Variations
    sourceRef: Siddur Ashkenaz, Kaddish, Half Kaddish
    text: |-
      חזן:
      יִתְגַּדַּל וְיִתְקַדַּשׁ שְׁמֵהּ רַבָּא. [קהל: אמן]
      בְּעָלְמָא דִּי בְרָא כִרְעוּתֵהּ וְיַמְלִיךְ מַלְכוּתֵהּ בְּחַיֵּיכון וּבְיומֵיכון וּבְחַיֵּי דְכָל בֵּית יִשרָאֵל בַּעֲגָלָא וּבִזְמַן קָרִיב, וְאִמְרוּ אָמֵן: [קהל: אמן]
      קהל וחזן:
      יְהֵא שְׁמֵהּ רַבָּא מְבָרַךְ לְעָלַם וּלְעָלְמֵי עָלְמַיָּא:
      יִתְבָּרַךְ וְיִשְׁתַּבַּח וְיִתְפָּאַר וְיִתְרומַם וְיִתְנַשּא וְיִתְהַדָּר וְיִתְעַלֶּה וְיִתְהַלָּל שְׁמֵהּ דְּקֻדְשָׁא. בְּרִיךְ הוּא. [קהל: בריך הוא:]
      לְעֵלָּא
      בעשי"ת לְעֵלָּא לְעֵלָּא מִכָּל
      מִן כָּל בִּרְכָתָא וְשִׁירָתָא תֻּשְׁבְּחָתָא וְנֶחֱמָתָא דַּאֲמִירָן בְּעָלְמָא. וְאִמְרוּ אָמֵן: [קהל: אמן]
  - id: bedtime-shema-misc-kaddish-shalem
    title: Kaddish Shalem
    titleHe: קדיש שלם
    group: Kaddish Variations
    sourceRef: Siddur Ashkenaz, Kaddish, Kaddish Shalem
    text: |-
      יִתְגַּדַּל וְיִתְקַדַּשׁ
      גרסת הגר"א:
      יִתְגַּדֵּל וְיִתְקַדֵּשׁ
      שְׁמֵהּ רַבָּא.
      בְּעָלְמָא דִי בְרָא כִּרְעוּתֵהּ. וְיַמְלִיךְ מַלְכוּתֵהּ, בְּחַיֵיכוֹן וּבְיוֹמֵיכוֹן וּבְחַיֵי דְּכָל בֵּית יִשְׂרָאֵל, בַּעֲגַלָא וּבִזְמַן קָרִיב וְאִמְרוּ אָמֵן:
      הקהל עונה:
      אמן. יְהֵא שְׁמֵהּ רַבָּא מְבָרַךְ לְעָלַם וּלְעָלְמֵי עָלְמַיָא:
      יְהֵא שְׁמֵהּ רַבָּא מְבָרַךְ לְעָלַם וּלְעָלְמֵי עָלְמַיָא: יִתְבָּרַךְ וְיִשְׁתַּבַּח וְיִתְפָּאַר וְיִתְרוֹמַם וְיִתְנַשֵּׂא וְיִתְהַדָּר וְיִתְעַלֶּה וְיִתְהַלָּל , שְׁמֵהּ דְּקוּדְשָׁא בְּרִיךְ הוּא
      ועונים:
      בְּרִיךְ הוּא
      לְעֵילָא מִן כָּל
      בעשרת ימי תשובה במקום לְעֵילָא מִן כָּל: לְעֵילָא וּלְעֵילָא מִכָּל
      בִּרְכָתָא וְשִׁירָתָא, תֻּשְׁבְּחָתָא וְנֶחָמָתָא, דַאֲמִירָן בְּעָלְמָא. וְאִמְרוּ אָמֵן:
      קהל:
      קַבֵּל בְּרַחֲמִים וּבְרָצון אֶת תְּפִלָּתֵנוּ:
      תִּתְקַבַּל צְלוֹתְהוֹן וּבָעוּתְהוֹן דְּכָל בֵּית יִשְׂרָאֵל קֳדָם אֲבוּהוֹן דִּי בִשְׁמַיָּא , וְאִמְרוּ אָמֵן.
      קהל:
      יְהִי שֵׁם יְהוָה מְברָךְ מֵעַתָּה וְעַד עולָם:
      יְהֵא שְׁלָמָא רַבָּא מִן שְׁמַיָא וְחַיִּים עָלֵינו וְעַל כָּל יִשְׂרָאֵל וְאִמְרוּ אָמֵן:
      קהל:
      עֶזְרִי מֵעִם יְהוָה עשֵׂה שָׁמַיִם וָאָרֶץ:
      עוֹשֶׂה שָׁלוֹם
      בִּמְרוֹמָיו הוּא יַעֲשֶׂה שָׁלוֹם עָלֵינוּ וְעַל כָּל יִשְׂרָאֵל, וְאִמְרוּ אָמֵן:
